<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 844">
  <g transform="translate(60 0)">
    <g transform="translate(190 650) rotate(-35)">
      <!-- sleeve and cuff run toward the bottom-left -->
      <rect x="-330" y="-58" width="290" height="116" rx="26" fill="#B9D0DE"/>
      <rect x="-64" y="-64" width="30" height="128" rx="12" fill="#9AB6C8"/>
      <!-- palm up, fingers together -->
      <rect x="-34" y="-46" width="108" height="92" rx="28" fill="#E8B99A"/>
      <rect x="40" y="-44" width="86" height="19" rx="9.5" fill="#E8B99A"/>
      <rect x="40" y="-23" width="96" height="19" rx="9.5" fill="#E8B99A"/>
      <rect x="40" y="-2" width="92" height="19" rx="9.5" fill="#E8B99A"/>
      <rect x="40" y="19" width="76" height="19" rx="9.5" fill="#E8B99A"/>
      <!-- thumb -->
      <rect x="-10" y="26" width="76" height="24" rx="12" transform="rotate(24 -10 38)" fill="#D39F80"/>
      <!-- palm crease -->
      <rect x="-6" y="-8" width="58" height="5" rx="2.5" fill="#D39F80"/>
    </g>
  </g>
</svg>

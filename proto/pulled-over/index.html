 * Built from: Reigns (Nerial, 2016) - one binary swipe per card, three meters are the stakes, a run ends when a meter

 * and Purho, "Juice it or lose it" (2012) and Nijman (Vlambeer), "The art of screenshake" (2013).
 * Teaching: worked example before problems (Atkinson et al. 2000), retrieval practice with a delayed second ask

 * Rules: 8 rules from 13 fact ids in bank/facts.json (ids sit in the RULES comments).

let AC=null;
function unlock(){try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){} /* iOS: play through the silent switch (wiki green-light-audio-engine) */ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
function tone(f0,f1,d,type,vol,dl){if(!AC)return;try{const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}

  c.fillStyle='rgba(0,0,0,.24)';rr(-L*.14,-Wd/2+4,L*(o.kind==='van'?.52:.36),Wd-8,6);c.fill();

  for(let a=0;a<800;a++){ // every rule gets at least one guilty and one innocent car; WHICH slots are mostly guilty (3 to 5 of 6), so "ticket every third car" is not a free pattern
    g=new Array(NCARS).fill(false);
    for(const k of RK){const idx=[];rules.forEach((q,i)=>{if(q===k)idx.push(i);});
      idx.forEach(i=>{g[i]=r()<(WH(i)?.75:.5);});
      if(!idx.some(i=>g[i]))g[pick(idx,r)]=true;else if(!idx.some(i=>!g[i]))g[pick(idx,r)]=false;}
    const n=g.filter(Boolean).length,wg=g.filter((x,i)=>x&&WH(i)).length;if(n<10||n>13||wg<3||wg>5)continue;
    let run=1,mx=1;for(let i=1;i<NCARS;i++){run=g[i]===g[i-1]?run+1:1;mx=Math.max(mx,run);}
    if(mx<=3)break;}
  const used={},names={},lastInn={};DRIVERS.forEach(d=>names[d.name]=1);const trapSeen={};
  rules.forEach((k,i)=>{if(!g[i])lastInn[k]=i;});  // the last innocent car of a rule shows its tricky exception (divided road, tie, placard, 3 ft exactly)
  return rules.map((k,i)=>{
    const a=ask[i],bad=g[i],tier=bad?(a===1?1:2):(lastInn[k]===i?2:1);
    const pool=V[k].filter(v=>!!v.bad===bad),u=used[k]=used[k]||[];
    let pref=pool.filter(v=>v.t===tier&&u.indexOf(v)<0);
    if(!pref.length)pref=pool.filter(v=>(v.t===tier||v.t===0)&&u.indexOf(v)<0);
    if(!pref.length)pref=pool.filter(v=>u.indexOf(v)<0);  // an unused scene of any tier beats repeating one
    if(!pref.length)pref=pool.filter(v=>v.t===tier||v.t===0);
    if(!pref.length)pref=pool;
    const v=pick(pref,r);u.push(v);
    const drv=DRIVERS.find(d=>d.rule===k&&(i===first[k]||i===last[k]))||null;
    let name,l1,l2,col,kind,desc;
    if(drv){name=drv.name;col=drv.col;kind=drv.kind;desc=drv.desc;l1=drv.greet;l2=drv.sit[0];}
    else{const pal=pick(PAL,r);col=pal[1];kind=pick(Object.keys(KIND),r);desc=pal[0]+' '+kind;const cand=LINES[k];let t=null;
      for(let q=0;q<8;q++){t=pick(cand,r);if(!names[t[0]])break;}
      names[t[0]]=1;name=t[0];l1=t[1];l2=t[2];}
    let opts=null,corr=-1;if(WH(i)&&v.w){opts=shuffle(v.w,r);corr=opts.indexOf(v.w[0]);}
    const trap=TRAPS.indexOf(k)>=0&&a>=2&&!trapSeen[k];if(trap)trapSeen[k]=1;
    const lim=Math.max(3,lerp(6,3.8,i/(NCARS-1))*(a===1?1:a===2?.87:.8));
    return {i,rule:k,bad:bad?1:0,v,drv,name,l1,l2,col,kind,desc,ask:a,tier,which:WH(i),opts,corr,trap,brief:a===1,lim};});}

const mk=()=>({v:PT.start,disp:PT.start,shake:0,flash:0,pop:0});

function blankG(){return {mode:'title',t:0,clock:0,phase:'',idx:0,car:null,m:{chief:mk(),pub:mk(),nerve:mk()},fl:[],pt:[],shake:0,siren:0,red:0,hit:0,
  ban:null,res:[],fails:{},stats:{cars:0,viol:0,good:0,fast:0,slow:0,wrong:0,trapOk:0,trapN:0},mem:{},opts:null,streak:0,ending:null,endT:0,ft:0,fel:0,flim:3,pt0:0,bt:0,taught:0,cf:null,

const K={x:25,y:118,w:340,h:410},PIV=700;
let pracN=0;

/* ---------- scoring: the same function drives the game and the balance sim ---------- */
function judge(c,act,fr,pk){
  const D={chief:0,pub:0,nerve:0},fast=fr<=FAST;let v='r',why=null,st='rightTicket',mult=false;
  if(act==='timeout'){D.nerve=PT.timeN;if(c.bad)D.chief=PT.timeC;why='rule';st='timeout';}
  else if(act==='let'){if(c.bad){D.chief=PT.miss;mult=c.cocky;why='rule';st='wrongPass';}else{v=fast?'g':'y';if(fast)D.pub=PT.fast;st='rightPass';}}
  else if(act==='ticket'){if(!c.bad){D.pub=PT.falseT;mult=c.grudge;why='ok';st='wrongTicket';}else{v=fast?'g':'y';if(fast)D.chief=PT.fast;}}
  else{if(pk===c.corr){v=fast?'g':'y';if(fast)D.chief=PT.fastWhich;}else{D.chief=PT.wrongRule;why='rule';}}
  if(v==='r'&&act!=='timeout')D.nerve+=PT.wrongN;
  const snap=v==='r'&&act!=='timeout'&&fr<=SNAP,f=(mult?1.5:1)*(snap?1.5:1); // a wrong call inside the first 25 percent of the timer is a snap guess: guessing costs more than thinking
  if(f>1)for(const k of MK)if(D[k]<0)D[k]=Math.round(D[k]*f);
  return {v,D,why,mult,snap,fast,st};}
function applyJ(M,Sx,j){const out=[];
  for(const k of MK)if(j.D[k]){M[k].v=clamp(M[k].v+j.D[k],0,100);out.push([k,j.D[k]]);}
  if(j.v==='g'){Sx.streak++;if(Sx.streak%3===0){M.nerve.v=clamp(M.nerve.v+PT.steady,0,100);out.push(['nerve',PT.steady,'STEADY HANDS']);}}else Sx.streak=0;
  return out;}

/* ---------- effects ---------- */
function addFloat(x,y,s,col,sz){G.fl.push({x,y,s,col,t:1,sz:sz||19});}
function scraps(n,x,y,dir){for(let i=0;i<n;i++)G.pt.push({x,y,vx:dir*(80+Math.random()*340)+(Math.random()-.5)*140,vy:-140-Math.random()*280,r:Math.random()*6,vr:(Math.random()-.5)*14,l:1,w:6+Math.random()*8,h:4+Math.random()*5,col:['#ffffff','#ffd54a','#ff4d4d','#4da3ff'][i%4]});}
function fx(dt){for(const k in G.m){const m=G.m[k];m.disp+=(m.v-m.disp)*Math.min(1,dt*7);m.shake=Math.max(0,m.shake-dt*2.2);m.flash=Math.max(0,m.flash-dt*2.5);m.pop=Math.max(0,m.pop-dt*3);}
  G.shake=Math.max(0,G.shake-dt*30);G.siren=Math.max(0,G.siren-dt);G.red=Math.max(0,G.red-dt*2.2);if(G.ban)G.ban.t-=dt;
  if(G.copied>0)G.copied=Math.max(0,G.copied-dt);else if(G.copied<0)G.copied=Math.min(0,G.copied+dt);
  G.fl=G.fl.filter(f=>{f.t-=dt*1.1;f.y-=dt*34;return f.t>0;});
  G.pt=G.pt.filter(p=>{p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.l-=dt*1.1;return p.l>0;});}
function fxMeter(k,d){const m=G.m[k];if(d<0){m.shake=1;m.flash=1;G.shake=Math.max(G.shake,Math.min(11,-d*.5));G.red=Math.max(G.red,.7);}else m.pop=1;
  addFloat(MX[MK.indexOf(k)]+56,48,(d>0?'+':'')+d,d>0?'#6ee7a0':'#ff6b6b',20);}

/* ---------- the calls ---------- */
function resolve(act,pk,fr){
  const c=G.car,s=G.stats;s.cars++;if(c.bad)s.viol++;
  const j=judge(c,act,fr,pk),eff=applyJ(G.m,G,j);
  for(const e of eff){fxMeter(e[0],e[1]);if(e[2])addFloat(W/2,296,e[2]+'  +'+e[1]+' NERVE','#6ee7a0',20);}
  let big,col;
  if(j.v==='g'){const e=eff[0];big='FAST  +'+e[1]+' '+MN[MK.indexOf(e[0])];col='#6ee7a0';}
  else if(j.v==='y'){big='SLOW  +0';col='#ffb020';}
  else if(act==='timeout'){big='TOO SLOW  '+j.D.nerve+' NERVE';col='#ff6b6b';}
  else{const e=eff.find(q=>q[0]!=='nerve')||eff[0];big='WRONG  '+e[1]+' '+MN[MK.indexOf(e[0])];col='#ff6b6b';}
  addFloat(W/2,340,big,col,26);
  if(j.mult)addFloat(W/2,306,'THEY REMEMBER  x1.5','#ffb020',22);
  if(j.snap)addFloat(W/2,274,'SNAP GUESS  x1.5','#ff9f43',20);
  G.res.push(j.v);if(j.v==='r')s.wrong++;else{s.good++;if(j.v==='g')s.fast++;else s.slow++;}
  if(c.trap){s.trapN++;if(j.v!=='r')s.trapOk++;}
  if(c.drv)G.mem[c.drv.id]={state:j.st};
  if(j.v==='r'){G.fails[c.rule]=(G.fails[c.rule]||0)+1;G.lastFail=c.rule;if(!G.firstWrong)G.firstWrong=c.rule;
    const R=RULES[c.rule];G.ban={head:j.why==='ok'?'WHY IT WAS FINE':'THE RULE',txt:j.why==='ok'?(c.v.why||R.ok):R.say,cvc:R.cvc,t:2,lines:wrapText(j.why==='ok'?(c.v.why||R.ok):R.say,318,16,800)};
    sfx.wrong();G.hit=.09;}
  for(const k of MK)if(G.m[k].v<=0&&!G.ending)G.ending=k;}
function startExit(dir){G.phase='exit';G.pt0=0;C.dir=dir;C.x0=C.x;C.vx=0;}
function commit(act){
  if(G.phase!=='decide'&&G.phase!=='enter')return;const c=G.car,fr=c.el/c.lim;
  if(act==='ticket'){G.siren=.55;sfx.ticket();scraps(16,W/2+C.x,330,1);
    if(c.which&&c.bad){c.sf=fr;G.phase='follow';G.fel=0;G.ft=0;G.flim=Math.max(2.8,c.lim*.75);G.opts=c.opts;G.ban=null;return;}
    resolve('ticket',undefined,fr);startExit(1);}
  else{resolve('let',undefined,fr);startExit(-1);}}
function pickChoice(k){if(G.phase!=='follow'||G.ft<.5)return;const c=G.car;G.cf={k};resolve('which',k,Math.max(c.sf,G.fel/G.flim));startExit(1);}
function followTimeout(){G.cf={k:-1};resolve('timeout',null,1);startExit(1);}
function nextCar(){if(G.ending||G.idx+1>=NCARS){endShift();return;}beginCar(G.idx+1);}
function endShift(){G.mode='end';G.endT=0;G.win=!G.ending;G.reason=G.ending||'done';
  META.best=Math.max(META.best,G.stats.good);
  if(G.kind==='daily')META.daily[G.dk]={win:G.win,time:G.clock,n:G.res.length};
  saveMeta();
  let wk=null,wn=0;for(const k in G.fails){const n=G.fails[k];if(n>wn||(n===wn&&k===G.firstWrong)){wn=n;wk=k;}}G.worst=wk?{k:wk,n:wn}:null;} // ties go to the first miss, so the roast and "missed most" agree unless another rule was missed more
function dragPhys(dt,nd){
  if(!nd&&P.down&&P.owner==='card'){C.x+=(clamp(P.x-P.sx,-230,230)-C.x)*Math.min(1,dt*28);C.vx=0;}
  else{C.vx+=(-240*C.x-24*C.vx)*dt;C.x+=C.vx*dt;}
  C.rot=C.x/820;C.y=-Math.min(14,Math.abs(C.x)*.07);
  const arm=Math.abs(C.x)>90;if(arm&&!C.armed&&navigator.vibrate&&P.down){try{navigator.vibrate(8);}catch(e){}}C.armed=arm;}
function update(dt){
  G.t+=dt;fx(dt);

  if(G.mode!=='play')return;
  G.clock+=dt;

  const c=G.car;if(G.phase!=='brief')c.t+=dt; // the card's scene starts at 0 when it appears, not during the briefing

  else if(G.phase==='enter'){G.pt0+=dt;C.ent=Math.min(1,G.pt0/.4);dragPhys(dt);if(C.ent>=1)G.phase='decide';}

  else if(G.phase==='exit'){G.pt0+=dt;const p=Math.min(1,G.pt0/.3),e=eo(p);
    if(C.dir){C.x=C.x0+C.dir*620*e;C.rot=C.x/820+C.dir*.5*e;C.y=-60*e;}else C.y=260*e;
    C.alpha=1-e*.9;if(p>=1)nextCar();}}

/* ---------- share card: Wordle-style text ---------- */
const SQ={g:0x1F7E9,y:0x1F7E8,r:0x1F7E5,n:0x2B1B};
const roastLine=()=>G.firstWrong?ROAST[G.firstWrong]:'No wrong calls. The Chief wants your autograph.';

    'Time '+fmt(G.clock)+'   Chief '+Math.round(G.m.chief.v)+'  Public '+Math.round(G.m.pub.v)+'  Nerve '+Math.round(G.m.nerve.v),

/* ---------- input: touch swipe, mouse drag, keys ---------- */
const btn=k=>({x:25,y:578+k*78+(1-eo(G.ft))*260,w:340,h:66});
const BCOPY={x:45,y:650,w:300,h:60},BAGAIN={x:45,y:722,w:300,h:60};
const inb=(p,b)=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
function ptr(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function tapDown(p){
  if(G.mode==='title'){startShift();return;}
  if(G.mode==='end')return; // the end-card buttons act on release (pUp): a clipboard write needs a user activation, and a touch pointerdown is not one on iOS
  if(G.phase==='brief'){if(G.bt>.9)endBrief();return;}
  if(G.phase==='enter'||G.phase==='decide'||G.phase==='exit')P.owner='card'; // a swipe begun while the last card leaves carries onto the next card
  else if(G.phase==='follow')for(let k=0;k<3;k++)if(inb(p,btn(k))){pickChoice(k);break;}}

cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=ptr(e);P.down=true;P.sx=P.x=P.lx=p.x;P.sy=P.y=p.y;P.lt=e.timeStamp;P.vx=0;P.owner=null;P.moved=false;tapDown(p);});

const pUp=e=>{if(!P.down)return;P.down=false;
  if(G.mode==='end'){if(G.endT>.6){const p=ptr(e);if(inb(p,BCOPY))doCopy();else if(inb(p,BAGAIN))startShift();}P.owner=null;return;}
  if(e.timeStamp-P.lt>80)P.vx=0; /* a paused finger is not a flick */ if(P.owner==='card')release();P.owner=null;};
cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',()=>{P.down=false;P.owner=null;});
addEventListener('keydown',e=>{unlock();
  if(G.mode==='title'){if(e.key===' '||e.key==='Enter')startShift();return;}
  if(G.mode==='end'){if(G.endT>.6){if(e.key==='c')doCopy();else if(e.key===' '||e.key==='Enter')startShift();}return;}
  if(G.phase==='brief'){if(G.bt>.9&&(e.key===' '||e.key==='Enter'))endBrief();return;}
  if(e.key==='ArrowRight')commit('ticket');else if(e.key==='ArrowLeft')commit('let');else if('123'.indexOf(e.key)>=0&&e.key)pickChoice(+e.key-1);});

/* ---------- render ---------- */
const RAIN=Array.from({length:46},(_,i)=>({x:(i*97)%W,y:(i*211)%H,s:380+(i*53)%260}));

function drawBg(){if(!BGC)bgBuild();cx.drawImage(BGC,0,0,W,H);
  cx.strokeStyle='rgba(150,180,255,.12)';cx.lineWidth=1.2;cx.beginPath();for(const d of RAIN){const y=(d.y+G.t*d.s)%H;cx.moveTo(d.x,y);cx.lineTo(d.x-3,y+12);}cx.stroke();}
function lightbar(x,y,k){const ph=Math.floor(G.t*(k>.5?14:2.2))%2;

    cx.fillStyle='rgba('+col+','+(.3+.7*on*k)+')';rr(x+(s?2:-62),y-8,60,16,5);cx.fill();}}
function drawDash(){cx.fillStyle='#0b0f1b';cx.beginPath();cx.moveTo(0,H);cx.lineTo(0,796);cx.quadraticCurveTo(W/2,744,W,796);cx.lineTo(W,H);cx.closePath();cx.fill();
  cx.strokeStyle='#1d2740';cx.lineWidth=3;cx.stroke();lightbar(W/2,800,G.siren>0?1:.35);}
function drawMeters(){MK.forEach((k,i)=>{const m=G.m[k],x=MX[i]+Math.sin(G.t*75)*8*m.shake,y=10,w=112,pop=1+.35*m.pop+(m.shake>0?.12:0);

  if(now>last)PI.push(now-last);last=now;for(let i=0;i<TS*n;i++)update(rd/n);render();PF.push(performance.now()-t0);if(PF.length>1200){PF.shift();PI.shift();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* ---------- test hooks and the balance sim (no UI side effects) ---------- */
function simRun(seed,pR,pF,rnd,policy,kn){
  const sch=makeShift(seed),M={chief:mk(),pub:mk(),nerve:mk()},Sx={streak:0},mem={};let right=0,n=0;
  const known=policy==='known'?new Set(shuffle(RK,rnd).slice(0,kn||0)):null; // a player who knows exactly kn of the 8 rules perfectly and coin-flips the rest
  for(const s of sch){n++;const st=s.drv?mem[s.drv.id]:null;
    const c=Object.assign({},s,{grudge:st==='wrongTicket'&&!s.bad,cocky:(st==='wrongPass'||st==='timeout')&&!!s.bad});
    const fr=rnd()<pF?.3:.8;let ok=rnd()<pR,j;
    if(policy==='ticket')ok=!!s.bad;else if(policy==='let')ok=!s.bad;else if(policy==='idle'){j=judge(c,'timeout',1);}
    else if(policy==='sense'){ // an adult with common sense and no DMV study: reads the five obvious rules right 85 percent of the time (WHICH tap 70 percent), coin-flips curb, bike and four-way
      const obvious=['phone','bus','siren','cross','lights'].indexOf(s.rule)>=0,coin=()=>{const act=rnd()<.5?'ticket':'let';return (act==='ticket'&&s.which&&s.bad)?judge(c,'which',fr,(rnd()*3)|0):judge(c,act,fr);};
      j=(obvious&&rnd()<.85)?((s.which&&s.bad)?judge(c,'which',fr,rnd()<.7?s.corr:(s.corr+1+((rnd()*2)|0))%3):judge(c,s.bad?'ticket':'let',fr)):coin();}
    else if(policy==='known'){
      if(known.has(s.rule))j=(s.which&&s.bad)?judge(c,'which',fr,s.corr):judge(c,s.bad?'ticket':'let',fr);
      else{const act=rnd()<.5?'ticket':'let';j=(act==='ticket'&&s.which&&s.bad)?judge(c,'which',fr,(rnd()*3)|0):judge(c,act,fr);}}
    else if(policy==='struct'||policy==='struct2'||policy==='guess'){ // players with no rule knowledge who know the pattern: ticket every WHICH car, coin flips elsewhere
      const f2=policy==='guess'?.12:fr,pick3=policy==='struct2'?(rnd()<.5?s.corr:(s.corr+1)%3):((rnd()*3)|0);
      j=s.which?(s.bad?judge(c,'which',f2,pick3):judge(c,'ticket',f2)):judge(c,rnd()<.5?'ticket':'let',f2);}
    if(!j){
      if(s.which&&s.bad){
        if(ok)j=judge(c,'which',Math.max(fr,rnd()<pF?.3:.8),s.corr);
        else if(rnd()<.5||policy==='let')j=judge(c,'let',fr);
        else j=judge(c,'which',Math.max(fr,.8),(s.corr+1)%3);
      }else j=judge(c,ok===!!s.bad?'ticket':'let',fr);}
    if(j.v!=='r')right++;applyJ(M,Sx,j);if(s.drv)mem[s.drv.id]=j.st;
    if(MK.some(k=>M[k].v<=0))return {win:false,right,n};}
  return {win:true,right,n};}
window.__po={
  peek(){const c=G.car;return {mode:G.mode,phase:G.phase,idx:G.idx,bad:c?c.bad:null,rule:c?c.rule:null,which:c?c.which:null,ask:c?c.ask:null,trap:c?c.trap:null,brief:c?c.brief:null,
    opts:G.opts,corr:c?c.corr:-1,m:{chief:G.m.chief.v,pub:G.m.pub.v,nerve:G.m.nerve.v},stats:G.stats,ban:G.ban&&G.ban.t>0?G.ban.txt:null,reason:G.reason||null,win:G.win,worst:G.worst,
    name:c?c.name:null,mem:c?c.mem:null,lim:c?c.lim:null,el:c?c.el:null,bt:G.bt,fel:G.fel,flim:G.flim,ft:G.ft,endT:G.endT,clock:G.clock,lines:c?[c.l1,c.l2]:null,res:G.res.join(''),kind:G.kind,copied:G.copied,fl:G.fl.map(f=>f.s)};},
  sched(seed){return makeShift(seed).map(s=>({i:s.i,rule:s.rule,bad:s.bad,which:s.which,ask:s.ask,brief:s.brief,trap:s.trap,drv:s.drv?s.drv.id:null,name:s.name,corr:s.corr,lim:s.lim,vt:s.v.t,vi:V[s.rule].indexOf(s.v)}));},
  seedOf(dk){return hashStr('pulled-over|'+dk);},reveal(){return {reveal:REVEAL,cue:CUE};},
  cueTest(){ // draws every variant at its cue time (title screen only) and counts the pixels that change in the cue box: >= 150 px or the cue is not visible
    const res=[],N=150;cx.setTransform(1,0,0,1,0,0);
    const grab=(k,vi,t)=>{cx.save();cx.beginPath();cx.rect(0,0,SW,SH);cx.clip();SC[k](t,{v:V[k][vi],col:'#4c8be0',kind:'sedan'});cx.restore();return cx.getImageData(0,0,SW,SH).data;};
    const diff=(a,b,bx)=>{let n=0;for(let y=Math.max(0,bx[1]);y<Math.min(SH,bx[1]+bx[3]);y++)for(let x=Math.max(0,bx[0]);x<Math.min(SW,bx[0]+bx[2]);x++){const i=(y*SW+x)*4;if(Math.abs(a[i]-b[i])>40||Math.abs(a[i+1]-b[i+1])>40||Math.abs(a[i+2]-b[i+2])>40)n++;}return n;};
    for(const k of RK)V[k].forEach((v,vi)=>{const c=CUE[k][vi],tw=c[2],n=tw!==undefined?diff(grab(k,vi,c[0]),grab(k,tw,c[0]),c[1]):diff(grab(k,vi,c[0]-.05),grab(k,vi,c[0]+.25),c[1]);
      res.push({rule:k,variant:vi,bad:v.bad,type:tw!==undefined?'twin':'appear',t:c[0],changed:n,ok:n>=N});});
    return res;},
  sceneCost(){const out={};cx.setTransform(1,0,0,1,0,0);for(const k of RK)V[k].forEach((v,vi)=>{const t0=performance.now();for(let i=0;i<120;i++){cx.save();cx.beginPath();cx.rect(0,0,SW,SH);cx.clip();SC[k](i*.03,{v,col:'#4c8be0',kind:'sedan'});cx.restore();}out[k+vi]=+((performance.now()-t0)/120).toFixed(3);});return out;}, // ms per scene draw
  perf(){const st=a=>{const s=a.slice().sort((x,y)=>x-y),n=s.length;return n?{n,mean:+(s.reduce((p,q)=>p+q,0)/n).toFixed(2),p95:+s[Math.floor(n*.95)].toFixed(2),max:+s[n-1].toFixed(2)}:null;};return {jsMsPerFrame:st(PF),frameIntervalMs:st(PI)};},
  options(){const o=[];for(const k of RK)V[k].forEach((v,i)=>{if(v.w)o.push({rule:k,variant:i,w:v.w});});return o;},
  shareText(){return shareText();},copy(){doCopy();},
  sim(o){o=o||{};const n=o.n||400,r=mulberry32((o.seed||1)>>>0);let w=0,ri=0,en=0;
    for(let k=0;k<n;k++){const x=simRun((r()*4294967296)>>>0,o.pR===undefined?.75:o.pR,o.pF===undefined?.5:o.pF,r,o.policy,o.k);if(x.win)w++;ri+=x.right;en+=x.n;}
    return {win:w/n,avgRight:ri/n,avgCars:en/n};}
};

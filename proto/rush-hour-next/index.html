nd transfer","stem":"How long do you have to register a vehicle in California after you start a job or make your home here?","o":["10 days","Until your old state's registration runs out","20 days","60 days"],"ci":2,"r":"A newcomer must register the vehicle within 20 days of establishing residency or taking a job in California.","x":1},{"id":"q-7-026","f":"s11-004","topic":"Registration and transfer","stem":"You moved from Oregon three weeks ago for a new job. Your Oregon registration is valid for another 6 months. What now?","o":["Keep the Oregon registration until it runs out, then switch to California","Register in California now; the 20 days have already passed","Register in California, with the 20 days counted from when the Oregon tag runs out","Register within 60 days of the move, so you still have time"],"ci":1,"r":"You have 20 days after starting work or making a home here. Three weeks is past that limit.","x":1},{"id":"q-7-027","f":"s11-004","topic":"Registration and transfer","stem":"Ben moves from Texas to California with his own car and starts a job. How long does he have to register the car here?","o":["10 days, the same as someone who buys a used car","20 days after he becomes a resident or starts the job","60 days, because the car is already registered in Texas","Not at all while the Texas registration is still in force"],"ci":1,"r":"Newcomers must register within 20 days of establishing residency or getting a job in California.","x":1},{"id":"q-7-028","f":"s11-005","topic":"Smog and emissions","stem":"What does California require of the pollution-control equipment on a registered vehicle?","o":["It must work only on the day of a smog check","It must comply with the state's emission rules at all times","It may be removed if the owner accepts a smog fine","It is the maker's concern, not the owner's"],"ci":1,"r":"Registered vehicles must comply with the state's emission control requirements.","x":1},{"id":"q-7-029","f":"s11-005","topic":"Smog and emissions","stem":"A friend offers to remove the catalytic converter from your registered car for more power. Which statement is right?","o":["It is allowed when a licensed mechanic does the work","It is allowed when the converter is refitted for each smog check","It is not allowed, since a registered car must keep working emission controls","It is allowed on cars made before 1990, which need no smog check"],"ci":2,"r":"Registered vehicles must comply with emission control requirements, so the converter must stay.","x":1},{"id":"q-7-030","f":"s11-005","topic":"Smog and emissions","stem":"Which of these is a California requirement for a registered vehicle?","o":["A title certificate carried in the car at all times","Compliance with a yearly state safety inspection","Compliance with state emission control rules","A brake test passed at each registration renewal"],"ci":2,"r":"California ties registration to emission control compliance. It has no yearly safety inspection.","x":1},{"id":"q-7-031","f":"s11-006","topic":"Smog and emissions","stem":"Which statement about clean air standards and registration is correct?","o":["They are checked once the vehicle is already registered","They must be met for a vehicle to be eligible for registration","They apply mainly to cars less than ten years old","They are met by paying a clean-air fee at registration"],"ci":1,"r":"A vehicle must satisfy California's clean air quality standards to be eligible for registration.","x":1},{"id":"q-7-032","f":"s11-006","topic":"Smog and emissions","stem":"Your car fails its smog check when registration is due. What must happen before the car can be registered?","o":["Nothing, because a promise to repair it within a year is enough","Only the brakes and lights must pass inspection","It must be brought up to California's clean air standards","Nothing, because a smog result only affects resale value"],"ci":2,"r":"A vehicle must satisfy California's clean air standards to be eligible for registration.","x":1},{"id":"q-7-033","f":"s11-006","topic":"Smog and emissions","stem":"Which problem can keep a car from being registered even though it drives well?","o":["Faded paint on the hood and roof","Emissions that fail the clean air standards","Mileage of more than 150,000","An age of more than 15 years"],"ci":1,"r":"A car that does not meet the clean air standards is not eligible for registration.","x":1},{"id":"q-7-034","f":"s11-007","topic":"Smog and emissions","stem":"Which statement about a vehicle found to be a gross polluter is right?","o":["It may be driven there once the owner has paid a smog fine","It may be driven and left standing there, with a warning sticker shown","It may be left standing there, but not driven","It may be neither driven nor left standing there"],"ci":3,"r":"A gross polluter may not be driven or left standing on a public road.","x":1},{"id":"q-7-036","f":"s11-007","topic":"Smog and emissions","stem":"One car needs a repair to pass its smog check. A different car was found to be a gross polluter. Which statement is right?","o":["Neither car is barred, since smog rules apply only when registering","The gross polluter may be driven there, but not left standing","The gross polluter may not be on public roads at all, driven or parked","Both cars are barred until each one passes a smog check"],"ci":2,"r":"The ban on driving or leaving a vehicle standing on a public road names the gross polluter.","x":1},{"id":"q-7-037","f":"s11-008","topic":"Registration and transfer","stem":"You want to handle your car's paperwork without going to an office. Which source is the DMV's full-service one?","o":["The DMV's driver-license appointment page","The DMV's online vehicle registration portal","A private plate-and-sticker service that charges a fee","The highway patrol's public records page"],"ci":1,"r":"Complete registration services and information are available through the official DMV online vehicle registration portal.","x":1},{"id":"q-7-038","f":"s11-008","topic":"Registration and transfer","stem":"Your tag is due soon and the DMV office has a long wait. What can you do instead of queuing?","o":["Book a slot on the DMV's driver-license appointment page","Use the DMV's official online portal","Ask the dealer where you bought the car to renew it","Mail a check to your local highway patrol office"],"ci":1,"r":"The DMV's official online portal offers complete registration services and information.","x":1},{"id":"q-7-039","f":"s11-008","topic":"Registration and transfer","stem":"Which of these can you do through the DMV's official vehicle website?","o":["Buy a liability insurance policy","Pay a fine set by a traffic court","Renew a vehicle's registration","Book a slot at a smog station"],"ci":2,"r":"The portal handles vehicle registration services. Insurance, court fines and smog tests sit with other bodies.","x":1},{"id":"q-7-040","f":"s12-001","topic":"Medical conditions and senior driving","stem":"On what grounds can the DMV investigate whether a driver is still fit to drive?","o":["Reaching a certain birthday, such as 75","A health condition or a poor driving record","An insurer's request or a rise in your premium","A move from another state or a new address"],"ci":1,"r":"The DMV looks at physical or mental conditions and driving record history. Age alone is not the basis.","x":1},{"id":"q-7-041","f":"s12-001","topic":"Medical conditions and senior driving","stem":"Mr. Reyes turns 80. What can the DMV base an investigation of his license on?","o":["His age, since drivers over 75 are always reexamined","The number of years since he got his first license","His health and his driving record","A parking fine he paid last year"],"ci":2,"r":"The DMV investigates on the basis of physical or mental conditions and driving record, not solely on age.","x":1},{"id":"q-7-042","f":"s12-001","topic":"Medical conditions and senior driving","stem":"Which of these could lead the DMV to look into a driver's fitness?","o":["Becoming a senior driver","Holding a license for decades","A medical condition that affects driving","Owning an older, high-mileage car"],"ci":2,"r":"A physical or mental condition that affects driving is a valid basis. Age, license years and car age are not.","x":1},{"id":"q-7-043","f":"s12-003","topic":"Medical conditions and senior driving","stem":"Which of these may the DMV do after it reexamines a driver?","o":["Only recommend that the driver see a doctor","Add restrictions, or suspend or revoke the license","Add points to the driver's record","Take away the license for a fixed 30 days in every case"],"ci":1,"r":"After a reexamination the DMV may request medical records, test the driver, add restrictions, or suspend or revoke the license.","x":1},{"id":"q-7-044","f":"s12-003","topic":"Medical conditions and senior driving","stem":"A reexamination shows that a driver's reaction time has slowed. Which of these may the DMV do?","o":["Impound the driver's vehicle until retested","Add points to the driver's record","Add a restriction to the driver's license","Fine the driver for the slow reactions"],"ci":2,"r":"After a reexamination the DMV may add driving restrictions, or suspend or revoke the license.","x":1},{"id":"q-7-045","f":"s12-003","topic":"Medical conditions and senior driving","stem":"After a DMV reexamination, which pair of actions may the DMV take?","o":["Add points to the record, and order traffic school","Move the driver to a probationary license, with a cosigner","Request medical records, and impose a driving restriction","Notify the driver's insurer, and order a $500 penalty"],"ci":2,"r":"After reexamination the DMV may request medical records, test, restrict, suspend or revoke.","x":1},{"id":"q-7-046","f":"s12-004","topic":"Medical conditions and senior driving","stem":"Which of these can be a license restriction based on a medical condition?","o":["A written exam retaken every year","A yearly refresher course at a driving school","A limit of one passenger under age 20","Hand controls fitted to the vehicle"],"ci":3,"r":"Medical restrictions may include mechanical devices such as hand controls, time and place limits, or vision correction.","x":1},{"id":"q-7-047","f":"s12-004","topic":"Medical conditions and senior driving","stem":"After a reexamination, a driver with limited leg strength gets a medical restriction on the license. Which restriction fits?","o":["A co-driver over age 25 on every trip","A speed limiter that holds the car under 45 mph","A breath-test device on the dashboard","Hand controls fitted to the car"],"ci":3,"r":"Medical restrictions may require mechanical devices such as hand controls.","x":1},{"id":"q-7-048","f":"s12-004","topic":"Medical conditions and senior driving","stem":"Which of these is a medical restriction rather than a suspension?","o":["A bar on all driving for 30 days, until a hearing","A requirement to wear corrective lenses while driving","A bar on all driving until a doctor signs a form","A requirement to renew the license in person every month"],"ci":1,"r":"A restriction adds conditions such as vision correction. A suspension stops driving.","x":1},{"id":"q-7-049","f":"s12-005","topic":"Medical conditions and senior driving","stem":"Which of these can the DMV use as the basis for a restriction on an adult driver's license?","o":["A family member's request to the DMV","The driver reaching age 70 or older","A documented medical or driving condition","An officer's verbal warning at a traffic stop"],"ci":2,"r":"The DMV bases restrictions on documented medical and driving conditions, never on age discrimination.","x":1},{"id":"q-7-050","f":"s12-005","topic":"Medical conditions and senior driving","stem":"Mrs. Cho, 78, is asked to take a driving test. What is the real basis for such a request?","o":["A report from a stranger with no documentation","Her age, since the DMV retests everyone over 75","A routine retest every ten years for all drivers","A documented medical or driving concern"],"ci":3,"r":"The DMV acts on documented medical and driving conditions, never on age discrimination.","x":1},{"id":"q-7-051","f":"s12-005","topic":"Medical conditions and senior driving","stem":"Two drivers, aged 79 and 45, are each given a license restriction. What decides each restriction?","o":["Each driver's age, with stricter limits after age 75","Each driver's record of renewals, with a limit for any late one","Each driver's documented medical and driving condition","Each driver's vehicle type and the age of the car"],"ci":2,"r":"DMV restrictions rest on documented medical and driving conditions, never on age.","x":1},{"id":"q-7-052","f":"s12-006","topic":"Medical conditions and senior driving","stem":"How soon must you contact the DMV after a priority reexamination notice?","o":["Within 10 working days","Within 5 working days","Within 30 days","Before your next renewal"],"ci":1,"r":"A priority reexamination notice requires you to contact the DMV within 5 working days.","x":1},{"id":"q-7-053","f":"s12-006","topic":"Medical conditions and senior driving","stem":"A priority reexamination notice arrives while you are busy at work. What happens if you do not contact the DMV in time?","o":["The DMV sends a second notice, then suspends after 30 days","A late fee applies, and you get another 5 working days","The notice lapses unless your doctor contacts the DMV","Your driving privilege is suspended automatically once the 5 working days pass"],"ci":3,"r":"Without contact within 5 working days, the driving privilege is suspended automatically.","x":1},{"id":"q-7-054","f":"s12-006","topic":"Medical conditions and senior driving","stem":"A priority reexamination notice arrives. How long do you have to contact the DMV?","o":["10 calendar days","5 working days","30 days, the DMV's usual notice period","Until the date of your next license renewal"],"ci":1,"r":"A priority notice requires contact within 5 working days.","x":1},{"id":"q-7-055","f":"s13-001","topic":"Senior renewal and ID cards","stem":"At what age can a driver no longer renew a license by mail?","o":["65","75","70","80"],"ci":2,"r":"A driver age 70 or older cannot renew by mail.","x":1},{"id":"q-7-056","f":"s13-001","topic":"Senior renewal and ID cards","stem":"Marta is 71. Her license expires next month and a renewal form came in the mail. What must she do?","o":["Mail the form back with a note from her doctor","Wait for the DMV to send a new license automatically","Pay a higher fee to renew by mail anyway","Go to a DMV office instead of mailing it back"],"ci":3,"r":"At 70 or older she cannot renew by mail, so she renews at an office.","x":1},{"id":"q-7-057","f":"s13-001","topic":"Senior renewal and ID cards","stem":"Which of these rules starts at age 70?","o":["Driving after dark is no longer allowed","Renewing by mail is no longer allowed","Driving on freeways is no longer allowed","A doctor's note is required at each renewal"],"ci":1,"r":"A driver age 70 or older cannot renew a license by mail.","x":1},{"id":"q-7-058","f":"s13-002","topic":"Medical conditions and senior driving","stem":"Beyond the vision test, what may the DMV require of senior drivers?","o":["Further medical examinations, for some of them","A yearly road test, for some of them","A written test every two years, for all of them","A higher renewal fee, for all of them"],"ci":0,"r":"Some senior drivers may be required to pass additional medical examinations beyond vision testing.","x":1},{"id":"q-7-059","f":"s13-002","topic":"Medical conditions and senior driving","stem":"At renewal, a DMV worker has concerns about Mr. Lee's health. What may the DMV require?","o":["Further medical examinations beyond the vision test","Nothing more, since he passed the vision test","A yearly road test for as long as he holds the license","A new written test on recent law changes"],"ci":0,"r":"Based on its assessment, the DMV may require some seniors to pass medical examinations beyond vision testing.","x":1},{"id":"q-7-060","f":"s13-002","topic":"Medical conditions and senior driving","stem":"Which statement about senior drivers and medical exams is right?","o":["Some are asked, as the DMV judges each case","Some are asked, but only after a crash","Every driver over 70 must take one","Seniors choose whether to take one"],"ci":0,"r":"Only some senior drivers face extra medical exams, and the DMV's assessment decides.","x":1},{"id":"q-7-061","f":"s13-004","topic":"Senior renewal and ID cards","stem":"At what age can a California resident get a senior ID card at no cost?","o":["60","62","65","70"],"ci":1,"r":"California residents age 62 and older can get a senior identification card free of charge.","x":1},{"id":"q-7-062","f":"s13-004","topic":"Senior renewal and ID cards","stem":"Carlos, 63, no longer drives and needs a photo ID. What does the DMV charge for a senior ID card?","o":["The same fee as for any adult","Half the usual price","Nothing, because he is over 62","Nothing, but only once he reaches 65"],"ci":2,"r":"Residents aged 62 and older get the senior ID card at no cost.","x":1},{"id":"q-7-063","f":"s13-004","topic":"Senior renewal and ID cards","stem":"Which of these does the DMV give residents age 62 and older at no charge?","o":["A license renewal","A senior identification card","A vision exam at any age","A replacement registration card"],"ci":1,"r":"A senior identification card is free for residents age 62 and older. License renewal still has a fee.","x":1},{"id":"q-7-064","f":"s13-005","topic":"Senior renewal and ID cards","stem":"What may a senior do who decides he can no longer drive safely?","o":["Voluntarily exchange the license for a non-driving ID card","Let the license expire and keep using it as photo ID","Ask a doctor to cancel the license","Hand the license to an adult child for safekeeping"],"ci":0,"r":"A senior who decides he cannot drive safely may voluntarily exchange the license for a non-driving identification card.","x":1},{"id":"q-7-065","f":"s13-005","topic":"Senior renewal and ID cards","stem":"Grandpa decides night driving is unsafe for him. He wants to formally give up driving and keep a photo ID. What does he do?","o":["Exchange the license for a non-driving ID card","Keep the license in his wallet but never drive","Let the license expire and use it as ID","Ask a doctor to cancel it for him"],"ci":0,"r":"A voluntary exchange for a non-driving identification card ends the driving privilege and gives him ID.","x":1},{"id":"q-7-066","f":"s13-005","topic":"Senior renewal and ID cards","stem":"A senior wants to stop driving for good and still needs photo ID. Which step fits?","o":["Exchange the license for a non-driving ID card","Ask the DMV to suspend the license so the card turns into ID","Let the license expire and keep using it as ID","Order a duplicate license with a no-driving note"],"ci":0,"r":"A senior can voluntarily exchange the license for a non-driving identification card. A suspension is a DMV action, and it does not give ID.","x":1},{"id":"q-7-067","f":"s3-08","topic":"Vehicle safety check and test car","stem":"Which two things must the car you use for the behind-the-wheel test have?","o":["A recent safety inspection and a smog certificate from the past 30 days","A clean title and a full tank of fuel","Valid insurance and a recent safety inspection","Valid insurance and current registration"],"ci":3,"r":"The test vehicle must have valid insurance and current registration.","x":1},{"id":"q-7-068","f":"s3-08","topic":"Vehicle safety check and test car","stem":"You arrive for your road test in your uncle's car. Its insurance is current, but its registration ran out last month. What do you do?","o":["Ask the examiner to accept the valid insurance alone","Reschedule for later the same day, with the same car","Pay a late fee at the desk and take the test","Reschedule, and bring a car with all its papers current"],"ci":3,"r":"The test vehicle needs both valid insurance and current registration.","x":1},{"id":"q-7-069","f":"s3-08","topic":"Vehicle safety check and test car","stem":"Which two requirements belong to the car you bring to the behind-the-wheel test, rather than to you?","o":["A completed application and proof of your legal presence","A vision screening passed that day and your learner's permit","Valid insurance and a vision screening passed that day","Valid insurance and current registration"],"ci":3,"r":"Insurance and registration belong to the test vehicle.","x":1},{"id":"q-7-070","f":"s3-09","topic":"Vehicle safety check and test car","stem":"What must the contract say if you take your road test in a rental car?","o":["The contract permits test use without any exclusions","The contract names a second driver, such as a parent or friend","The contract names the examiner as an additional driver","The contract includes the rental firm's own insurance package"],"ci":0,"r":"A rental contract must permit the applicant to use the vehicle for behind-the-wheel testing without exclusions.","x":1},{"id":"q-7-071","f":"s3-09","topic":"Vehicle safety check and test car","stem":"You rent a car for your road test. The contract lists driving tests as an excluded use. What should you do?","o":["Cross out the exclusion and initial it yourself","Take the clerk's verbal OK and use the car anyway","Ask the examiner to sign the exclusion off","Rent a car whose contract allows the test"],"ci":3,"r":"The contract must allow the test use without exclusions, so this rental does not qualify.","x":1},{"id":"q-7-072","f":"s3-09","topic":"Vehicle safety check and test car","stem":"Which problem would make a rental car unacceptable for the road test?","o":["A clause excluding use for driving tests","Registration in the rental firm's name, not yours","A rental period of only one day","Insurance bought from the rental firm"],"ci":0,"r":"A contract that excludes testing use makes the rental unacceptable. Who is the registered owner, the rental length and the insurer do not matter.","x":1},{"id":"q-7-073","f":"s3-10","topic":"Vehicle safety check and test car","stem":"Which condition must the windshield of a test car meet?","o":["Free of cracks, even small ones outside the driver's view","Free of cracks only in the part the driver looks through","Cracks are fine if they are shorter than six inches","Cracks are fine if the glass has been taped over"],"ci":0,"r":"The windshield must be clear and free of cracks.","x":1},{"id":"q-7-074","f":"s3-10","topic":"Vehicle safety check and test car","stem":"The driver's window on your test car will not roll down. What do you do?","o":["Give hand signals through the passenger window","Drive extra slowly and accept the risk","Get it repaired before the test","Tell the examiner at the start and test anyway"],"ci":2,"r":"The driver window must be operational for the car to be used in the test.","x":1},{"id":"q-7-075","f":"s3-10","topic":"Vehicle safety check and test car","stem":"The examiner points to a crack in your windshield on test day. What happens?","o":["The car is rejected, unless the crack is outside your line of sight","The test goes ahead if you agree to repair the glass this week","The car is rejected until the windshield is free of cracks","The test goes ahead, with points deducted for the crack"],"ci":2,"r":"A test car's windshield must be free of cracks.","x":1},{"id":"q-7-076","f":"s3-11","topic":"Vehicle safety check and test car","stem":"How many rearview mirrors must the test car have, and where must one of them be?","o":["Two, one of them on the right side","One, mounted inside on the windshield","Two, both mounted inside the cabin","Two, one of them on the left side"],"ci":3,"r":"The car needs at least two working rearview mirrors, one of them mounted on the left side.","x":1},{"id":"q-7-077","f":"s3-11","topic":"Vehicle safety check and test car","stem":"The car you plan to test in has two mirrors: one inside and one on the right side. What must you add before the test?","o":["A working mirror on the left side","A second mirror on the right side","A backup camera in place of a left mirror","A wider inside mirror"],"ci":0,"r":"A test car needs at least two working mirrors, one on the left side. Only a left-side mirror fixes the gap.","x":1},{"id":"q-7-078","f":"s3-11","topic":"Vehicle safety check and test car","stem":"Which mirror setup would pass the examiner's check?","o":["One inside mirror and one mirror on the right side","One inside mirror and one mirror on the left side","Two inside mirrors, a main and a wide-angle","One left mirror only, since an inside mirror adds little"],"ci":1,"r":"A test car needs at least two functional rearview mirrors, one mounted on the left side.","x":1},{"id":"q-7-079","f":"s3-12","topic":"Vehicle safety check and test car","stem":"From how far away must the horn on a test car be audible?","o":["100 feet","500 feet","300 feet","200 feet"],"ci":3,"r":"The horn must be audible from 200 feet or more.","x":1},{"id":"q-7-080","f":"s3-12","topic":"Vehicle safety check and test car","stem":"Before your road test a friend presses the brake pedal while you stand behind the car, and no red light shows. What should you do?","o":["Use the car and signal every stop with your arm","Have a red reflector fixed to the rear window","Use the car if the reverse lights still work","Have the brake lights repaired before the test"],"ci":3,"r":"Brake lights must be fully operational on the test car.","x":1},{"id":"q-7-081","f":"s3-12","topic":"Vehicle safety check and test car","stem":"What is the minimum distance from which a test car's horn must be audible?","o":["A minimum of 100 feet","A minimum of 200 feet","A minimum of 300 feet, like a bicycle's front light","A minimum of 50 feet"],"ci":1,"r":"The horn must be audible from 200 feet or more.","x":1},{"id":"q-7-082","f":"s3-13","topic":"Vehicle safety check and test car","stem":"What is the minimum tread depth for the tires of a test car?","o":["1/8 inch","1/32 inch","1/4 inch","1/16 inch"],"ci":1,"r":"Tires must have at least 1/32 inch of tread. Donut spare tires are not permitted.","x":1},{"id":"q-7-083","f":"s3-13","topic":"Vehicle safety check and test car","stem":"This morning a tire on your test car went flat, so you put on the small temporary spare. What does the examiner require?","o":["Use the spare, but only if it is inflated to full pressure","Cancel the test, since only a brand-new tire is accepted","Use the spare, but only if you tell the examiner first","Use a full-size tire in place of the spare"],"ci":3,"r":"Donut spares are not permitted for the test, so a normal tire must go on.","x":1},{"id":"q-7-084","f":"s3-13","topic":"Vehicle safety check and test car","stem":"Which tire problem makes a car unacceptable for the road test?","o":["Two different tire brands on the car","A donut spare mounted on the car","Tread of 3/32 inch on every tire","All-season tires in place of summer tires"],"ci":1,"r":"A donut spare is not permitted. Mixed brands, tread above the 1/32-inch minimum and all-season tires are fine.","x":1},{"id":"q-7-085","f":"s3-15","topic":"Knowledge and road test procedure","stem":"Which of these may not be used during the behind-the-wheel test?","o":["Power steering","An automatic transmission gearbox","Automated parallel parking","Anti-lock brakes"],"ci":2,"r":"Advanced driver assistance systems such as automated parallel parking and lane departure cannot be used in the test.","x":1},{"id":"q-7-086","f":"s3-15","topic":"Knowledge and road test procedure","stem":"Your car can park itself at the push of a button. At the test, how do you do the parallel parking?","o":["Let the system park, with your hands near the wheel","Park by hand, with the self-parking feature switched off","Park by hand, but let the system steer the last foot","Use the system, and tell the examiner you are doing so"],"ci":1,"r":"Automated parking cannot be used during behind-the-wheel testing.","x":1},{"id":"q-7-087","f":"s3-15","topic":"Knowledge and road test procedure","stem":"Your car's lane departure and self-parking features switch on by default. What do you do on test day?","o":["Leave the systems on, with your hands on the wheel","Switch both systems off before the test starts","Switch off self-parking only, since lane departure just warns you","Leave the systems on, and tell the examiner before you start"],"ci":1,"r":"Driver assistance systems cannot be used during behind-the-wheel testing.","x":1},{"id":"q-7-091","f":"s7_p11_roadway-022","topic":"Cargo and loads","stem":"How far may a load stick out past the right fender of your vehicle?","o":["Up to 12 inches","Up to 4 feet, if flagged","Up to 6 inches","Up to 18 inches"],"ci":2,"r":"Cargo that extends more than 6 inches beyond the right fender is illegal.","x":1},{"id":"q-7-092","f":"s7_p11_roadway-022","topic":"Cargo and loads","stem":"A long board on your pickup sticks out about 9 inches past the right fender. What should you do?","o":["Pull it in so it sticks out no more than 6 inches","Hang a bright flag at its tip and drive on","Move it to the left side, where there is more room","Pull it in until it sticks out only 8 inches"],"ci":0,"r":"Cargo may not extend more than 6 inches beyond the right fender.","x":1},{"id":"q-7-093","f":"s7_p11_roadway-022","topic":"Cargo and loads","stem":"Which rule is right for cargo at the sides of a vehicle?","o":["Both sides: up to 6 inches past the fender","Left side: up to 6 inches; right side: none","Right side: up to 6 inches; left side: none","Both sides: none beyond the fender"],"ci":2,"r":"A load may stick out up to 6 inches on the right. It may not pass the fender on the left.","x":1},{"id":"q-7-094","f":"s7_p11_roadway-023","topic":"Cargo and loads","stem":"How far past the fender line may cargo extend on the left side of a vehicle?","o":["Zero inches past the fender","One inch past the fender","Six inches past the fender","Twelve inches past the fender"],"ci":0,"r":"Cargo cannot extend beyond the fenders on the left side.","x":1},{"id":"q-7-095","f":"s7_p11_roadway-023","topic":"Cargo and loads","stem":"You carry a ladder and its left end sticks out 3 inches beyond your left fender. What do you do?","o":["Leave it, since 6 inches is allowed on every side","Slide it inward so it stays within the left fender line","Tie a red flag on the end and drive on","Shift it inward by 1 inch and drive on"],"ci":1,"r":"On the left side cargo may not extend beyond the fender, so even 3 inches is too much.","x":1},{"id":"q-7-096","f":"s7_p11_roadway-023","topic":"Cargo and loads","stem":"Boards are tied to a car's roof rack and stick out sideways. Which description breaks the rule on load width?","o":["The boards stay level with the left-side fenders, with a red flag on the end","The boards stay inside both fenders, but ride high above the roof","The boards stick out past the left-side fenders, with a red flag on the end","The boards stay inside the left-side fenders, tied down with two straps"],"ci":2,"r":"Cargo cannot extend beyond the fenders on the left side of a vehicle.","x":1},{"id":"q-7-097","f":"s7_p11_roadway-024","topic":"Cargo and loads","stem":"When is a load too heavy or too high to drive with?","o":["When it weighs more than 500 pounds","When it sits higher than the roof","When it costs you control or view","When it is not covered by a tarp"],"ci":2,"r":"Never drive a vehicle overloaded to the point where you lose control or visibility.","x":1},{"id":"q-7-098","f":"s7_p11_roadway-024","topic":"Cargo and loads","stem":"On moving day, boxes on the front passenger seat block half your view through the windshield. What do you do?","o":["Drive slowly in the right lane with your hazard lights on","Leave it if every box is tied down well","Leave it if the trip is under 5 miles","Rearrange the load so you can see and control the car"],"ci":3,"r":"You may not drive when the load costs you visibility or control of the vehicle.","x":1},{"id":"q-7-099","f":"s7_p11_roadway-024","topic":"Cargo and loads","stem":"Which effect of an overloaded vehicle makes it illegal to drive?","o":["The car rides lower than usual","The trunk lid will not close","You lose control or cannot see well","The car weighs more than when it is empty"],"ci":2,"r":"Never drive a vehicle overloaded to the point where you lose control or visibility.","x":1},{"id":"q-7-100","f":"s7_p11_roadway-025","topic":"Cargo and loads","stem":"What must be done with a dog that rides in the open bed of a pickup?","o":["It must be properly secured","Nothing, if the tailgate is up","Nothing, if the dog is well trained","It must wear a collar with a tag"],"ci":0,"r":"Animals in a truck bed must be properly secured to prevent them from falling or jumping out.","x":1},{"id":"q-7-101","f":"s7_p11_roadway-025","topic":"Cargo and loads","stem":"You drive a pickup at 35 mph through town with your dog loose in the bed. A friend says the closed tailgate is enough. What do you do?","o":["Slow to 20 mph and keep driving","Leave the dog, because it is calm","Secure the dog so it cannot fall or jump out","Rely on the tailgate and stay on side streets"],"ci":2,"r":"Animals in a truck bed must be secured. A tailgate or a calm dog is not enough.","x":1},{"id":"q-7-102","f":"s7_p11_roadway-025","topic":"Cargo and loads","stem":"Which of these meets the rule for an animal in an open truck bed?","o":["A raised tailgate that is latched shut","A trained dog that stays put when told","A tether that stops it falling out","Driving slowly on side streets only"],"ci":2,"r":"The animal must be secured. Tailgates, training and low speed do not secure it.","x":1},{"id":"q-7-103","f":"s7_p11_roadway-026","topic":"Phones and screens while driving","stem":"Which kind of video screen may a driver not have on while driving?","o":["A screen showing entertainment or business content","A gauge display that shows speed and fuel level","A map screen that shows only the route","A camera view of the area behind the car while backing up"],"ci":0,"r":"A driver may not drive when a screen showing entertainment or business content is on and visible to the driver.","x":1},{"id":"q-7-104","f":"s7_p11_roadway-026","topic":"Phones and screens while driving","stem":"Which of these is banned while you drive?","o":["A route map shown on a dash screen","A streaming show playing on a dash tablet","A backup-camera view while you reverse","A speedometer shown on a dash screen"],"ci":1,"r":"A video screen showing entertainment or business content may not be on and visible to the driver.","x":1},{"id":"q-7-105","f":"s7_p11_roadway-026","topic":"Phones and screens while driving","stem":"Which of these is covered by the video-screen ban for drivers?","o":["A navigation map showing the route ahead","A movie the driver can see","A gauge display for speed and fuel","A reversing camera view while backing up"],"ci":1,"r":"The ban covers entertainment or business video visible to the driver. Maps, gauges and reversing views are not that.","x":1},{"id":"q-7-115","f":"s7c-13","topic":"Cargo and loads","stem":"In daytime, how far must a load stick out past the rear of your vehicle before it needs a red or orange flag?","o":["Two feet or more","Six inches or more","Eight feet or more","Four feet or more"],"ci":3,"r":"A load that sticks out four feet or more past the rear must show a red or fluorescent orange flag in daytime.","x":1},{"id":"q-7-116","f":"s7c-13","topic":"Cargo and loads","stem":"At noon you haul a pipe that sticks out 5 feet past your tailgate. What must you add at its end?","o":["A single red light at the end","A white flag on a pole","Nothing, because it is daytime and clear","A red or fluorescent orange flag"],"ci":3,"r":"A load sticking out four feet or more past the rear needs a red or fluorescent orange flag in daytime.","x":1},{"id":"q-7-117","f":"s7c-13","topic":"Cargo and loads","stem":"Which pair is right for a load that sticks out four feet or more past the rear?","o":["Day: two red lights; night: a flag","Day: nothing; night: one red light","Day: a white flag; night: two white lights","Day: a red or orange flag; night: two red lights"],"ci":3,"r":"By day the end of the load carries a red or fluorescent orange flag. At night it carries two red lights.","x":1},{"id":"q-7-118","f":"s7c-14","topic":"Cargo and loads","stem":"At night, what must mark a load that sticks out four feet or more past the rear?","o":["A red flag held out on a pole","One bright white lamp at the end of the load","Two red lights at the end of the load","A single red lamp fixed to the taillamp bracket"],"ci":2,"r":"A load sticking out four feet or more needs two red lights at night.","x":1},{"id":"q-7-119","f":"s7c-14","topic":"Cargo and loads","stem":"After dark you drive home with a plank that sticks out 6 feet past your tailgate. What must you show at its end?","o":["Two red lights at the end of it","A red flag at the end, as in daytime","One red light mounted at the center","Your hazard lights, switched on"],"ci":0,"r":"At night a load of four feet or more past the rear needs two red lights.","x":1},{"id":"q-7-120","f":"s7c-14","topic":"Cargo and loads","stem":"A load sticks out 5 feet past the rear of your vehicle at night. What does the law require?","o":["A red flag on the end of the load, with no lights needed","One red light at the end of the load, plus a red flag","Two red lights at the end of the load","A white light at the end of the load, visible to the rear"],"ci":2,"r":"A load sticking out four feet or more needs two red lights at night.","x":1},{"id":"q-7-124","f":"s7c-16","topic":"Cargo and loads","stem":"Under what condition may a driver carry people in the back of a pickup truck?","o":["If they sit with their backs against the cab","If they sit down and hold the side rail tightly","If a federal-standard restraint secures them","If the truck stays under 35 mph on city streets"],"ci":2,"r":"A driver may not carry people in the back of a pickup unless they are /* ---------- RH8c (card RH8c, Kyle 10-13): fair turns ----------
 Built from: the CVC 22108 rule (signal for the last 100 ft before a turn) and the human-factors rule of a warning sign that gives a reaction time, not a fixed distance
 (brief time = read time + reaction time + lane-change time). Four fixes:
 (a) the turn instruction appears so that the player has a time budget before the 100 ft point: read time (0.3 s per word, at least 2.0 s) + 1.5 s to react + 1.0 s if a lane change is needed.
     Spawn distance = 30 m + the metres between the 100 ft point's turn trigger and the corner + speed x budget, never under TURN_SP (100 m) (v8: a fixed 100 m = 3.7 s at stage 4, 2.5 s at stage 9);
 (b) a white SIGNAL line is painted 30 m before the corner from the first frame, with a 100 FT sign at the roadside; the banner has a bar that empties as the car nears the line;
 (c) the judge reads the lane the player chose (g.lane, the lane tapped to), not the x position in the middle of a lane-change animation (carX);
 (d) a right turn (or the either-way junction) on a road whose curb lane is parking or shoulder opens that lane as a travel lane (no parked car, red curb) from the instruction to the corner. */
const SIG_FT=30;   /* m: 100 ft (30.48) before the turn trigger */

   MUTCD file of window.SIGN_ASSETS (data_signs.js; file, Commons URL and licence per sign in bank/signs.json). Build from: the Wikimedia
   Commons "MUTCD" SVG set (licence template PD-USGov-MUTCD) and the Federal Highway Administration MUTCD sign designs.
   How it plugs in without touching the sit_*.js files: this file loads after them and REPLACES the sign-drawing functions by
   assignment (drawSignBoard, stopSign, noSign, dneSign, oneWay, pennant, signPole). Each new function draws the real file; if the
   file has no match (the boards listed in SR.fallback) or is not decoded yet, it calls the old hand drawing. The few signs that sit_*.js
   draws inline (crossroad, hill, yield, crossbuck) get a one-line guard `if(SR.sign('id'))return;` from the build.json patches.
   A real sign shows its own face. Text on a real face (STOP, ONE WAY) is the real sign; the rapid round never asks about such a face

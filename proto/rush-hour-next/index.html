<script>
'use strict';
/* RUSH HOUR v5 (card RH5a, Kyle played v4a on 2026-10-11: "The game is mixing together too many mechanics now"). prototypes/DESIGN.md "v5".
 ONE mechanic: three controls (tap a lane = change lane, hold = stop, swipe = turn) and a road that holds only situations. No teach cards, no questions on the road, no lane answer signs, no coin pickups.
 Wrong but safe = a ticket (siren, pulled over, a citation, a big coin count-down). Dangerous = a crash (the impact is seen; a person is never hit: a near miss stops the car short and counts as a crash),
 then a police collision report, one heart, back to the checkpoint. Every situation must be passed once (saved list); all passed = YOU WIN, Free Play is COMING SOON.
 Checkpoints (after each stage, every 8 to 10 situations): three multiple-choice questions on the core C facts (bank text verbatim, explained only on a miss), a 15 s placeholder ad, a faster stage.
 Built from: the v4a code (rh2.html helpers, audio synth, world drawing and props are kept); Temple Run / Subway Surfers (tap lane, swipe turn that returns to the straight view);
 the pseudo-3D road of Jake Gordon's "javascript-racer"; the fixed-step loop of Glenn Fiedler, "Fix Your Timestep"; Wordle-style share squares. All numbers are ours and tuned by bots (check.js), not by a person. */
/* v6a (card RH6a, Kyle played v5a on 2026-10-11): a living road. prototypes/DESIGN.md "v6". Right-turn person in view and the camera eases into the turn; tickets are coins plus a counter
 (the 3rd costs a heart); coins on the road between situations; other cars (slower, faster); the speed rises through the run; no repeat inside a stage; at the checkpoints a RAPID round (30 s, one category)
 and a STREAK round (no timer, until the first wrong answer, max 10) ALTERNATE; the win also needs every test question answered right once (Test questions n / N).
 Built from: v5a (above), the timed speed round of Quizlet Match / Kahoot blitz, the play-until-you-miss streak of quiz games, the coin lines of Subway Surfers. All numbers are ours, tuned by bots (check.js). */
const W=390,CX=195,HOR=240,Z1=40,SF=.28,PX=34,LN=3.2,DT=1/60,GAP=30,TEACH_MAX=6,TEACH_MIN=.7,PRE=1.5,FW=.4,CRAWL=2.5,VQ=15;
let H=844,GY=700,ZN=-9.5;   /* ZN: the nearest ground distance that still reaches the bottom edge of the canvas */   /* logical height: 664 to 844, set by resize() from the window shape, so a phone browser with a toolbar still draws at full width and size */
const Q=new URLSearchParams(location.search);
const DEV=Q.get('dev')==='1';
const TS=DEV?Math.max(.25,Math.min(8,+Q.get('ts')||1)):1;
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rnd=mul(DEV&&Q.get('rseed')?+Q.get('rseed'):(Date.now()%999983)+1);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return 1-(1-t)**3};
const back=t=>{t=clamp(t,0,1);return 1+2.8*(t-1)**3+1.8*(t-1)**2};
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const BC=['#2f80ed','#ff8a00','#e84393'];
const cv=document.getElementById('c'),cx=cv.getContext('2d');
/* The logical canvas is always 390 wide and 664 to 844 tall. A phone browser with a toolbar is about 390x664: the canvas then fills it at scale 1,
   instead of shrinking a fixed 390x844 picture to 79 percent (the text would be 21 percent smaller). Bottom things hang from H, so nothing is cut. */
function resize(){const vw=innerWidth,vh=innerHeight;H=clamp(Math.round(W*vh/vw),664,844);GY=H-144;ZN=Z1*(GY-HOR)/(H-HOR)-Z1;
 const s=Math.min(vw/W,vh/H),d=Math.min(devicePixelRatio||1,2.5);
 cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);cx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
 if(typeof relayout==='function')relayout()}
addEventListener('resize',resize);

/* ---------- projection and drawing helpers ---------- */

function sideQuad(xm,za,zb,h0,h1,col){const sa=sc(za),sb=sc(zb),ya=yy(za),yb=yy(zb),xa=CX+xm*PX*sa+BO(za),xb=CX+xm*PX*sb+BO(zb);
 cx.fillStyle=col;cx.beginPath();cx.moveTo(xa,ya-h0*PX*sa);cx.lineTo(xb,yb-h0*PX*sb);cx.lineTo(xb,yb-h1*PX*sb);cx.lineTo(xa,ya-h1*PX*sa);cx.fill()}
function at(x,z,fn,a,rot){if(z<ZN+.5)return;const k=PX*sc(z);cx.save();cx.translate(CX+x*k+BO(z),yy(z));cx.scale(k,k);

const at0=at;
/* meter-space shapes: origin ground centre, y up */
const rc=(x,y,w,h,c)=>{cx.fillStyle=c;cx.fillRect(x,-y-h,w,h)};
const ci=(x,y,r,c)=>{cx.fillStyle=c;cx.beginPath();cx.arc(x,-y,r,0,6.2832);cx.fill()};
const pg=(p,c)=>{cx.fillStyle=c;cx.beginPath();p.forEach((q,i)=>i?cx.lineTo(q[0],-q[1]):cx.moveTo(q[0],-q[1]));cx.closePath();cx.fill()};

function T(s,x,y,size,col,al,stroke){cx.font=`bold ${size}px ${FONT}`;cx.textAlign=al||'center';cx.textBaseline='middle';
 if(stroke){cx.lineWidth=stroke;cx.strokeStyle='rgba(0,0,0,.6)';cx.lineJoin='round';cx.strokeText(s,x,y)}cx.fillStyle=col;cx.fillText(s,x,y)}
function RR(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function wrapT(s,mw,sz){cx.font=`bold ${sz}px ${FONT}`;const L=[];let l='';
 for(const w of s.split(' ')){const n=l?l+' '+w:w;if(cx.measureText(n).width>mw&&l){L.push(l);l=w}else l=n}if(l)L.push(l);return L}
const mu=n=>1+.5*(Math.min(Math.max(n,1),7)-1);
/* ---------- audio: WebAudio synth, no files. Ported from the slice (game/src/audio/engine.ts, schedule.ts) ---------- */
const MK='greenlight.rush.muted',CK='greenlight.rush.calm';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* one note envelope: 0, ramp up, hold, ramp down; every ramp is anchored by a setValueAtTime (schedule.ts noteEnvelope) */
function noteEnv(p,t,hold,peak,att,rel){const a=Math.max(att,.008),h=Math.max(hold,a),r=Math.max(rel,.02);
 p.setValueAtTime(0,t);p.linearRampToValueAtTime(peak,t+a);p.setValueAtTime(peak,t+h);p.linearRampToValueAtTime(0,t+h+r);return t+h+r}

function impulse(len,seed,decay,damp){let a=seed>>>0;const rn=()=>{a=(a+0x6d2b79f5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};

/* the driving loop: 112 BPM, 8 bars, A minor (Am F C G Am F G Em). Stems: pad, bass, pulse always; drums from streak x2; lead from streak x3. */
const BPM=112,BEAT=60/BPM,BPB=4,LOOP_BEATS=32;
const CH=[{b:45,p:[57,60,64]},{b:41,p:[53,57,60]},{b:48,p:[55,60,64]},{b:43,p:[55,59,62]},{b:45,p:[57,60,64]},{b:41,p:[53,57,60]},{b:43,p:[55,59,62]},{b:40,p:[52,55,59]}];
const BASSP=[[0,.45,0,1],[.75,.2,0,.7],[1.5,.4,12,.8],[2,.45,0,.95],[2.75,.2,0,.7],[3.5,.4,7,.8]];  /* beat, length, semitones above the root, velocity */
const PULSEP=[[0,1,2,1,0,1,2,1],[2,1,0,1,2,1,0,2]],LEADP=[[0,1],[1.5,2],[2,1],[3,0]];
function buildScore(){const ev=[];CH.forEach((c,bar)=>{const b0=bar*BPB;
 c.p.forEach(m=>ev.push({s:'pad',b:b0,d:BPB,m,v:1}));
 BASSP.forEach(n=>ev.push({s:'bass',b:b0+n[0],d:n[1],m:c.b+n[2],v:n[3]}));
 const tn=c.p.map(m=>m+12);PULSEP[bar%2].forEach((pk,i)=>ev.push({s:'pulse',b:b0+i*.5,d:.4,m:tn[pk%3],v:i%2?.6:.85}));
 for(let k=0;k<4;k++){ev.push({s:'kick',b:b0+k,d:.2,m:0,v:1});ev.push({s:'hat',b:b0+k+.5,d:.05,m:0,v:k%2?.8:.55})}
 const ln=c.p.map(m=>m+24);LEADP.forEach(n=>ev.push({s:'lead',b:b0+n[0],d:.6,m:ln[n[1]%3],v:.9}))});
 ev.sort((a,b)=>a.b-b.b);return ev}
const VOICE={pad:{o:[['sawtooth',-7,1,1],['sawtooth',7,1,1]],pk:.05,at:.3,rl:.5,ov:.35,lp:1400},
 bass:{o:[['sine',0,1,1],['triangle',0,2,.22]],pk:.3,at:.015,rl:.12,ov:0,lp:900},
 pulse:{o:[['triangle',-4,1,1],['triangle',4,1,1]],pk:.085,at:.01,rl:.15,ov:0,lp:2600},
 lead:{o:[['square',0,1,1],['triangle',5,1,.5]],pk:.06,at:.01,rl:.2,ov:0,lp:2400}};
const STEMS=['pad','bass','pulse','drums','lead'],MUS=.7;   /* music level under the effects */
function makeEngine(ctx,live){
 const E={ctx,layer:0,low:false,on:false,t0:0,idx:0,iter:0,sc:buildScore(),timer:null,live};
 const now=ctx.currentTime;
 E.master=ctx.createGain();E.master.gain.setValueAtTime(live&&MUTED?0:.8,now);
 const comp=ctx.createDynamicsCompressor();comp.threshold.setValueAtTime(-14,now);comp.ratio.setValueAtTime(3,now);E.master.connect(comp);comp.connect(ctx.destination);
 E.sfx=ctx.createGain();E.sfx.gain.setValueAtTime(.9,now);E.sfx.connect(E.master);
 E.mgain=ctx.createGain();E.mgain.gain.setValueAtTime(0,now);E.mgain.connect(E.master);
 E.mlp=ctx.createBiquadFilter();E.mlp.type='lowpass';E.mlp.frequency.setValueAtTime(18000,now);E.mlp.Q.setValueAtTime(.7,now);E.mlp.connect(E.mgain);   /* the card low-pass */
 E.min=ctx.createGain();E.min.connect(E.mlp);
 const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.setValueAtTime(220,now);const cv2=ctx.createConvolver(),len=Math.max(1,Math.round(1.2*ctx.sampleRate)),ir=ctx.createBuffer(2,len,ctx.sampleRate);
 ir.getChannelData(0).set(impulse(len,7,3,.3));ir.getChannelData(1).set(impulse(len,11,3,.3));cv2.buffer=ir;
 const snd=ctx.createGain();snd.gain.setValueAtTime(.2,now);const wet=ctx.createGain();wet.gain.setValueAtTime(.3,now);E.min.connect(snd);snd.connect(hp);hp.connect(cv2);cv2.connect(wet);wet.connect(E.mlp);
 E.st={};for(const id of STEMS){const g=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime((VOICE[id]||{lp:16000}).lp,now);lp.connect(g);g.connect(E.min);
  g.gain.setValueAtTime(id==='drums'||id==='lead'?0:1,now);E.st[id]={g,lp}}
 const nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),nd=nb.getChannelData(0);let sd=12345;for(let i=0;i<nd.length;i++){sd=(Math.imul(sd,1664525)+1013904223)>>>0;nd[i]=sd/2147483648-1}E.nb=nb;
 E.voice=(ev,time)=>{const t=Math.max(time,ctx.currentTime),st=E.st[ev.s]&&E.st[ev.s].lp;
  if(ev.s==='kick'){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);const e=noteEnv(g.gain,t,.02,.55*ev.v,.004,.16);o.connect(g);g.connect(E.st.drums.g);o.start(t);o.stop(e+.03);return}
  if(ev.s==='hat'){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nb;f.type='highpass';f.frequency.setValueAtTime(7000,t);const e=noteEnv(g.gain,t,.01,.16*ev.v,.002,.05);s.connect(f);f.connect(g);g.connect(E.st.drums.g);s.start(t);s.stop(e+.03);return}
  const vo=VOICE[ev.s],env=ctx.createGain(),end=noteEnv(env.gain,t,ev.d*BEAT+vo.ov,vo.pk*ev.v,vo.at,vo.rl);env.connect(st);
  for(const o of vo.o){const os=ctx.createOscillator();os.type=o[0];os.frequency.setValueAtTime(m2hz(ev.m)*o[2],t);os.detune.setValueAtTime(o[1],t);
   if(o[3]===1)os.connect(env);else{const og=ctx.createGain();og.gain.setValueAtTime(o[3],t);os.connect(og);og.connect(env)}os.start(t);os.stop(end+.05)}};
 /* look-ahead scheduler: a timer wakes up often, every note is placed on the AUDIO clock ahead of time (Chris Wilson, "A Tale of Two Clocks") */
 E.pump=(horizon)=>{const sc=E.sc;for(let n=0;n<4000;n++){const ev=sc[E.idx],time=E.t0+(E.iter*LOOP_BEATS+ev.b)*BEAT;if(time>=horizon)break;
  if(time+ev.d*BEAT+2>=ctx.currentTime)E.voice(ev,time);E.idx++;if(E.idx===sc.length){E.idx=0;E.iter++}}};
 E.layerGain=()=>({drums:E.layer>=1?1:0,lead:E.layer>=2?1:0});
 E.start=(offT)=>{if(E.on)return;E.on=true;E.idx=0;E.iter=0;const t=ctx.currentTime;E.t0=(offT!==undefined?offT:t+.12);
  const lg=E.layerGain();for(const id of['drums','lead']){E.st[id].g.gain.cancelScheduledValues(t);E.st[id].g.gain.setValueAtTime(lg[id],t)}
  E.mgain.gain.cancelScheduledValues(t);E.mgain.gain.setValueAtTime(0,t);E.mgain.gain.linearRampToValueAtTime(MUS*(E.low?.55:1),t+(live?.6:.05));
  if(E.low)E.mlp.frequency.setValueAtTime(650,t);
  if(live){E.pump(t+.4);E.timer=setInterval(()=>E.pump(ctx.currentTime+.4),80)}};
 E.stop=(fade)=>{if(!E.on)return;E.on=false;const t=ctx.currentTime;E.mgain.gain.cancelScheduledValues(t);E.mgain.gain.setTargetAtTime(0,t,fade/3);if(E.timer){clearInterval(E.timer);E.timer=null}};

/* sound effects: short synth cues on their own bus (not muffled). tone() is the slice's cue voice. */
function tone(E,t,midi,hold,peak,type,lp,att,rel,part){const c=E.ctx,env=c.createGain(),f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(lp,t);

  if(w===1)o.connect(env);else{const og=c.createGain();og.gain.setValueAtTime(w,t);o.connect(og);og.connect(env)}o.start(t);o.stop(end+.05)}}

 f.type='lowpass';f.frequency.setValueAtTime(lp,t);const end=noteEnv(g.gain,t,dur*.3,peak,.01,dur*.7);o.connect(f);f.connect(g);g.connect(E.sfx);o.start(t);o.stop(end+.05)}

const SFX={
 swipe(E,t){noise(E,t,.14,.2,'bandpass',500,1800,2)},
 right(E,t,fast){tone(E,t,74,.14,.5,'sine',3500,.015,.25,.15);tone(E,t+.11,81,.3,.55,'sine',3500,.015,.45,.15);
  if(fast){noise(E,t+.05,.5,.12,'highpass',800,6000,.7);sweep(E,t+.05,300,1100,.35,'sine',.1,4000)}},
 hit(E,t,crash){sweep(E,t,130,38,.4,'sine',crash?.7:.45,300);noise(E,t,crash?.4:.18,crash?.4:.2,'lowpass',1200,200,.7);
  tone(E,t+.12,81,.1,.1,'square',3000,.01,.04);tone(E,t+.26,76,.1,.1,'square',3000,.01,.06)},   /* siren blip: 880 Hz then 660 Hz */
 coin(E,t,i){const k=Math.min(i||0,8);tone(E,t,83+k,.05,.12,'square',3600,.004,.06);tone(E,t+.05,88+k,.09,.12,'square',3600,.004,.1)},
 card(E,t){tone(E,t,79,.08,.3,'triangle',3000,.01,.2,.2);tone(E,t+.07,84,.14,.3,'triangle',3000,.01,.3,.2)},
 strike(E,t){tone(E,t,67,.16,.5,'triangle',700,.03,.25);tone(E,t+.14,63,.3,.5,'triangle',700,.03,.45)},
 heal(E,t){[72,76,79].forEach((m,i)=>tone(E,t+i*.08,m,.1,.35,'sine',3500,.01,.3,.2))},
 pass(E,t){[72,76,79,84].forEach((m,i)=>tone(E,t+i*.11,m,.14,.4,'triangle',3500,.01,.3,.2));[72,76,79,84].forEach(m=>tone(E,t+.5,m,1.1,.18,'triangle',3000,.02,.9,.2))},
 fail(E,t){[67,63,60,55].forEach((m,i)=>tone(E,t+i*.22,m,.2,.4,'sawtooth',800,.02,.3));sweep(E,t+.88,110,40,.6,'sine',.5,300)},
 copy(E,t){tone(E,t,88,.04,.3,'sine',4000,.005,.08);tone(E,t+.07,95,.08,.3,'sine',4000,.005,.14)},
 tick(E,t){tone(E,t,84,.03,.2,'sine',3000,.005,.06)},
 riser(E,t){const c=E.ctx,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(1500,t+1);
  f.type='lowpass';f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(7000,t+1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.9);g.gain.linearRampToValueAtTime(0,t+1.05);
  o.connect(f);f.connect(g);g.connect(E.sfx);o.start(t);o.stop(t+1.1);noise(E,t,1,.1,'highpass',500,5000,.7)}};
function snd(name,a,b,dl){if(MUTED||!AE||AC.state!=='running')return;try{SFX[name](AE,AC.currentTime+.01+(dl||0),a,b)}catch(e){}}
function musicOn(){if(AE&&!MUTED)AE.start()}
const NOAUDIO=DEV&&Q.get('noaudio')==='1';   /* test only: the 60 bot pages of check.js skip audio so the test machine is not starved */

/* Green Light Rapid Round (card RH5r). One module, one global: window.RapidRound.
   Pattern: the speed-drill "match" round (Kahoot blitz, Brainscape rapid cards, Duolingo match): one picture
   or word, 2-4 big tiles, a short timer that shrinks with a streak. Data: seg5_rapid_data.js (generated from
   the bank by tools/build_rapid_items.py). Load the data file first.
   v7 (card RH7a): sign pictures are the public-domain MUTCD files of window.SIGN_ASSETS (data_signs.js, load it first; tools/build_signs_v7.py
   writes both data files) and no item shows a sign face that prints its answer (topic signact: "What does this sign tell you to do?"; test v7rapid).

   API
     RapidRound.topics()  -> [{id, name, blurb, facts, units:[unit ids]}]
     RapidRound.start({ctx, canvas, topic, n:10, timerStart:2, timerMin:1, onDone(result),
                       audio(name), seed, external, pass, skipIntro, coinsPerRight})
        -> controller {tap(x,y), update(ms), draw(), stop(), status(), items, rects()}
        The module draws on the canvas in a 390-wide logical space (height = canvas.height / (canvas.width/390)).
        It listens to pointerdown on the canvas itself. With external:true the host calls update(ms) and draw()
        each frame; otherwise the module runs its own requestAnimationFrame loop.
        audio(name): name is start | right | wrong | pass | fail. The module makes no sound without the hook.
     onDone({topic, right, wrong, passed, unitIds, rightUnitIds, missed:[{unit, units, rule, why}], seconds, coins})

izens","She can apply, but only with a citizen vouching for her","She can apply, as any California resident can","She can apply once she has a work visa"],"ci":2,"r":"Immigration status does not stop a resident from getting a license.","x":1},{"id":"q-1a-029","f":"s1-06","topic":"License classes, ID cards and applicant rules","stem":"Marco says noncitizens skip the driving test because the DMV does not ask about status. What is true?","o":["Noncitizens are exempt from the tests the others take","Noncitizens skip the road test but take the written one","Noncitizens take the same tests as other new applicants","Noncitizens cannot hold a California license of any kind"],"ci":2,"r":"Status does not block an application, but every applicant must still meet the other requirements.","x":1},{"id":"q-1a-030","f":"s1-07","topic":"License classes, ID cards and applicant rules","stem":"How can you get organ and tissue donor status added to your license?","o":["Through the American Red Cross website at redcross.org","Through donateLIFEcalifornia.org","Through UNOS, the national transplant network, at unos.org","Through the donor registry run by your health insurer"],"ci":1,"r":"Donor status can be added to a license through donateLIFEcalifornia.org.","x":1},{"id":"q-1a-031","f":"s1-07","topic":"License classes, ID cards and applicant rules","stem":"Kim is renewing her license and wants her donor wish shown on the new card. What should she do?","o":["Sign up through donateLIFEcalifornia.org","Ask her doctor to send the DMV a donor letter","Request a donor license class at the counter","Sign up through the American Red Cross website at redcross.org"],"ci":0,"r":"A donor mark is requested through donateLIFEcalifornia.org.","x":1},{"id":"q-1a-032","f":"s1-07","topic":"License classes, ID cards and applicant rules","stem":"Which statement about the donor mark and the veteran mark is right?","o":["Donors register at the DMV counter; veterans use donateLIFEcalifornia.org","Both marks are added through donateLIFEcalifornia.org","Both marks are added automatically at renewal","Donors use donateLIFEcalifornia.org; veterans meet DMV requirements"],"ci":3,"r":"The donor mark is requested through donateLIFEcalifornia.org. The veteran mark follows its own DMV requirements.","x":1},{"id":"q-1a-033","f":"s1-08","topic":"License classes, ID cards and applicant rules","stem":"How does a former service member get a veteran designation on a California license?","o":["It can be added once the driver meets the DMV's requirements","It is added once the VA approves the driver's benefits","It is added automatically at the driver's next renewal","It can be added once the driver shows a military ID, with no other requirement"],"ci":0,"r":"A veteran designation can be added to a license when its specific requirements are met.","x":1},{"id":"q-1a-034","f":"s1-08","topic":"License classes, ID cards and applicant rules","stem":"Dana served in the military and wants it noted on her license. What is true?","o":["It is added at her next renewal without any request","It can be added once she meets the DMV's requirements","It can be added once she meets the VA's requirements for benefits","It can be added once her local VA office mails the DMV a letter"],"ci":1,"r":"A veteran designation can be added if the driver meets the requirements.","x":1},{"id":"q-1a-035","f":"s1-08","topic":"License classes, ID cards and applicant rules","stem":"A friend finishes military service and asks how a veteran mark gets onto his driver's license. What is true?","o":["It is added automatically when his service ends","It is added to any license on request, with no proof","It can be added once he meets the specific requirements","It can be added once he has registered with a veterans organization"],"ci":2,"r":"A veteran designation can be added to a driver's license, but only when specific requirements are met.","x":1},{"id":"q-1a-036","f":"s13-003","topic":"Senior renewal and ID cards","stem":"About how long before your license expires does the DMV send a renewal notice?","o":["About 10 days","About 6 months","About 90 days","About 12 months"],"ci":2,"r":"The DMV sends the renewal notice about 90 days before the license expires.","x":1},{"id":"q-1a-037","f":"s13-003","topic":"Senior renewal and ID cards","stem":"Lena moved last month and has not changed her address with the DMV. Where will her renewal notice go?","o":["To the address of record still on file","To the address on her car insurance policy","To her new address, which the DMV finds through the post office","To her email, since paper notices are no longer mailed"],"ci":0,"r":"The DMV mails the notice to the address of record, so an old address means a missed notice.","x":1},{"id":"q-1a-038","f":"s13-003","topic":"Senior renewal and ID cards","stem":"Lena's license expires on 1 December. About when should her renewal notice reach her address of record?","o":["Around early September, about 90 days before","Around early November, about 30 days before","Around late November, about 10 days before","Around early June, about 6 months before"],"ci":0,"r":"The DMV sends the renewal notice to the address of record about 90 days before expiry.","x":1},{"id":"q-1a-039","f":"s2-01","topic":"Knowledge and road test procedure","stem":"To earn a first driver's license, what must a new applicant pass?","o":["Both the knowledge test and the road test","The knowledge test only","The road test only","The knowledge test and a practice log"],"ci":0,"r":"A new driver must pass both the knowledge test and the behind-the-wheel test.","x":1},{"id":"q-1a-040","f":"s2-01","topic":"Knowledge and road test procedure","stem":"Noor, 25, a first-time applicant, scored perfectly on the knowledge test and asks for her license today. What is still missing?","o":["A second knowledge test on road signs","A signed statement from a driving instructor","Passing the road test","Nothing; a perfect score earns the license"],"ci":2,"r":"The knowledge test is only half of it. The behind-the-wheel test must also be passed.","x":1},{"id":"q-1a-041","f":"s2-01","topic":"Knowledge and road test procedure","stem":"After a perfect written score, a friend asks whether he still has to take the road test. What is the best reply?","o":["He can skip it, since a perfect score proves he knows the rules","He can skip it, but only if he passed on the first try","He must take it, but only because he is under 18","He must take it, because it checks different skills"],"ci":3,"r":"Each test checks something different, so a first license needs both.","x":1},{"id":"q-1a-042","f":"s2-02","topic":"License classes, ID cards and applicant rules","stem":"Which set of items is needed to apply for a license?","o":["Proof of identity, two proofs of residency, and a Social Security number","Proof of identity, one proof of residency, and a Social Security number","A birth certificate and a Social Security card, with no residency papers","Two proofs of identity, one proof of residency, and a Social Security number"],"ci":0,"r":"An applicant shows proof of identity, two proofs of residency, and a Social Security number.","x":1},{"id":"q-1a-043","f":"s2-02","topic":"License classes, ID cards and applicant rules","stem":"Marcus brings his birth certificate, his Social Security card and one utility bill to apply for a license and is turned away. What is missing?","o":["A second proof of residency","A second proof of identity","A passport, since a birth certificate is not accepted","Proof of insurance for his car"],"ci":0,"r":"He has identity proof, a Social Security number and one residency proof. Two residency proofs are required.","x":1},{"id":"q-1a-044","f":"s2-02","topic":"License classes, ID cards and applicant rules","stem":"Aisha shows a passport as proof of identity. What else must she bring to apply?","o":["Nothing; a passport covers residency too","Two proofs of residency and her Social Security number","One proof of residency and no other item","Two proofs of residency, but no Social Security number"],"ci":1,"r":"The passport covers identity. Two residency proofs and a Social Security number are still needed.","x":1},{"id":"q-1a-045","f":"s2-03","topic":"License classes, ID cards and applicant rules","stem":"Maya pays the application fee, then decides not to apply after all and asks for her money back. What can she expect?","o":["A refund, since she has not taken a test","No refund, but she can move the fee to a relative's application","No refund; the fee does not come back","A refund minus a small processing fee"],"ci":2,"r":"The application fee for a permit or license is non-refundable.","x":1},{"id":"q-1a-046","f":"s2-03","topic":"License classes, ID cards and applicant rules","stem":"Pedro fails the knowledge test on his first try and is upset about the fee he paid. What is true of that fee?","o":["It is refunded in full because he failed","It is refunded only if he passes on a later try","It is not refunded unless he fails twice","It is not refunded, pass or fail"],"ci":3,"r":"The fee is not refunded, whether the applicant passes, fails or stops.","x":1},{"id":"q-1a-047","f":"s2-03","topic":"License classes, ID cards and applicant rules","stem":"Lina pays the application fee, then her family moves away before she tests. Her aunt says the DMV will refund it. What is true?","o":["The fee comes back if she asks within a year","The fee stays paid even if she never tests","The fee comes back, since the move was not her choice","The fee comes back only if she returns the receipt in person"],"ci":1,"r":"The application fee is not refundable, even if the applicant never takes the test.","x":1},{"id":"q-1a-048","f":"s2-04","topic":"License classes, ID cards and applicant rules","stem":"Which step is part of applying for an instruction permit?","o":["A road test with an examiner","A hearing test at the counter","A vision test at the counter","A medical exam signed by a doctor"],"ci":2,"r":"A vision test is required to get an instruction permit.","x":1},{"id":"q-1a-049","f":"s2-04","topic":"License classes, ID cards and applicant rules","stem":"Teo is applying for his instruction permit. Besides his papers, what will the clerk check at the counter?","o":["His eyesight, with a vision test","His reading level, with a short reading test","His hearing and reflexes","His driving ability, with a short drive around the lot"],"ci":0,"r":"A vision test is a normal part of applying for an instruction permit.","x":1},{"id":"q-1a-050","f":"s2-04","topic":"License classes, ID cards and applicant rules","stem":"Four teens guess when the vision test is given. Who is right?","o":["Ari: \"You take it when you pick up the license\"","Bea: \"You take it after the six months on the permit\"","Cal: \"You take it when you apply for the permit\"","Dee: \"You take it only if you wear glasses\""],"ci":2,"r":"The vision test is part of getting the permit, at the start. The road test comes after the permit period.","x":1},{"id":"q-1a-051","f":"s2-05","topic":"License classes, ID cards and applicant rules","stem":"What is the minimum age to apply for a California instruction permit?","o":["15 years old","15 years and 6 months","16 years old","14 years and 6 months"],"ci":1,"r":"An applicant must be at least 15 years and 6 months old.","x":1},{"id":"q-1a-052","f":"s2-05","topic":"License classes, ID cards and applicant rules","stem":"Leo turns 15 years and 3 months old next week and wants to apply for his permit. How soon can he apply?","o":["Now, since he is already past his 15th birthday","In about three months, at 15 years 6 months","Once a parent signs the form at the counter","At 16, on his next birthday"],"ci":1,"r":"The permit age is 15 years and 6 months. Leo is about three months short.","x":1},{"id":"q-1a-053","f":"s2-05","topic":"License classes, ID cards and applicant rules","stem":"Which of these is the minimum age to apply for an instruction permit?","o":["15 years, 0 months","16 years, 0 months","15 years, 6 months","16 years, 6 months"],"ci":2,"r":"The minimum age to apply is 15 years and 6 months. The other numbers belong to other rules.","x":1},{"id":"q-1a-054","f":"s2-06","topic":"Teen driver rules (education, permits, passengers)","stem":"Before a 16-year-old can get a permit, what must be completed?","o":["A driver education course","A road test","A 50-hour practice log","A defensive-driving course for ticket dismissal"],"ci":0,"r":"Applicants under 18 must complete driver education before a permit.","x":1},{"id":"q-1a-055","f":"s2-06","topic":"Teen driver rules (education, permits, passengers)","stem":"Hana is 16 and arrives with her mother to apply for a permit, but has never done driver education. What happens?","o":["She gets the permit and does driver ed during the 6-month wait","She must wait until she is 17, then she can apply","She must complete driver education first","Her mother can sign instead of driver ed"],"ci":2,"r":"Applicants under 18 must finish driver education before they can get the permit.","x":1},{"id":"q-1a-056","f":"s2-06","topic":"Teen driver rules (education, permits, passengers)","stem":"Hana, 16, and Marcus, 19, both apply for a first permit. Neither has done driver education. Who can get a permit?","o":["Both can get one now","Hana only","Marcus only","Neither can"],"ci":2,"r":"Driver education is required for applicants under 18, before the permit.","x":1},{"id":"q-1a-057","f":"s2-07","topic":"Teen driver rules (education, permits, passengers)","stem":"Who must sign a minor's application and accept financial responsibility?","o":["The teen's driving instructor","The licensed adult who rides along in practice","The teen's insurance agent","The teen's parent or guardian"],"ci":3,"r":"A parent or guardian signs the application and accepts financial responsibility for a driver under 18.","x":1},{"id":"q-1a-058","f":"s2-07","topic":"Teen driver rules (education, permits, passengers)","stem":"Dev, 17, goes to apply with his friend's mom because his parents are at work. She offers to sign. What does the DMV require?","o":["She may sign, since she is over 25 and licensed","Only a parent or guardian can sign for him","She may sign if his parents send a note","He must wait until he is 18 and then apply alone"],"ci":1,"r":"Only a parent or guardian can sign and accept responsibility for a minor.","x":1},{"id":"q-1a-059","f":"s2-07","topic":"Teen driver rules (education, permits, passengers)","stem":"What does a parent's signature on a teen's application mean?","o":["They promise to ride along on every practice drive","They accept financial responsibility for the teen's driving","They certify the teen has finished driver education","They only confirm the teen's identity and age"],"ci":1,"r":"The signature approves the application and accepts financial responsibility for the minor.","x":1},{"id":"q-1a-063","f":"s2-09","topic":"License classes, ID cards and applicant rules","stem":"How long must a teen hold an instruction permit before taking the behind-the-wheel test?","o":["At least 90 days","At least 14 days","At least 6 months","At least 12 months"],"ci":2,"r":"A permit must be held at least 6 months before the road test.","x":1},{"id":"q-1a-064","f":"s2-09","topic":"License classes, ID cards and applicant rules","stem":"Ravi, 16, got his permit in March and finished his 50 practice hours by May. He tries to book the road test in June. What happens?","o":["He can book it, because the 50 hours are done","He can book it once his instructor signs off on the hours","He must wait two more weeks, then he can book it","He must wait until the permit is 6 months old"],"ci":3,"r":"The 6-month permit period runs on its own. Early practice hours do not shorten it.","x":1},{"id":"q-1a-065","f":"s2-09","topic":"License classes, ID cards and applicant rules","stem":"Which statement about the permit period before a teen's road test is correct?","o":["It is 3 months once the 50 practice hours are done","It is 6 months, whether or not the 50 hours are finished","It is 12 months, the same as the new-driver curfew period","It is 6 months, but a driver-education certificate cuts it to 3"],"ci":1,"r":"A teen must hold the permit at least 6 months before the road test. The practice hours are a separate rule.","x":1},{"id":"q-1a-066","f":"s2-10","topic":"Teen driver rules (education, permits, passengers)","stem":"How many hours of supervised practice must a minor complete, and how many must be at night?","o":["40 hours, 10 at night","50 hours, 15 at night","60 hours, 10 at night","50 hours, 10 at night"],"ci":3,"r":"A minor must log at least 50 hours of supervised driving, including 10 hours at night."},{"id":"q-1a-067","f":"s2-10","topic":"Teen driver rules (education, permits, passengers)","stem":"Ines, 16, holds a permit and has logged 55 hours with her mother, all on afternoon drives. What does she still need before her road test?","o":["Ten of her hours must be at night","Nothing, since 55 is more than 50","Twenty-five hours with a driving instructor","Ten hours with a different supervising adult"],"ci":0,"r":"The 50 hours must include at least 10 at night. Daytime hours alone fall short."},{"id":"q-1a-068","f":"s2-10","topic":"Teen driver rules (education, permits, passengers)","stem":"Which statement about the 50 hours is right?","o":["The 10 night hours are added on top of the 50","The 10 night hours count within the 50","At least 25 of the 50 hours must be at night","Only hours with a driving instructor count"],"ci":1,"r":"The 50 total hours include the 10 night hours."},{"id":"q-1a-069","f":"s2-11","topic":"Teen night-driving limit","stem":"In the first 12 months after getting a license, when may a driver under 18 not drive alone?","o":["From 9 at night until 5 in the morning","From midnight until 6 in the morning","From 11 at night until 5 in the morning","From sunset until sunrise"],"ci":2,"r":"New drivers under 18 may not drive between 11 p.m. and 5 a.m. during the first 12 months, unless an exception applies."},{"id":"q-1a-070","f":"s2-11","topic":"Teen night-driving limit","stem":"Zoe, 17, got her license four months ago. At 11:30 p.m. she wants to drive alone for a snack. No exception applies. Which rule governs her?","o":["A curfew applies only on school nights","The curfew ends after six months of licensing","The first-year curfew rules out the drive","A curfew applies, but it starts at midnight"],"ci":2,"r":"She is inside her first 12 months and under 18, so the 11 p.m. to 5 a.m. limit applies."},{"id":"q-1a-072","f":"s2-12","topic":"Teen driver rules (education, permits, passengers)","stem":"A new driver under 18 may carry passengers younger than what age only with a qualified adult aboard?","o":["18","16","20","21"],"ci":2,"r":"A driver under 18 may not carry passengers under 20 unless a qualified adult aged 25 or older is supervising."},{"id":"q-1a-074","f":"s2-12","topic":"Teen driver rules (education, permits, passengers)","stem":"A 17-year-old in her first year drives with no qualified adult aboard and no exception. Which rider would break the passenger limit?","o":["A 20-year-old friend","A 19-year-old cousin","A 22-year-old neighbor","A 21-year-old coworker"],"ci":1,"r":"The limit covers passengers under 20. A rider aged 19 is covered. Riders aged 20 or older are not."},{"id":"q-1a-075","f":"s3-01","topic":"Knowledge and road test procedure","stem":"How do you answer the questions on the knowledge test?","o":["By matching each sign to its meaning","By choosing the best of several answers","By filling in a blank on the screen","By answering only true or false"],"ci":1,"r":"The knowledge test asks multiple-choice questions.","x":1},{"id":"q-1a-076","f":"s3-01","topic":"Knowledge and road test procedure","stem":"Alex sits at the testing screen. The first question shows four possible answers. What does Alex do?","o":["Picks the one answer that fits best","Marks every answer that could be right","Picks the first answer that could be right","Picks the answer most drivers would choose"],"ci":0,"r":"Each question gives answer options and the applicant chooses one.","x":1},{"id":"q-1a-077","f":"s3-01","topic":"Knowledge and road test procedure","stem":"Maria prepares for the knowledge test by memorizing full written answers to likely questions. What is wrong with her plan?","o":["Memorizing is pointless, since the test lets you use the handbook","The test is multiple choice, so she must pick, not write","The test is spoken, so she should practice answering aloud","The test is true or false, so she should practice quick yes or no"],"ci":1,"r":"The knowledge test uses multiple-choice questions, so the skill is choosing the best answer, not writing one out.","x":1},{"id":"q-1a-078","f":"s3-02","topic":"Knowledge and road test procedure","stem":"How many tries do you get at the knowledge test before you must reapply?","o":["One","Two","Three","Four"],"ci":2,"r":"An applicant has three attempts to pass the knowledge test before reapplying.","x":1},{"id":"q-1a-079","f":"s3-02","topic":"Knowledge and road test procedure","stem":"Hector failed the knowledge test twice and sits for a third try. If he fails again, what comes next?","o":["He has used all three attempts and must reapply","He waits 7 days and gets a fourth try","He is barred from ever taking the test again","He gets three more attempts straight away"],"ci":0,"r":"After the third failed attempt the applicant must reapply.","x":1},{"id":"q-1a-080","f":"s3-02","topic":"Knowledge and road test procedure","stem":"The number three shows up in the testing rules. What does it limit?","o":["The number of days a teen waits after any failed test","The number of months a teen must hold the permit first","The number of tries a teen gets at the knowledge test","The number of night hours a teen must log"],"ci":2,"r":"Three is the number of knowledge-test attempts before the applicant must reapply.","x":1},{"id":"q-1a-081","f":"s3-03","topic":"Knowledge and road test procedure","stem":"A 16-year-old fails the knowledge test. How long must she wait before trying again?","o":["No wait; she can retake it the same day","Seven days","Fourteen days"],"ci":1,"r":"A minor must wait seven days between failed knowledge-test attempts.","x":1},{"id":"q-1a-082","f":"s3-03","topic":"Knowledge and road test procedure","stem":"Kai, 17, fails the knowledge test on a Monday morning and returns Tuesday hoping to retake it. What happens?","o":["He is tested at once because the fee is paid","He must wait seven days between attempts","He must repeat driver education first","He must wait fourteen days"],"ci":1,"r":"A minor waits seven days between failed knowledge-test attempts.","x":1},{"id":"q-1a-083","f":"s3-03","topic":"Knowledge and road test procedure","stem":"A 17-year-old fails the knowledge test. A friend says the waiting period applies only to the road test. What is right?","o":["The knowledge test has a seven-day wait for minors","The knowledge test has a fourteen-day wait for minors","The knowledge test has no wait; only the road test does"],"ci":0,"r":"The knowledge-test wait for minors is seven days. Fourteen days belongs to the road test.","x":1},{"id":"q-1a-084","f":"s3-04","topic":"Knowledge and road test procedure","stem":"Which statement about handbooks and cell phones during the knowledge test is right?","o":["Handbooks and cell phones are both barred","Handbooks are allowed, but cell phones are barred","Cell phones are allowed, but handbooks are barred","Both are barred, except that a phone may be used to check the time"],"ci":0,"r":"Testing aids such as the handbook and cell phones are not permitted during the knowledge test.","x":1},{"id":"q-1a-085","f":"s3-04","topic":"Knowledge and road test procedure","stem":"During her knowledge test, Jada's phone buzzes on the desk and she glances at it. Which statement is correct?","o":["A phone is banned only when it rings out loud","A phone is allowed when it is left face-down","A phone is allowed because only the handbook is banned","A phone is banned because it is a testing aid"],"ci":3,"r":"Testing aids, including cell phones and the handbook, are not permitted during knowledge tests.","x":1},{"id":"q-1a-086","f":"s3-04","topic":"Knowledge and road test procedure","stem":"A friend says the knowledge test is open-book, so you may check the handbook mid-test. What is the correct reply?","o":["It is open-book for the sign questions only","It is closed-book, but you may keep a phone for the clock","It is open-book if you tell the examiner first","It is closed-book; handbooks and phones are barred"],"ci":3,"r":"The knowledge test is closed-book. Handbooks and cell phones are not permitted.","x":1},{"id":"q-1a-087","f":"s3-05","topic":"Renewal, address and name changes","stem":"What is eLearning?","o":["A self-paced course with quizzes, offered at renewal","A shorter version of the knowledge test for renewal","A study booklet mailed with the renewal notice","A monthly class held at a DMV office"],"ci":0,"r":"eLearning is a self-paced course with module quizzes, offered as an alternative at renewal.","x":1},{"id":"q-1a-088","f":"s3-05","topic":"Renewal, address and name changes","stem":"Gil must take a test to renew his license. Which of these does the DMV offer him as an alternative?","o":["Watch a short video at the counter instead","Attend a classroom course at a driving school","Mail in a paper worksheet completed at home","Take the eLearning course at his own pace"],"ci":3,"r":"eLearning is an alternative for renewal: a self-paced course with quizzes.","x":1},{"id":"q-1a-089","f":"s3-05","topic":"Renewal, address and name changes","stem":"Which description of eLearning is right?","o":["A self-paced course with quizzes, offered at renewal","A required class before any first permit","A short quiz given at the counter on renewal day","A live online class at fixed times, offered at renewal"],"ci":0,"r":"eLearning is optional, self-paced and offered during renewal.","x":1},{"id":"q-1a-090","f":"s3-06","topic":"Knowledge and road test procedure","stem":"What must you hold to take the behind-the-wheel test?","o":["A valid instruction permit or driver's license","A non-driver ID card with your photo on it","A receipt showing you paid the application fee","A letter from a state-approved driving school"],"ci":0,"r":"An instruction permit or a valid driver's license is required for the road test.","x":1},{"id":"q-1a-091","f":"s3-06","topic":"Knowledge and road test procedure","stem":"Tessa arrives for the road test with her fee receipt and a non-driver ID, but no permit. What happens?","o":["She tests anyway, since the fee is already paid","She is turned away until she has a permit or license","She is turned away unless her parent signs a form on site","She tests if a driving instructor rides along"],"ci":1,"r":"Without a permit or valid license, the applicant cannot take the road test.","x":1},{"id":"q-1a-092","f":"s3-06","topic":"Knowledge and road test procedure","stem":"A first-time applicant holds no license. Which document lets the applicant drive the car during the behind-the-wheel test?","o":["A valid instruction permit","A slip showing a passed knowledge test","A non-driver ID with a REAL ID star","A signed log of practice hours"],"ci":0,"r":"The applicant must hold a permit or valid license to take the road test.","x":1},{"id":"q-1a-093","f":"s3-07","topic":"Teen driver rules (education, permits, passengers)","stem":"What is the minimum age of a licensed supervising driver for a permit holder who is a minor?","o":["18","21","25","16"],"ci":2,"r":"A licensed supervising driver must be 18 or older, and 25 or older for a minor."},{"id":"q-1a-094","f":"s3-07","topic":"Teen driver rules (education, permits, passengers)","stem":"Rosa, 22, holds an instruction permit. Her friend, 19, with a valid California license, offers to ride along while she practices. Is that allowed?","o":["No, a supervising driver must always be 25 or older","Yes, 18 or older is enough for an adult permit holder","No, the supervising driver must be at least 21 years old","Yes, but only if he has held his license for a year"],"ci":1,"r":"For an adult permit holder the licensed supervising driver must be 18 or older."},{"id":"q-1a-095","f":"s3-07","topic":"Teen driver rules (education, permits, passengers)","stem":"Jin (16) and Rosa (22) both hold permits. Each practices with a licensed 21-year-old. What is true?","o":["Both supervisors qualify","Neither supervisor qualifies","Jin's supervisor qualifies; Rosa's does not","Rosa's supervisor qualifies; Jin's does not"],"ci":3,"r":"A supervisor for a minor must be 25 or older. For an adult permit holder, 18 or older is enough."},{"id":"q-1a-096","f":"s3-14","topic":"Knowledge and road test procedure","stem":"A 17-year-old fails the road test. How long must the applicant wait before retaking it?","o":["Seven days","The next day","Fourteen days"],"ci":2,"r":"A minor must wait 14 days before retaking a failed road test.","x":1},{"id":"q-1a-097","f":"s3-14","topic":"Knowledge and road test procedure","stem":"Mina, 16, fails her road test on a Tuesday after hitting a cone while parallel parking. She wants to rebook for Friday. What rule applies?","o":["Any business day after the failure","Sooner, with a note from her instructor","After seven days","After 14 days"],"ci":3,"r":"A minor who fails the road test must wait 14 days to retake it.","x":1},{"id":"q-1a-098","f":"s3-14","topic":"Knowledge and road test procedure","stem":"On the same Monday, Pia, 16, fails her knowledge test and Quinn, 16, fails his road test. Who can come back first?","o":["Pia, after 7 days; Quinn must wait 14","Quinn, after 7 days; Pia must wait 14","Both, after 7 days","Both, after 14 days"],"ci":0,"r":"A minor waits 7 days for the knowledge test and 14 days for the road test.","x":1},{"id":"q-1a-099","f":"s4-01","topic":"Renewal, address and name changes","stem":"A driver's license expired last week and has not been renewed. What is the legal position on driving?","o":["Driving is allowed on short local trips only","Driving is allowed if the renewal notice is in the car","Driving is illegal until the license is renewed","Driving is illegal only after a 30-day grace period"],"ci":2,"r":"Operating a vehicle with an expired license is illegal.","x":1},{"id":"q-1a-100","f":"s4-01","topic":"Renewal, address and name changes","stem":"Dan sees on his card that his license expired two days ago. His job is ten miles away. What is true?","o":["He may not drive there until he renews","He may drive there on surface streets only","He may not drive there until he renews and waits 30 days","He may drive there, since it is a trip for work"],"ci":0,"r":"An expired license is not valid, so driving on it is illegal.","x":1},{"id":"q-1a-101","f":"s4-01","topic":"Renewal, address and name changes","stem":"Which of these drivers is breaking the law?","o":["One whose license expires tomorrow","One who renewed online yesterday and is waiting for the new card","One driving on a valid replacement while the lost original is missing","One whose license expired yesterday"],"ci":3,"r":"Only the driver whose license has expired is operating illegally.","x":1},{"id":"q-1a-102","f":"s4-02","topic":"Renewal, address and name changes","stem":"Where on dmv.ca.gov can an eligible person renew a driver license online?","o":["The vehicle registration renewal page","The driver license services page","The REAL ID information page","The driver record request page"],"ci":1,"r":"Online license renewal is offered through the DMV's driver license services at dmv.ca.gov/dlservices.","x":1},{"id":"q-1a-103","f":"s4-02","topic":"Renewal, address and name changes","stem":"Mia's license expires next month, and she wants to renew online. Where should she go?","o":["The DMV website, dmv.ca.gov/dlservices","A private site such as dmv.org that charges a fee","The California Highway Patrol site, chp.ca.gov","Her county clerk's website"],"ci":0,"r":"Eligible drivers can renew online through the DMV website at dmv.ca.gov/dlservices.","x":1},{"id":"q-1a-104","f":"s4-02","topic":"Renewal, address and name changes","stem":"A friend says online renewal exists only for vehicle registration, not for licenses. What is right?","o":["Licenses must always be renewed in person","Online services cover only registration and ticket payments","Eligible drivers can renew a license online","Online renewal is only for drivers who renewed in person before"],"ci":2,"r":"License renewal is available online for eligible drivers.","x":1},{"id":"q-1a-105","f":"s4-03","topic":"Renewal, address and name changes","stem":"Which statement about renewing a license online is true?","o":["Every driver can do it, with no exceptions","Some drivers are not eligible and must visit a DMV office","Some drivers are not eligible and must wait a year to renew","It is open only to drivers on their first renewal"],"ci":1,"r":"Some drivers are ineligible for online renewal and must visit a DMV office.","x":1},{"id":"q-1a-106","f":"s4-03","topic":"Renewal, address and name changes","stem":"Pavel's license has just expired. He tries to renew online, but the site will not let him. What should he do?","o":["Wait a week and try the site again","Book an in-person visit at a DMV office","Keep driving on the expired license until he gets to an office","Renew through a third-party site that charges a fee"],"ci":1,"r":"A driver who is not eligible online must renew in person at a DMV office.","x":1},{"id":"q-1a-107","f":"s4-03","topic":"Renewal, address and name changes","stem":"One neighbor renewed online. Another was told to come to the office. What is the most likely explanation?","o":["The second neighbor's license has been cancelled","The second neighbor lives in a county without online renewal","The second neighbor is not eligible for online renewal","The second neighbor's license expires on a different day of the month"],"ci":2,"r":"Some drivers are not eligible for online renewal, which is why the two neighbors differ.","x":1},{"id":"q-1a-108","f":"s4-04","topic":"Renewal, address and name changes","stem":"At renewal, what extra item might the DMV ask you for?","o":["Additional proof of identity","A fresh road test","Proof of car insurance","Your vehicle registration card"],"ci":0,"r":"Additional proof of identity may be required to renew.","x":1},{"id":"q-1a-109","f":"s4-04","topic":"Renewal, address and name changes","stem":"At the renewal counter, the clerk asks Ruth to show another identity document. What is true?","o":["The clerk is wrong, since renewal almost never asks for documents","The clerk is right, since renewal can require extra identity proof","The clerk is wrong, since usually only first-time applicants prove identity","The clerk is right, but only if she has moved recently"],"ci":1,"r":"The DMV may ask for additional proof of identity when someone renews.","x":1},{"id":"q-1a-110","f":"s4-04","topic":"Renewal, address and name changes","stem":"Jon expects a routine renewal to be only a payment and a photo. Which request might surprise him?","o":["A request to retake the road test","A request to complete a refresher course","A request for additional proof of identity","A request for a doctor's note"],"ci":2,"r":"Renewal can include a request for additional proof of identity.","x":1},{"id":"q-1a-111","f":"s4-05","topic":"Renewal, address and name changes","stem":"Who must sign a renewal application for a driver under 18?","o":["A parent or guardian","The driving instructor who taught him","A licensed adult aged 25 or older","The teen alone"],"ci":0,"r":"A parent or guardian must sign the renewal of a driver under 18.","x":1},{"id":"q-1a-112","f":"s4-05","topic":"Renewal, address and name changes","stem":"Isaac, 17, is renewing his license. Which signature must the renewal include?","o":["His own signature, since he is licensed","His parent's or guardian's signature","His driving instructor's signature","Any licensed adult's signature"],"ci":1,"r":"A driver under 18 needs a parent or guardian to sign the renewal.","x":1},{"id":"q-1a-113","f":"s4-05","topic":"Renewal, address and name changes","stem":"Which age line triggers a parent's signature on a renewal?","o":["Under 16","Under 18","Under 21","Under 25"],"ci":1,"r":"The signature rule applies to drivers under 18.","x":1},{"id":"q-1a-114","f":"s4-06","topic":"Renewal, address and name changes","stem":"How soon after moving must you tell the DMV your new address?","o":["90 days","10 days","6 months","At your next renewal"],"ci":1,"r":"A new address must be reported to the DMV within 10 days.","x":1},{"id":"q-1a-115","f":"s4-06","topic":"Renewal, address and name changes","stem":"Hye-jin moved to a new apartment across town yesterday. Her license still shows the old address. What should she do?","o":["Tell the DMV at her next renewal","Tell the DMV within 30 days","Do nothing, since she stayed in the same city","Tell the DMV within 10 days"],"ci":3,"r":"Any move must be reported within 10 days, even a short one in the same city.","x":1},{"id":"q-1a-116","f":"s4-06","topic":"Renewal, address and name changes","stem":"Which of these changes must be reported to the DMV within 10 days?","o":["A new phone number","A new home address","A new car insurer","A new email address"],"ci":1,"r":"The 10-day duty covers a change of home address.","x":1},{"id":"q-1a-117","f":"s4-07","topic":"Renewal, address and name changes","stem":"Which step produces a license card that shows a new address?","o":["Reporting the move to the DMV","Ordering a replacement card for a fee","Filing a change of address with the post office","Updating the car's registration address"],"ci":1,"r":"A replacement card must be requested and costs a fee. It is not issued automatically.","x":1},{"id":"q-1a-118","f":"s4-07","topic":"Renewal, address and name changes","stem":"Hye-jin updated her address online. Three weeks later her card still shows the old one. Why?","o":["The card is updated at her next renewal, not before","A replacement card must be requested and paid for","The DMV mails new cards out in batches every six months","Online changes are recorded only after an office visit"],"ci":1,"r":"Reporting a move updates the record. A card with the new address is a separate paid request.","x":1},{"id":"q-1a-119","f":"s4-07","topic":"Renewal, address and name changes","stem":"Hye-jin reported her new address online. Which statement about her license card is right?","o":["A card with the new address is mailed to her free","Her old card is void, so she cannot drive until a new one arrives","A card with the new address needs a paid replacement request","She can get a card with the new address only by renewing"],"ci":2,"r":"The address change and the replacement card are two separate steps.","x":1},{"id":"q-1a-120","f":"s4-08","topic":"Renewal, address and name changes","stem":"A California license holder living out of state is nearing expiry. What can the holder request?","o":["A grace period of a few days after expiry","A one-year extension, requested before expiry","No extension; he must return and renew in person","A free replacement card mailed to the other state"],"ci":1,"r":"An out-of-state resident may request a one-year extension before the license expires.","x":1},{"id":"q-1a-121","f":"s4-08","topic":"Renewal, address and name changes","stem":"Teo works in another state for now and plans to return. His California license expires in six weeks. What should he do?","o":["Let it expire and keep driving on it there","Request an extension before it expires","Request the extension after it expires","Ignore the date, since being away pauses the expiry"],"ci":1,"r":"He should ask for the one-year extension before the expiry date.","x":1},{"id":"q-1a-122","f":"s4-08","topic":"Renewal, address and name changes","stem":"When must an out-of-state driver ask for the one-year extension?","o":["Within 10 days after expiry","Within 30 days after he moves out of state","Within 30 days after the license expires","Before the license expires"],"ci":3,"r":"The request is made before the expiration date.","x":1},{"id":"q-1a-123","f":"s4-09","topic":"Renewal, address and name changes","stem":"Which license cannot be extended through the out-of-state extension?","o":["A license that is REAL ID compliant","A Class C license with a motorcycle class","A limited-term license","A license with a veteran designation"],"ci":2,"r":"Limited-term licenses are not eligible for renewal extensions.","x":1},{"id":"q-1a-124","f":"s4-09","topic":"Renewal, address and name changes","stem":"Anya lives out of state and holds a limited-term license that expires next month. She asks for the one-year extension. What happens?","o":["The extension is granted because she lives out of state","She gets six months instead of a full year","She must first return to California in person","Her license type is not eligible for extensions"],"ci":3,"r":"Limited-term licenses are not eligible for extensions, so Anya must renew another way.","x":1},{"id":"q-1a-126","f":"p15_changes-007","topic":"Senior renewal and ID cards","stem":"Walter is 73 with a clean record and is renewing his license. Which part of the renewal does he skip?","o":["The vision exam at the counter","The photo taken at the counter","The written knowledge test","The renewal fee"],"ci":2,"r":"Drivers 70 and over with a clean record can skip the written test at renewal. The vision exam, photo and fee stay.","x":1},{"id":"q-1a-127","f":"p15_changes-007","topic":"Senior renewal and ID cards","stem":"Two 72-year-olds renew. One has a clean record. The other had several recent crashes. Which of them skips the written knowledge test?","o":["Both skip it, since at 72 age alone is enough to qualify","Neither skips it, since the waiver is only for online renewals","Only the crash-record driver skips it, since the waiver targets higher-risk drivers","Only the clean-record driver skips it, as the waiver requires a clean record"],"ci":3,"r":"The waiver needs both age 70 or over and a clean record. A poor record can still mean a knowledge test.","x":1},{"id":"q-1b-001","f":"s4-10","topic":"Renewal, address and name changes","stem":"Which of these license-record changes must go through the DMV's own change process?","o":["Getting a new phone number","Switching to a different car insurer","Buying a different car","Changing your legal name"],"ci":3,"r":"Legal name, physical description and gender identity changes go through the DMV's own process.","x":1},{"id":"q-1b-002","f":"s4-10","topic":"Renewal, address and name changes","stem":"Marisol marries and takes a new surname. Her license still shows the old one. What should she do?","o":["Start the DMV's name-change process with her documents","Tell her insurer, which updates the DMV for her","Wait until the license expires and renew it","Keep driving, since the photo still looks like her"],"ci":0,"r":"A legal name change must be reported to the DMV through its change process.","x":1},{"id":"q-1b-003","f":"s4-10","topic":"Renewal, address and name changes","stem":"Two license updates: a new home address, and a changed legal name. Which statement is right?","o":["Both are only done when the license is renewed","The address has a day limit; the name has its own DMV process","The address change is optional, but the name change has a deadline","Both can be ignored if the card is still valid"],"ci":1,"r":"An address change has a deadline of 10 days, and a legal name change has its own DMV process.","x":1},{"id":"q-3-001","f":"p15_changes-003","topic":"Speed cameras","stem":"Only a short list of named cities may run California's speed-camera pilot. Which city is on that list?","o":["Fresno","Long Beach","Bakersfield","Riverside"],"ci":1,"r":"Long Beach is one of the six named jurisdictions allowed to run speed cameras in the pilot.","x":1},{"id":"q-3-002","f":"p15_changes-003","topic":"Speed cameras","stem":"The council of a mid-sized town wants speed cameras on its main street. What does the pilot law allow?","o":["Only cities named in the law may run one","A public vote lets a town run one","School zones qualify a town to run one","A town may run one once it posts warning signs"],"ci":0,"r":"The law names its jurisdictions, so a town outside the list cannot start a speed-camera program.","x":1},{"id":"q-3-003","f":"p15_changes-003","topic":"Speed cameras","stem":"A friend says any California city can run speed cameras because Los Angeles does. Which reply is accurate?","o":["Cities above 100,000 people are all covered","Every city is covered once its council votes","Cities with school zones are all covered","Only a short list of named cities is covered"],"ci":3,"r":"The pilot covers a few cities named in the law, not the whole state.","x":1},{"id":"q-3-082","f":"s7_p11_run2-012","topic":"B-speed-readout","stem":"When is a school zone typically active?","o":["When the morning bell rings and doors open","When school buses are loading or unloading","At arrival and dismissal times and at school events","Only when yellow lights are flashing near the gate"],"ci":2,"r":"School zones are active during morning arrival, afternoon dismissal and school events.","x":1},{"id":"q-3-083","f":"s7_p11_run2-012","topic":"B-speed-readout","stem":"School ends at 3:00 and it is 2:55. The lot is full of parents, and no yellow lights are flashing. How do you drive?","o":["Normally, since the lights are off","Fast, to beat the dismissal rush","Normally, since the school day is over","Slowly, expecting children and parents"],"ci":3,"r":"School zones are busy around afternoon dismissal, so drive slowly then.","x":1},{"id":"q-3-084","f":"s7_p11_run2-012","topic":"B-speed-readout","stem":"Which time is a school zone most likely to be busy, even with no lights flashing?","o":["Tuesday at 11:30 p.m., when the building is dark","A weekday at 3:00 p.m., when school lets out","Sunday at 4 a.m., when the street is empty","Wednesday at 2 a.m., when the lot is locked"],"ci":1,"r":"Afternoon dismissal is one of the times a school zone is typically active.","x":1},{"id":"q-4-064","f":"s6_p11_run2-015","topic":"hov-fines","stem":"What can happen if you drive in a carpool lane without enough people?","o":["Your clean-air decal is taken away, and no fine follows","You commit a traffic violation and may be fined for it","A fine applies when you also speed or cause a crash","A warning is given first, and a fine comes after a repeat"],"ci":1,"r":"Using an HOV lane without meeting the occupancy rule is a traffic violation with fines.","x":1},{"id":"q-4-065","f":"s6_p11_run2-015","topic":"hov-fines","stem":"You are late and alone, and the carpool lane is clear while the other lanes crawl. What is the consequence of using it?","o":["Only a warning, never a fine, on a first offense","A traffic violation, which can bring a fine","A penalty only if an officer happens to see you","No penalty, because a clear lane harms no other driver"],"ci":1,"r":"A clear lane does not waive the occupancy rule.","x":1},{"id":"q-4-066","f":"s6_p11_run2-015","topic":"hov-fines","stem":"Which pair is matched correctly?","o":["Carpool lane: obey the light like any signal; ramp meter: too few people means a fine","Carpool lane: no penalty if the lane is empty; ramp meter: advice only","Carpool lane and ramp meter: both count the people in your car","Carpool lane: too few people means a fine; ramp meter: obey the light like any signal"],"ci":3,"r":"Carpool lanes have occupancy rules with fines, and a ramp meter is obeyed like any other traffic signal.","x":1},{"id":"q-4-067","f":"s6_p11_run2-016","topic":"Smog and emissions","stem":"What happened to the clean-air vehicle decals that let some cars use carpool lanes?","o":["The decals no longer work: the program ended in 2025","The decals still work in every carpool lane at all hours","The decals stay valid for the life of the car once issued","The decals now let any hybrid car use carpool lanes alone"],"ci":0,"r":"Clean-air decals once allowed HOV lane use, but the program ended in 2025.","x":1},{"id":"q-4-068","f":"s6_p11_run2-016","topic":"Smog and emissions","stem":"A friend with a 2022 clean-air decal drives alone in a carpool lane. What should you tell him?","o":["He can keep driving alone, since the decal gives lifetime access","He should renew the decal, since renewal keeps the access going","He may drive alone only at off-peak hours with the decal","He should check the current rules, since the program ended in 2025"],"ci":3,"r":"Decals once allowed HOV use, but the program ended in 2025.","x":1},{"id":"q-4-069","f":"s6_p11_run2-016","topic":"Smog and emissions","stem":"Which way of using a carpool lane is still correct after 2025?","o":["Having the posted number of people, per the signs","Using a clean-air decal alone","Using either a decal or enough people, for any car","Using a decal that was issued before 2025"],"ci":0,"r":"Occupancy per the posted signs is still the basis; the decal route ended in 2025.","x":1},{"id":"q-5a-007","f":"s12-002","topic":"Medical conditions and senior driving","stem":"Which of these is named among the conditions that can create a driving safety risk and call for DMV assessment?","o":["Being over 65 years old","Vertigo, a spinning kind of dizziness","Needing glasses for distance","Mild seasonal allergies"],"ci":1,"r":"Vertigo is listed with dementia, seizures, brain tumors, Parkinson's disease and strokes as a condition needing DMV assessment.","x":1},{"id":"q-5a-008","f":"s12-002","topic":"Medical conditions and senior driving","stem":"Your uncle had a stroke last spring and says he feels fine to drive. What does the handbook's guidance mean for him?","o":["He can keep driving, but only on short trips close to home","A stroke can make driving unsafe, so the DMV may assess him","An assessment can only follow a crash, never come before one","A stroke can matter for truckers and bus drivers, but not for ordinary drivers"],"ci":1,"r":"Strokes are on the list of conditions that create highway safety risks requiring DMV assessment.","x":1},{"id":"q-5a-009","f":"s12-002","topic":"Medical conditions and senior driving","stem":"After a doctor reports that a patient has a seizure disorder, who decides whether the patient is safe to keep driving?","o":["The patient's car insurance company","The doctor alone, without any DMV role","The patient's family members","The DMV, through its own assessment"],"ci":3,"r":"Seizures and similar conditions create highway safety risks that require DMV assessment.","x":1},{"id":"q-5a-010","f":"s12-007","topic":"Medical conditions and senior driving","stem":"You doubt your own driving ability. What step does the handbook suggest?","o":["Limit yourself to short local trips and hope it improves","Ask any passenger to tell you if they feel nervous","Ask a trusted licensed driver to observe you while you drive","Wait for the DMV to send a letter calling you in"],"ci":2,"r":"The handbook suggests asking a trusted licensed driver to observe your driving.","x":1},{"id":"q-5a-011","f":"s12-007","topic":"Medical conditions and senior driving","stem":"Gwen is 70 and has noticed she hesitates more at busy intersections. She wants an honest opinion. What fits the handbook best?","o":["Rely on her own feeling, since she has driven for many decades","Give up the keys now, with no one watching her drive first","Ride with a trusted licensed driver who watches her closely","Take a week off from driving to see if it passes"],"ci":2,"r":"Asking a trusted licensed driver to observe is the handbook's way to get an outside view.","x":1},{"id":"q-5a-012","f":"s12-007","topic":"Medical conditions and senior driving","stem":"Ravi worries about his driving but has no diagnosed condition. What can he do right now?","o":["Wait for the DMV to order an assessment","Have his doctor file a report to the DMV first","Take the written test again on his own schedule","Ask a trusted licensed driver to observe him driving"],"ci":3,"r":"Anyone can ask a trusted licensed driver to observe their driving; no report or order is needed.","x":1},{"id":"q-5a-013","f":"s13-006","topic":"Senior renewal and ID cards","stem":"How long is the DMV Mature Driver Improvement Program course?","o":["3 hours","5 hours","12 hours","8 hours"],"ci":3,"r":"The course is 8 hours long and is made for drivers age 55 and older.","x":1},{"id":"q-5a-014","f":"s13-006","topic":"Senior renewal and ID cards","stem":"Pat is 58 and is thinking about the DMV's Mature Driver Improvement Program. Which statement fits?","o":["Pat is too young, since the program starts at 65","Pat is eligible, since the program starts at 55","Pat is eligible, but only with a doctor's note","Pat is too young, since it is for drivers over 70"],"ci":1,"r":"The program is for drivers age 55 and older, so a 58-year-old can take it.","x":1},{"id":"q-5a-015","f":"s13-006","topic":"Senior renewal and ID cards","stem":"Which pairing of age and length matches the Mature Driver Improvement Program?","o":["Age 65 and older, 8 hours","Age 55 and older, 16 hours","Age 55 and older, 3 hours","Age 55 and older, 8 hours"],"ci":3,"r":"The course is for drivers age 55 and older and runs 8 hours.","x":1},{"id":"q-5a-016","f":"s13-008","topic":"Medical conditions and senior driving","stem":"Which of these is a warning sign that a driver's ability may be shrinking?","o":["Feeling stiff after a long day behind the wheel","Needing reading glasses to make out small print on labels","Finding dents on the car with no idea how they got there","Turning the radio down to focus in heavy traffic"],"ci":2,"r":"Unexplained vehicle damage is one of the warning signs of diminished driving ability.","x":1},{"id":"q-5a-018","f":"s13-008","topic":"Medical conditions and senior driving","stem":"Which of these is more likely to be a sign that a driver's ability is slipping?","o":["Needing a moment to adjust the seat in a borrowed car","Stopping to rest after two hours of driving","Getting lost twice on streets near the driver's own home","Choosing to avoid driving during rush hour"],"ci":2,"r":"Getting lost in familiar locations is a named warning sign of diminished driving ability.","x":1},{"id":"q-5a-019","f":"s13-009","topic":"Medical conditions and senior driving","stem":"What does the handbook say about dementia and the ability to drive safely over time?","o":["Medical care lets the person keep driving safely for life","Safe driving ends once the person reaches about age 80","Safe driving is lost eventually, whatever treatment is given","Driving only short trips on familiar roads removes the risk"],"ci":2,"r":"Dementia and similar progressive conditions ultimately end safe driving, regardless of medical help.","x":1},{"id":"q-5a-020","f":"s13-009","topic":"Medical conditions and senior driving","stem":"Lena's father has dementia and takes his medicine faithfully. He asks if that means he can drive as long as he likes. What should Lena tell him?","o":["Treatment will not stop the eventual loss of safe driving","Medicine holds off the decline, so he can drive until a checkup","He is safe so long as someone rides along with him","Driving only near home keeps the risk low enough"],"ci":0,"r":"Progressive conditions like dementia ultimately end safe driving, even with treatment.","x":1},{"id":"q-5a-021","f":"s13-009","topic":"Medical conditions and senior driving","stem":"Sam says good treatment means a parent with dementia can drive for many more years. Kim disagrees. Who matches the handbook?","o":["Sam, since good treatment can fully stop the decline","Sam, since the parent can drive until the illness is severe","Kim, but only if the parent also drives at night","Kim, since the condition keeps progressing"],"ci":3,"r":"Dementia ultimately ends safe driving capability, regardless of medical help.","x":1},{"id":"q-5a-022","f":"s5-01","topic":"Medical conditions and senior driving","stem":"Which ability do you rely on to read road signs and spot hazards in changing light?","o":["Clear vision","Good hearing","Good balance","Fast reflexes"],"ci":0,"r":"Clear vision is needed to detect hazards in different lighting and to read road signs.","x":1},{"id":"q-5a-023","f":"s5-01","topic":"Medical conditions and senior driving","stem":"At dusk you notice you cannot read a road sign until you are almost under it. What does this mean for your driving?","o":["Your hearing may be the real problem here, not your eyes","Signs can be hard to read at dusk, so you can ignore it","Your vision may be too weak to catch signs in time","Your dashboard lights may be too bright for you"],"ci":2,"r":"Clear vision is required to read signs and detect hazards in different lighting, such as dusk.","x":1},{"id":"q-5a-024","f":"s5-01","topic":"Medical conditions and senior driving","stem":"Which pair correctly matches a driver's need with the ability behind it?","o":["Reading signs needs hearing; spotting sirens needs vision","Reading signs needs vision; spotting sirens needs reaction time","Reading signs needs vision; noticing sirens needs hearing","Reading signs needs reaction time; noticing sirens needs hearing"],"ci":2,"r":"Vision lets you read signs and detect hazards; hearing lets you detect horns and sirens.","x":1},{"id":"q-5a-025","f":"s5-02","topic":"Fatigue, medicines and drugs","stem":"What is adequate hearing needed for while driving?","o":["Reading road signs","Judging your gap to the car ahead","Feeling the road surface","Noticing horns and sirens"],"ci":3,"r":"Hearing is needed to detect warning signals such as horns and sirens.","x":1},{"id":"q-5a-026","f":"s5-02","topic":"Fatigue, medicines and drugs","stem":"A driver with hearing loss in both ears wants to keep driving. Which danger does that raise most directly?","o":["Missing a horn or siren that warns of danger","Misreading a stop sign from far away","Overlooking a car in the blind spot","Misjudging how far away a car is"],"ci":0,"r":"Adequate hearing is needed to detect warning signals like horns and sirens.","x":1},{"id":"q-5a-027","f":"s5-02","topic":"Fatigue, medicines and drugs","stem":"A driver says mirrors can replace good hearing. Which reply fits the handbook?","o":["Yes, mirrors show where every siren is coming from","Yes, if you check the mirrors every few seconds","No for sirens, but mirrors are enough for horns","No, hearing catches horns and sirens that mirrors miss"],"ci":3,"r":"Hearing is needed to detect horns and sirens; mirrors show only what is in view.","x":1},{"id":"q-5a-028","f":"s5-03","topic":"Fatigue, medicines and drugs","stem":"How does being tired change your driving ability?","o":["It slows your reactions but leaves your vision sharp","It blurs your vision and slows your reaction time","It makes you miss sounds but not sights","It has no effect until you actually fall asleep"],"ci":1,"r":"Fatigue reduces vision clarity and increases reaction time.","x":1},{"id":"q-5a-029","f":"s5-03","topic":"Fatigue, medicines and drugs","stem":"After a long night shift, Omar drives home with heavy eyelids. Which risk is higher for him than on a rested day?","o":["Hearing a siren less clearly than usual","Reacting late to a hazard that looks blurry","Brakes that take longer to grab","Finding it harder to steer at the 9 and 3 positions"],"ci":1,"r":"Fatigue reduces vision clarity and slows reaction time.","x":1},{"id":"q-5a-030","f":"s5-03","topic":"Fatigue, medicines and drugs","stem":"A tired driver says, \"I can see the road fine, so my reactions are not affected.\" What is wrong with that thinking?","o":["Nothing is wrong, since clear vision is what matters most when driving","Fatigue also dulls hearing, but reactions stay as quick as ever","Fatigue also slows reaction time, so seeing well is not enough","Fatigue matters only after several hours of nonstop driving"],"ci":2,"r":"Fatigue reduces vision clarity and also increases reaction time.","x":1},{"id":"q-5a-034","f":"s5-05","topic":"Medical conditions and senior driving","stem":"Who must report patients whose medical conditions affect their driving safety?","o":["Employers","Physicians","Family members","Insurance agents"],"ci":1,"r":"Physicians must report patients 14 years and older who have medical conditions affecting driving safety.","x":1},{"id":"q-5a-035","f":"s5-05","topic":"Medical conditions and senior driving","stem":"A physician treats a 15-year-old and a 12-year-old, both with conditions that make driving unsafe. Whom must the physician report?","o":["Only the 15-year-old","Only the 12-year-old","Both of them","Neither, since reports start at 16"],"ci":0,"r":"The duty covers patients 14 years and older, so the 15-year-old is covered and the 12-year-old is not.","x":1},{"id":"q-5a-036","f":"s5-05","topic":"Medical conditions and senior driving","stem":"Which pair of ages is right: physician reporting starts at one, and the Mature Driver Improvement Program starts at the other?","o":["Reporting at 55; program at 14","Reporting at 16; program at 65","Reporting at 16; program at 55","Reporting at 14; program at 55"],"ci":3,"r":"Physicians report patients 14 and older, and the Mature Driver Improvement Program is for drivers 55 and older.","x":1},{"id":"q-5a-040","f":"s5-07","topic":"Steering technique","stem":"For which tasks is hand-over-hand steering the right technique?","o":["Lane changes, merging, and following a gentle curve","Low-speed turns, parking, and recovering from a skid","Freeway cruising, long gentle curves, and passing","Driving in a straight line on a quiet road"],"ci":1,"r":"Hand-over-hand steering suits low-speed turns, parking and skid recovery.","x":1},{"id":"q-5a-041","f":"s5-07","topic":"Steering technique","stem":"Your car begins to skid on a wet curve and you must steer quickly. Which tech

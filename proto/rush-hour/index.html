ver education. Who can get a permit?","o":["Both can get one now","Hana only","Marcus only","Neither can"],"ci":2,"r":"Driver education is required for applicants under 18, before the permit."},{"id":"q-1a-057","f":"s2-07","topic":"Teen driver rules (education, permits, passengers)","stem":"Who must sign a minor's application and accept financial responsibility?","o":["The teen's driving instructor","The licensed adult who rides along in practice","The teen's insurance agent","The teen's parent or guardian"],"ci":3,"r":"A parent or guardian signs the application and accepts financial responsibility for a driver under 18."},{"id":"q-1a-058","f":"s2-07","topic":"Teen driver rules (education, permits, passengers)","stem":"Dev, 17, goes to apply with his friend's mom because his parents are at work. She offers to sign. What does the DMV require?","o":["She may sign, since she is over 25 and licensed","Only a parent or guardian can sign for him","She may sign if his parents send a note","He must wait until he is 18 and then apply alone"],"ci":1,"r":"Only a parent or guardian can sign and accept responsibility for a minor."},{"id":"q-1a-059","f":"s2-07","topic":"Teen driver rules (education, permits, passengers)","stem":"What does a parent's signature on a teen's application mean?","o":["They promise to ride along on every practice drive","They accept financial responsibility for the teen's driving","They certify the teen has finished driver education","They only confirm the teen's identity and age"],"ci":1,"r":"The signature approves the application and accepts financial responsibility for the minor."},{"id":"q-1a-066","f":"s2-10","topic":"Teen driver rules (education, permits, passengers)","stem":"How many hours of supervised practice must a minor complete, and how many must be at night?","o":["40 hours, 10 at night","50 hours, 15 at night","60 hours, 10 at night","50 hours, 10 at night"],"ci":3,"r":"A minor must log at least 50 hours of supervised driving, including 10 hours at night."},{"id":"q-1a-067","f":"s2-10","topic":"Teen driver rules (education, permits, passengers)","stem":"Ines, 16, holds a permit and has logged 55 hours with her mother, all on afternoon drives. What does she still need before her road test?","o":["Ten of her hours must be at night","Nothing, since 55 is more than 50","Twenty-five hours with a driving instructor","Ten hours with a different supervising adult"],"ci":0,"r":"The 50 hours must include at least 10 at night. Daytime hours alone fall short."},{"id":"q-1a-068","f":"s2-10","topic":"Teen driver rules (education, permits, passengers)","stem":"Which statement about the 50 hours is right?","o":["The 10 night hours are added on top of the 50","The 10 night hours count within the 50","At least 25 of the 50 hours must be at night","Only hours with a driving instructor count"],"ci":1,"r":"The 50 total hours include the 10 night hours."},{"id":"q-1a-069","f":"s2-11","topic":"Teen night-driving limit","stem":"In the first 12 months after getting a license, when may a driver under 18 not drive alone?","o":["From 9 at night until 5 in the morning","From midnight until 6 in the morning","From 11 at night until 5 in the morning","From sunset until sunrise"],"ci":2,"r":"New drivers under 18 may not drive between 11 p.m. and 5 a.m. during the first 12 months, unless an exception applies."},{"id":"q-1a-070","f":"s2-11","topic":"Teen night-driving limit","stem":"Zoe, 17, got her license four months ago. At 11:30 p.m. she wants to drive alone for a snack. No exception applies. Which rule governs her?","o":["A curfew applies only on school nights","The curfew ends after six months of licensing","The first-year curfew rules out the drive","A curfew applies, but it starts at midnight"],"ci":2,"r":"She is inside her first 12 months and under 18, so the 11 p.m. to 5 a.m. limit applies."},{"id":"q-1a-072","f":"s2-12","topic":"Teen driver rules (education, permits, passengers)","stem":"A new driver under 18 may carry passengers younger than what age only with a qualified adult aboard?","o":["18","16","20","21"],"ci":2,"r":"A driver under 18 may not carry passengers under 20 unless a qualified adult aged 25 or older is supervising."},{"id":"q-1a-074","f":"s2-12","topic":"Teen driver rules (education, permits, passengers)","stem":"A 17-year-old in her first year drives with no qualified adult aboard and no exception. Which rider would break the passenger limit?","o":["A 20-year-old friend","A 19-year-old cousin","A 22-year-old neighbor","A 21-year-old coworker"],"ci":1,"r":"The limit covers passengers under 20. A rider aged 19 is covered. Riders aged 20 or older are not."},{"id":"q-1a-093","f":"s3-07","topic":"Teen driver rules (education, permits, passengers)","stem":"What is the minimum age of a licensed supervising driver for a permit holder who is a minor?","o":["18","21","25","16"],"ci":2,"r":"A licensed supervising driver must be 18 or older, and 25 or older for a minor."},{"id":"q-1a-094","f":"s3-07","topic":"Teen driver rules (education, permits, passengers)","stem":"Rosa, 22, holds an instruction permit. Her friend, 19, with a valid California license, offers to ride along while she practices. Is that allowed?","o":["No, a supervising driver must always be 25 or older","Yes, 18 or older is enough for an adult permit holder","No, the supervising driver must be at least 21 years old","Yes, but only if he has held his license for a year"],"ci":1,"r":"For an adult permit holder the licensed supervising driver must be 18 or older."},{"id":"q-1a-095","f":"s3-07","topic":"Teen driver rules (education, permits, passengers)","stem":"Jin (16) and Rosa (22) both hold permits. Each practices with a licensed 21-year-old. What is true?","o":["Both supervisors qualify","Neither supervisor qualifies","Jin's supervisor qualifies; Rosa's does not","Rosa's supervisor qualifies; Jin's does not"],"ci":3,"r":"A supervisor for a minor must be 25 or older. For an adult permit holder, 18 or older is enough."},{"id":"q-1b-097","f":"signs-036","topic":"Warning signs (steep hill, low clearance)","stem":"A yellow diamond shows a truck on a steep slope. What does it tell you?","o":["A steep hill is ahead","Trucks must stop here","A truck lane begins","A weigh station is ahead"],"ci":0,"r":"It warns of a steep slope. Use a low gear going down."},{"id":"q-1b-098","f":"signs-036","topic":"Warning signs (steep hill, low clearance)","stem":"You see the steep-hill sign at the top of a long grade. How should you go down?","o":["Drive fast to build momentum","Brake hard all the way down","Coast in neutral to save fuel","Use a low gear to control your speed"],"ci":3,"r":"A low gear lets the engine help hold your speed on the way down."},{"id":"q-1b-099","f":"signs-037","topic":"Warning signs (steep hill, low clearance)","stem":"A yellow diamond shows an arrow pointing at a bar over the road, with a height number. What is the warning?","o":["A low bridge or wire is ahead","A weight limit applies","A tall building is ahead","A narrow lane begins"],"ci":0,"r":"The sign warns that a bridge or wire is low and tall vehicles may not fit."},{"id":"q-1b-100","f":"signs-037","topic":"Warning signs (steep hill, low clearance)","stem":"You drive a tall moving van and see the low-clearance sign. You are not sure the van fits. What should you do?","o":["Speed up to pass quickly","Pull up beside the bridge and judge the gap by eye","Stop and find another route","Follow the car ahead, since it got through"],"ci":2,"r":"If the vehicle may not fit, choose another route."},{"id":"q-5a-025","f":"s5-02","topic":"Fatigue, medicines and drugs","stem":"What is adequate hearing needed for while driving?","o":["Reading road signs","Judging your gap to the car ahead","Feeling the road surface","Noticing horns and sirens"],"ci":3,"r":"Hearing is needed to detect warning signals such as horns and sirens."},{"id":"q-5a-026","f":"s5-02","topic":"Fatigue, medicines and drugs","stem":"A driver with hearing loss in both ears wants to keep driving. Which danger does that raise most directly?","o":["Missing a horn or siren that warns of danger","Misreading a stop sign from far away","Overlooking a car in the blind spot","Misjudging how far away a car is"],"ci":0,"r":"Adequate hearing is needed to detect warning signals like horns and sirens."},{"id":"q-5a-027","f":"s5-02","topic":"Fatigue, medicines and drugs","stem":"A driver says mirrors can replace good hearing. Which reply fits the handbook?","o":["Yes, mirrors show where every siren is coming from","Yes, if you check the mirrors every few seconds","No for sirens, but mirrors are enough for horns","No, hearing catches horns and sirens that mirrors miss"],"ci":3,"r":"Hearing is needed to detect horns and sirens; mirrors show only what is in view."},{"id":"q-5a-028","f":"s5-03","topic":"Fatigue, medicines and drugs","stem":"How does being tired change your driving ability?","o":["It slows your reactions but leaves your vision sharp","It blurs your vision and slows your reaction time","It makes you miss sounds but not sights","It has no effect until you actually fall asleep"],"ci":1,"r":"Fatigue reduces vision clarity and increases reaction time."},{"id":"q-5a-029","f":"s5-03","topic":"Fatigue, medicines and drugs","stem":"After a long night shift, Omar drives home with heavy eyelids. Which risk is higher for him than on a rested day?","o":["Hearing a siren less clearly than usual","Reacting late to a hazard that looks blurry","Brakes that take longer to grab","Finding it harder to steer at the 9 and 3 positions"],"ci":1,"r":"Fatigue reduces vision clarity and slows reaction time."},{"id":"q-5a-030","f":"s5-03","topic":"Fatigue, medicines and drugs","stem":"A tired driver says, \"I can see the road fine, so my reactions are not affected.\" What is wrong with that thinking?","o":["Nothing is wrong, since clear vision is what matters most when driving","Fatigue also dulls hearing, but reactions stay as quick as ever","Fatigue also slows reaction time, so seeing well is not enough","Fatigue matters only after several hours of nonstop driving"],"ci":2,"r":"Fatigue reduces vision clarity and also increases reaction time."},{"id":"q-5a-031","f":"s5-04","topic":"Fatigue, medicines and drugs","stem":"Which statement about over-the-counter medicines and driving is right?","o":["They can impair driving, just like prescribed medicines","They are safe to drive on, since stores sell them freely","They can affect driving only when mixed with alcohol","They must never be taken by anyone who drives"],"ci":0,"r":"Both prescription and over-the-counter medications can impair driving ability."},{"id":"q-5a-032","f":"s5-04","topic":"Fatigue, medicines and drugs","stem":"You took a cold tablet from a store shelf, and now you need to drive to work. What should you think?","o":["It is safe, since you needed no prescription to buy it","It can still impair your driving, even without a prescription","Drowsiness comes only from prescribed drugs, so you are fine","It impairs your driving only if you also drink alcohol"],"ci":1,"r":"Over-the-counter medicines can impair driving just like prescription ones."},{"id":"q-5a-033","f":"s5-04","topic":"Fatigue, medicines and drugs","stem":"Dev says store-bought remedies are safer to drive on than prescribed ones. What is the right view?","o":["Store-bought kinds are mild, so they are safe to drive on","Neither kind is automatically safe to drive on","Prescribed kinds are safer, since a doctor checked them","Prescribed kinds can impair you, but store-bought kinds never do"],"ci":1,"r":"Both prescription and over-the-counter medications can impair driving ability."},{"id":"q-5b-010","f":"s7_p11_roadway-027","topic":"Scanning ahead for hazards","stem":"How far ahead of your car should you keep looking so you can spot hazards early?","o":["Only at the car directly in front of you","About 3 seconds of travel ahead","At least 10 seconds of travel ahead","About 6 seconds of travel ahead"],"ci":2,"r":"The guideline is to scan at least 10 seconds ahead along your path."},{"id":"q-5b-012","f":"s7_p11_roadway-027","topic":"Scanning ahead for hazards","stem":"What does the figure of '10 seconds' describe for a careful driver?","o":["How far down the road to look for hazards","The gap to leave behind the vehicle you follow","The most time you may take your eyes off the road"],"ci":0,"r":"Ten seconds is how far ahead you should look; it is not a following gap or a safe time to look away."},{"id":"q-5b-016","f":"s7_p11_run2-023","topic":"Headlights and lighting","stem":"What is the rule on headlights during bright, clear daytime driving in California?","o":["They are required whenever the car is moving, as a safety rule","They are required on freeways only, because of the speeds","They are not required, though they make you easier to see","They are not required, and using them mostly wastes the bulbs"],"ci":2,"r":"In clear daytime driving, headlights are not required, but they improve how well others see you."},{"id":"q-5b-017","f":"s7_p11_run2-023","topic":"Headlights and lighting","stem":"It is noon, the sky is clear, and your headlights are off. A passenger says the law requires them. What is accurate?","o":["She is right; a car in motion must show lights","She is right, but only on two-lane roads","She is wrong, though using them would help others see you","She is wrong, and using them in daylight would be a violation"],"ci":2,"r":"Clear-day headlights are optional, and they do add visibility."},{"id":"q-5b-018","f":"s7_p11_run2-023","topic":"Headlights and lighting","stem":"Which statement about headlights is correct?","o":["Optional on a clear day; needed after dark","Required on a clear day; optional after dark","Optional both day and night","Required both day and night in every weather"],"ci":0,"r":"Clear daytime driving does not require headlights, but darkness does."},{"id":"q-5b-076","f":"s8b-001","topic":"Seat belts and airbags","stem":"Where should the lap part of a seat belt sit on your body?","o":["Across your stomach","High across your lower ribs","Low and snug across your hips","Loose around your waist"],"ci":2,"r":"The lap belt belongs low and snug across the hips, with the shoulder strap across the chest."},{"id":"q-5b-077","f":"s8b-001","topic":"Seat belts and airbags","stem":"A passenger in your back seat tucks the shoulder strap behind her back. What is wrong with that?","o":["Nothing, as long as the lap belt is snug","The strap should lie across her neck for a tight fit","The strap must cross her chest to do its job","The strap should lie low across her stomach"],"ci":2,"r":"The shoulder strap should cross the chest with little slack, or the belt cannot hold the upper body."},{"id":"q-5b-078","f":"s8b-001","topic":"Seat belts and airbags","stem":"Who must wear a seat belt in a moving car?","o":["Everyone in the car, adults and children alike","The driver and front-seat passenger, but not the back seat","Anyone riding on a freeway, but not on city streets","Adults, since children use their own seats"],"ci":0,"r":"Everyone in the vehicle must be buckled with the belt placed correctly."},{"id":"q-5b-079","f":"s8b-002","topic":"Seat belts and airbags","stem":"How far should your breastbone be from the center of the steering wheel?","o":["No more than 10 inches","About 3 inches","About 5 inches","At least 10 inches"],"ci":3,"r":"Keep at least 10 inches between your breastbone and the wheel's center, so the airbag has room to inflate safely."},{"id":"q-5b-080","f":"s8b-002","topic":"Seat belts and airbags","stem":"You sit about 5 inches from the steering wheel to reach the pedals easily. What should you do?","o":["Stay close; the seat belt will hold you back anyway","Move back or tilt the wheel so you are at least 10 inches away","Lean back while driving and only sit close when parking","Switch off the airbag to sit closer"],"ci":1,"r":"At 5 inches the inflating airbag can strike you hard; get at least 10 inches while keeping control of the car."},{"id":"q-5b-081","f":"s8b-002","topic":"Seat belts and airbags","stem":"The 10-inch airbag figure is measured between which two points?","o":["The steering wheel center and your breastbone","Your knees and the lower edge of the dashboard","Your chin and the top rim of the steering wheel","Your lap and the bottom edge of the wheel"],"ci":0,"r":"The gap is measured from the steering wheel center to your breastbone."},{"id":"q-5b-082","f":"s8b-003","topic":"Child passengers","stem":"A child must stay rear-facing while all three of these are true. Which set of limits is right?","o":["Under 1 year, under 20 pounds, under 2 feet 6 inches","Under 4 years, under 60 pounds, under 4 feet","Under 2 years, under 40 pounds, under 3 feet 4 inches","Under 2 years, under 60 pounds, under 3 feet 4 inches"],"ci":2,"r":"A child under 2 years, under 40 pounds and under 3 feet 4 inches must ride rear-facing."},{"id":"q-5b-083","f":"s8b-003","topic":"Child passengers","stem":"You drive your 18-month-old niece, who weighs 24 pounds and is 33 inches tall. Which seat do you use?","o":["A forward-facing seat, since she walks","A rear-facing child seat, since she is still under the limits","A booster seat in the rear","A regular seat belt in the rear"],"ci":1,"r":"She is under 2, under 40 pounds and under 3 feet 4 inches, so she must ride rear-facing."},{"id":"q-5b-084","f":"s8b-003","topic":"Child passengers","stem":"Which child no longer has to ride rear-facing?","o":["A 14-month-old of 22 pounds and 30 inches","An 18-month-old of 25 pounds and 32 inches","A 23-month-old of 30 pounds and 34 inches","A 20-month-old of 41 pounds and 36 inches"],"ci":3,"r":"A child who weighs 40 pounds or more is past the weight limit, so the rear-facing rule no longer applies."},{"id":"q-5b-085","f":"s8b-004","topic":"Child passengers","stem":"Until what age must a child ride in a rear-seat car seat or booster, unless the law allows an exception?","o":["Age 4","Age 8","Age 6","Age 10"],"ci":1,"r":"A child under 8 must ride secured in the rear seat in a car seat or booster, except in cases the law allows."},{"id":"q-5b-086","f":"s8b-004","topic":"Child passengers","stem":"You offer a ride to a neighbor's 6-year-old who is about 3 feet 10 inches tall. You have no booster. What do you do?","o":["Seat her in the front passenger seat with the seat belt","Seat her in the rear seat with the adult belt pulled snug","Hold her on an adult's lap with the belt around both","Wait until she is in a rear-seat car seat or booster"],"ci":3,"r":"A child under 8 must be secured in a rear-seat car seat or booster unless an exception applies; she is short enough that none does."},{"id":"q-5b-087","f":"s8b-004","topic":"Child passengers","stem":"Which pair of cutoffs is correct for child seats?","o":["Rear-facing until 2; rear-seat restraint until 8","Rear-facing until 4; rear-seat restraint until 12","Rear-facing until 8; rear-seat restraint until 2","Rear-facing until 1; rear-seat restraint until 6"],"ci":0,"r":"A child must ride rear-facing under 2, and in a rear-seat car seat or booster under 8."},{"id":"q-5b-088","f":"s8b-005","topic":"Child passengers","stem":"Which child has reached both marks that allow a regular rear-seat belt?","o":["A 9-year-old who is 4 feet 6 inches","A 7-year-old who is 4 feet 11 inches","A 9-year-old who is 4 feet 10 inches","A 5-year-old who is 3 feet 11 inches"],"ci":2,"r":"A child who is 8 or older and at least 4 feet 9 inches tall may use a standard rear seat belt."},{"id":"q-5b-089","f":"s8b-005","topic":"Child passengers","stem":"You drive your 10-year-old cousin, who is 4 feet 11 inches tall. What does California law say about his rear-seat restraint?","o":["He must still ride in a car seat with a harness","He must use a booster seat until he turns 12","He may use a regular lap and shoulder belt now","He may use a regular belt only once he weighs 100 pounds"],"ci":2,"r":"A child 8 or older and 4 feet 9 inches or taller may use a standard rear seat belt."},{"id":"q-5b-090","f":"s8b-005","topic":"Child passengers","stem":"What tells you a child can move to a regular rear-seat belt?","o":["Age 8 or older and a height of 4 feet 9 inches or more","A sixth birthday, whatever the child's height","A weight of at least 80 pounds on the scale","Sitting tall enough to see out of the window"],"ci":0,"r":"Age and height together decide it: 8 or older and at least 4 feet 9 inches."},{"id":"q-5b-091","f":"s8b-007","topic":"Seat belts and airbags","stem":"Where should a pregnant driver place the lap belt?","o":["Across the middle of the belly","She may leave the lap belt off","Over the upper belly, under the breasts","Low, beneath the abdomen"],"ci":3,"r":"The lap belt goes low beneath the abdomen, with the shoulder strap between the breasts."},{"id":"q-5b-092","f":"s8b-007","topic":"Seat belts and airbags","stem":"A driver in her seventh month finds the lap belt riding over the top of her belly. What should she do?","o":["Leave it, since the belly gives a snug fit","Move it low beneath the abdomen so it rests on the hips","Put it under her arm to ease the pressure","Loosen it so it does not squeeze"],"ci":1,"r":"The lap belt must sit low beneath the abdomen."},{"id":"q-5b-093","f":"s8b-007","topic":"Seat belts and airbags","stem":"Which belt position is right for a pregnant driver?","o":["Lap belt low beneath the belly, strap between the breasts","Lap belt across the belly, strap between the breasts","Lap belt low beneath the belly, strap behind her back","Lap belt across the belly, strap over the arm"],"ci":0,"r":"Both parts matter: the lap belt low beneath the belly and the strap between the breasts."},{"id":"q-5b-094","f":"s8b-008","topic":"Child passengers","stem":"Why must a child stay out of a front seat that has a passenger airbag?","o":["Front seat belts are built too wide for a small child","The front seat has no anchor points for a child seat","A passenger airbag can seriously injure a child","The airbag fires too late to protect a small child"],"ci":2,"r":"A passenger airbag inflates with great force and can seriously injure a child."},{"id":"q-5b-095","f":"s8b-008","topic":"Child passengers","stem":"You drive a pickup with a passenger airbag. A 5-year-old begs to sit up front and promises to sit still. What do you do?","o":["Let her sit up front once she is buckled","Seat her in the back seat instead","Let her sit up front in a booster seat instead","Seat her in the back seat, belted loosely so she can lean forward"],"ci":1,"r":"A child must not sit in a front seat with a passenger airbag, however well belted."},{"id":"q-5b-096","f":"s8b-008","topic":"Child passengers","stem":"The 10-inch airbag advice is for drivers. Why can it not be used to seat a child up front?","o":["Children must sit 20 inches from the dashboard instead","A child may sit there if the seat belt is pulled tight enough","It covers drivers older than 16, so a child is not affected","No child belongs in that seat; distance does not fix it"],"ci":3,"r":"A child stays out of a front seat with a passenger airbag; no distance makes it safe."},{"id":"q-5b-106","f":"s8c-007","topic":"Phones and screens while driving","stem":"How may an adult driver use a cell phone?","o":["Held in your hand, as long as the speaker is switched on","Resting on the passenger seat, tapped when it rings","Only in hands-free mode, such as a dock or voice system","Held in your hand, but only while stopped at a red light"],"ci":2,"r":"Adults may use a phone only in hands-free mode, only when needed, and without blocking the view of the road."},{"id":"q-5b-107","f":"s8c-007","topic":"Phones and screens while driving","stem":"Your phone rings while you drive and it sits in a dashboard dock. Which choice follows the law?","o":["Pick it up briefly and say you will call back later","Answer through the car's hands-free system, or let it ring","Hold it against your chest and answer using the speaker button","Tilt it in your lap and tap the screen to answer"],"ci":1,"r":"Adults may talk only hands-free; letting it ring is also fine."},{"id":"q-5b-108","f":"s8c-007","topic":"Phones and screens while driving","stem":"Which of these counts as hands-free use?","o":["Phone held in your hand and used on speaker","Phone on the seat beside you, answered with one quick tap of the screen","Phone cradled between your shoulder and your ear","Phone in a dock, called through the car's voice system"],"ci":3,"r":"Hands-free means a phone you do not hold, used by voice through a dock or car system."},{"id":"q-5b-109","f":"s8c-008","topic":"Phones and screens while driving","stem":"What is the cell phone rule for a driver under 18?","o":["Hands-free use is allowed, but handheld use is not","No use at all, except a 911 call in an emergency","Only texting is banned; talking on the phone is allowed","Use is allowed whenever a licensed parent rides along"],"ci":1,"r":"Drivers under 18 may not use a phone at all while driving, apart from a 911 call in an emergency."},{"id":"q-5b-110","f":"s8c-008","topic":"Phones and screens while driving","stem":"A 17-year-old driver sees a serious crash ahead with injured people. May the teen use a phone?","o":["No use at all, even for 911","Text a friend to call for help","Call a parent hands-free, which is allowed","Call 911; that is the one emergency exception"],"ci":3,"r":"The only exception for a driver under 18 is a call to 911 in an emergency."},{"id":"q-5b-111","f":"s8c-008","topic":"Phones and screens while driving","stem":"A 17-year-old and a 35-year-old both use a hands-free earpiece while driving. Which statement is right?","o":["The 35-year-old is allowed; the 17-year-old is not","Both are allowed, since the phone is hands-free","Neither is allowed, since all drivers are banned","The 17-year-old is allowed; the 35-year-old is not"],"ci":0,"r":"Adults may use hands-free; drivers under 18 may not, even hands-free."},{"id":"q-5b-112","f":"s8c-009","topic":"Phones and screens while driving","stem":"Which of these is illegal for every driver, whatever the age?","o":["Listening to spoken directions from a map app","Using a hands-free voice call","Sending, reading or answering text messages","Changing the radio station"],"ci":2,"r":"Sending, reading or answering texts or emails while driving is illegal for all drivers."},{"id":"q-5b-113","f":"s8c-009","topic":"Phones and screens while driving","stem":"Your phone buzzes with a text while you drive on the highway. What do you do?","o":["Glance at it quickly if the road is straight","Read it but do not reply until you stop","Wait until you have safely stopped, then read it","Type a short reply at a stretch of light traffic"],"ci":2,"r":"Do not send, read or answer texts while driving; wait until you are safely stopped."},{"id":"q-5b-114","f":"s8c-009","topic":"Phones and screens while driving","stem":"In slow, stop-and-go traffic, which statement about texts is right?","o":["Reading and sending by hand is still illegal","Sending is allowed under 5 mph","Reading is allowed, but sending is not","Texts are allowed for drivers over 25"],"ci":0,"r":"The ban on texting by hand applies to every driver at every speed."},{"id":"q-5b-118","f":"s9_p11_run2-017","topic":"Fatigue, medicines and drugs","stem":"Drowsy driving hurts reaction time and judgment in a way most like which condition?","o":["Driving with a cold","Driving while hungry","Driving after drinking alcohol","Driving with the sun in your eyes"],"ci":2,"r":"Fatigue slows reactions and clouds judgment much as alcohol does."},{"id":"q-5b-119","f":"s9_p11_run2-017","topic":"Fatigue, medicines and drugs","stem":"You have been awake for 20 hours and plan to drive home. You think you are safe because you had no alcohol. What is a better way to see it?","o":["Tiredness only affects your speed, not your judgment","Your reactions and judgment may be as poor as a drinker's","You are fine if you feel alert","The risk is only at night"],"ci":1,"r":"Fatigue can impair reaction time and judgment as alcohol does, whether or not you feel alert."},{"id":"q-5b-120","f":"s9_p11_run2-017","topic":"Fatigue, medicines and drugs","stem":"One driver had two drinks. Another has been awake for 24 hours. Which statement fits?","o":["Only the drinker's reactions and judgment are affected","Only the sleepy driver's reactions and judgment are affected","Both are affected, but only the drinker needs to stop","Both may have slow reactions and poor judgment"],"ci":3,"r":"Alcohol and severe fatigue both slow reaction time and weaken judgment."},{"id":"q-5b-121","f":"s9_p11_run2-018","topic":"Fatigue, medicines and drugs","stem":"What should a dangerously tired driver do?","o":["Open the window and turn up the radio","Pull over somewhere safe and rest","Speed up to arrive sooner","Stop for coffee at the next exit and then drive on"],"ci":1,"r":"A dangerously fatigued driver should pull over and rest before driving on."},{"id":"q-5b-122","f":"s9_p11_run2-018","topic":"Fatigue, medicines and drugs","stem":"At 2 a.m. on a highway your eyelids keep drooping and the next town is 30 miles away. What do you do?","o":["Crank the radio up loud and keep going to town","Speed up to reach the next town sooner","Pull over for a minute, splash your face, then drive on","Take the next safe exit or rest area and rest"],"ci":3,"r":"When you are dangerously tired, stop at a safe place and rest."},{"id":"q-5b-123","f":"s9_p11_run2-018","topic":"Fatigue, medicines and drugs","stem":"Which fix works for both a drunk driver and a dangerously tired driver?","o":["Not driving until the impairment has passed","Opening the windows for cold fresh air","Slowing down a little and driving on carefully","Drinking several cups of strong black coffee"],"ci":0,"r":"Neither condition is cured by a trick; the safe answer is to stop driving until you are fit."},{"id":"q-6-001","f":"glossary-002","topic":"Blood alcohol limits (BAC)","stem":"What does your blood alcohol concentration (BAC) measure?","o":["How many drinks your liver has already cleared each hour","Grams of alcohol in every 100 milliliters of your urine","How strong the drinks you had were compared with beer","Grams of alcohol in every 100 milliliters of your blood"],"ci":3,"r":"BAC is the amount of alcohol in 100 milliliters of blood, written as a percent."},{"id":"q-6-002","f":"glossary-002","topic":"Blood alcohol limits (BAC)","stem":"A test report for another driver says 0.06% BAC. What does that number say about her blood?","o":["It holds 0.06 gram of alcohol in every 100 milliliters","Six percent of her blood is made up of pure alcohol","She has had six drinks in the past hour, one for each 0.01%","It holds 0.06 gram of alcohol in every liter of her blood"],"ci":0,"r":"A BAC of 0.06% means 0.06 gram of alcohol per 100 milliliters of blood."},{"id":"q-6-003","f":"glossary-002","topic":"Blood alcohol limits (BAC)","stem":"A friend says BAC is just a count of how many drinks you have had. Which reply matches the definition?","o":["Yes; each drink adds a fixed 0.02% to your BAC","No; it is the amount of alcohol in your blood, measured per 100 milliliters","No; it is the amount of alcohol in your urine, measured per 100 milliliters","Yes, but only the drinks you had in the past hour"],"ci":1,"r":"BAC is a concentration of alcohol in the blood, not a count of drinks."},{"id":"q-6-004","f":"s9-001","topic":"Blood alcohol limits (BAC)","stem":"At what BAC does driving become illegal for a driver aged 21 or older?","o":["0.10% or higher","0.04% or higher","0.08% or higher","0.01% or higher"],"ci":2,"r":"The adult limit is 0.08% BAC."},{"id":"q-6-005","f":"s9-001","topic":"Blood alcohol limits (BAC)","stem":"You are 34 and drive your own car home from dinner. A breath test would read 0.09%. What is the legal position?","o":["You are over the limit, but only if a blood test confirms it; a breath reading does not count","You are over the adult limit, so driving is illegal even if you feel fine","You are legal, because the adult limit in California is 0.10%","You may drive if you keep to quiet streets and stay under 35 mph"],"ci":1,"r":"At 0.09% an adult driver is over the 0.08% limit, whether or not driving looks normal."},{"id":"q-6-006","f":"s9-001","topic":"Blood alcohol limits (BAC)","stem":"Which pairing of age group and BAC limit is correct?","o":["Age 21 and older: 0.04%; under 21: 0.01%","Age 21 and older: 0.08%; under 21: 0.01%","Age 21 and older: 0.08%; under 21: 0.04%","Age 21 and older: 0.10%; under 21: 0.08%"],"ci":1,"r":"Adults 21 and older face 0.08% and drivers under 21 face 0.01%."},{"id":"q-6-007","f":"s9-002","topic":"Blood alcohol limits (BAC)","stem":"For a driver under 21, driving becomes illegal at what BAC?","o":["0.04% or higher","0.05% or higher","0.08% or higher","0.01% or higher"],"ci":3,"r":"Drivers under 21 may not drive at 0.01% BAC or higher."},{"id":"q-6-008","f":"s9-002","topic":"Blood alcohol limits (BAC)","stem":"You are 19 and had one small drink an hour ago. A roadside breath screening shows 0.02%. What is true?","o":["You are over the limit, but a first reading that low is treated as a warning","You are under the limit, because 0.08% is the limit for drivers with a regular license","You are under the limit, because a drink an hour ago has left the blood by now","You are over the limit for your age, even though you are below 0.08%"],"ci":3,"r":"A driver under 21 is over the limit at 0.01% or higher, so 0.02% is illegal."},{"id":"q-6-009","f":"s9-002","topic":"Blood alcohol limits (BAC)","stem":"Which of these drivers is over the BAC limit that applies to them?","o":["A 19-year-old driving a car at 0.02%","A 35-year-old driving a car at 0.07%","A 45-year-old with a commercial license driving a truck at 0.03%","A 28-year-old driving a car at 0.05%"],"ci":0,"r":"The 19-year-old faces 0.01% and is at 0.02%; the others are all under their own limits."},{"id":"q-6-010","f":"s9-003","topic":"Blood alcohol limits (BAC)","stem":"A driver of a vehicle that needs a commercial license is over the limit at what BAC?","o":["0.08% or higher","0.01% or higher","0.04% or higher","0.02% or higher"],"ci":2,"r":"The commercial limit is 0.04% BAC."},{"id":"q-6-011","f":"s9-003","topic":"Blood alcohol limits (BAC)","stem":"You hold a commercial license and drive a loaded delivery truck. A breath test reads 0.05%. What does the law say?","o":["You are under the limit, since the 0.08% limit applies to every driver of a truck","You are under the limit until 0.10%, which is the commercial figure","You are over the limit for a commercial vehicle even though you are under 0.08%","You are over the limit only if the truck carries a hazardous load"],"ci":2,"r":"A commercial driver is over the limit at 0.04%, so 0.05% is illegal."},{"id":"q-6-012","f":"s9-003","topic":"Blood alcohol limits (BAC)","stem":"Which driver is held to a 0.04% limit instead of 0.08%?","o":["A 20-year-old driving a family car home from a night class","A 60-year-old driving his personal pickup truck to a lake","A 50-year-old on DUI probation driving a car to work","A 45-year-old driving a truck that needs a commercial license"],"ci":3,"r":"A vehicle that needs a commercial license brings the 0.04% limit."},{"id":"q-6-013","f":"s9-004","topic":"Blood alcohol limits (BAC)","stem":"A driver of any age who is on DUI probation is over the limit at what BAC?","o":["0.04% or higher","0.08% or higher","0.01% or higher","0.02% or higher"],"ci":2,"r":"Anyone on DUI probation faces a 0.01% limit."},{"id":"q-6-014","f":"s9-004","topic":"Blood alcohol limits (BAC)","stem":"You are 40 and on probation after a DUI. You drive home after one drink and would blow 0.03%. How does the law see it?","o":["You are over the limit, but only if the officer also saw bad driving","Probation lowers the limit for people under 21, not for you","The adult 0.08% limit still applies to you","You are over the limit that applies to anyone on DUI probation"],"ci":3,"r":"Drivers on DUI probation may not drive at 0.01% or higher, at any age."},{"id":"q-6-015","f":"s9-004","topic":"Blood alcohol limits (BAC)","stem":"Which two drivers share the same BAC limit?","o":["A 19-year-old driver and a 55-year-old on DUI probation","A 19-year-old driver and a 25-year-old ordinary driver","A 55-year-old on DUI probation and a commercial truck driver","A commercial truck driver and a 30-year-old ordinary driver"],"ci":0,"r":"Drivers under 21 and drivers on DUI probation both face 0.01%."},{"id":"q-6-016","f":"s9-005","topic":"Blood alcohol limits (BAC)","stem":"When a passenger for hire rides in the car, the driver is over the limit at what BAC?","o":["0.08% or higher","0.04% or higher","0.01% or higher","0.06% or higher"],"ci":1,"r":"A driver with a paying passenger faces a 0.04% limit."},{"id":"q-6-017","f":"s9-005","topic":"Blood alcohol limits (BAC)","stem":"You drive a taxi with a fare in the back. You had two beers earlier and a test would read 0.05%. What applies?","o":["You are over the limit that applies to drivers carrying a paying passenger","You are legal; 0.08% applies to adults at the wheel of any car","You are legal; the taxi company, not the driver, carries the limit","You are over the limit, but the lower figure starts once the fare is paid"],"ci":0,"r":"With a paying passenger the limit is 0.04%, so 0.05% is illegal."},{"id":"q-6-018","f":"s9-005","topic":"Blood alcohol limits (BAC)","stem":"Each of these drivers has a BAC of 0.05%. Which one is over the limit that applies?","o":["A 30-year-old driving home alone in a personal car","A 40-year-old driving a friend who is not paying","A 33-year-old driving a paying passenger across town","A 22-year-old driving two friends to the beach"],"ci":2,"r":"A passenger for hire brings the 0.04% limit, so 0.05% is over it."},{"id":"q-6-019","f":"s9-006","topic":"DUI penalties and consequences","stem":"By driving in California, what have you agreed to?","o":["A breath, blood or urine test, whenever an officer suspects DUI","Field sobriety exercises, though chemical tests are your choice","A breath or blood test, whenever you are in a collision","A blood draw, though breath and urine tests need your permission"],"ci":0,"r":"Every driver is deemed to consent to chemical testing when DUI is suspected."},{"id":"q-6-020","f":"s9-006","topic":"DUI penalties and consequences","stem":"You are arrested on suspicion of DUI and the officer asks you to take a breath test. What is your position?","o":["You agreed to testing by driving, but only if you were also in a collision","You may decline, and the worst result is that the officer collects a blood sample instead","You may decline until a lawyer is present, with no penalty","You agreed to testing by driving, so refusing brings a license suspension"],"ci":3,"r":"Driving implies consent to a chemical test, and a refusal brings a license suspension."},{"id":"q-6-022","f":"s9-007","topic":"DUI penalties and consequences","stem":"What happens to your license if you refuse a chemical test after a DUI arrest?","o":["Nothing happens unless you are later convicted in court","The DMV suspends it for six months, then returns it","The DMV suspends it for 30 days, the length of a temporary permit","The DMV suspends it for one year, starting from the refusal"],"ci":3,"r":"A refusal brings a one-year DMV suspension of the driving privilege."},{"id":"q-6-023","f":"s9-007","topic":"DUI penalties and consequences","stem":"You are arrested for DUI and expect to be found not guilty. At the station you think about refusing the breath test. What is true?","o":["The DMV suspends your privilege for 30 days, then returns it if the court acquits you","Refusing costs you nothing if the court later finds you not guilty","Refusing is safer, because the DMV cannot act without a BAC result","The DMV suspends your privilege for one year because you refused"],"ci":3,"r":"A refusal alone brings a one-year suspension."},{"id":"q-6-024","f":"s9-007","topic":"DUI penalties and consequences","stem":"A refusal sets two numbers in motion. Which pairing is right?","o":["A one-year suspension; 30 days to ask for a hearing","A 30-day suspension; 10 days to ask for a hearing","A six-month suspension; 24 hours to ask for a hearing","A one-year suspension; 10 days to ask for a hearing"],"ci":3,"r":"Refusal brings a one-year suspension, and a hearing must be requested within 10 days of the notice."},{"id":"q-6-025","f":"s9_p11_run2-013","topic":"DUI penalties and consequences","stem":"What is the shortest DMV suspension a driver faces after refusing a chemical test following a DUI arrest?","o":["90 days","Six months","Two years","One year"],"ci":3,"r":"Refusing a chemical test carries a one-year minimum suspension."},{"id":"q-6-026","f":"s9_p11_run2-013","topic":"DUI penalties and consequences","stem":"Sam refused a chemical test last month. His boss asks when he can drive for work again at the earliest. What is true?","o":["Not before the 30-day temporary permit ends","Not before the 10-day hearing window closes","Not before six months pass and he finishes a DUI class","Not before a year has passed since the suspension began"],"ci":3,"r":"A refusal suspension lasts at least one year."},{"id":"q-6-027","f":"s9_p11_run2-013","topic":"DUI penalties and consequences","stem":"People mix up two DUI numbers. Which pairing is right?","o":["Refusing a test: a suspension of one year; a DUI conviction: stays on record 10 years","Refusing a test: a suspension of 10 years; a DUI conviction: stays on record 1 year","Refusing a test: a suspension of 30 days; a DUI conviction: stays on record 3 years","Refusing a test: a suspension of six months; a DUI conviction: stays on record 5 years"],"ci":0,"r":"A refusal suspension is one year, and a DUI conviction stays on the record for 10 years."},{"id":"q-6-028","f":"s9-008","topic":"DUI penalties and consequences","stem":"After a DUI arrest, what may the officer give you when taking your license?","o":["A temporary permit good for 30 days","A temporary permit good for 10 days","A restricted license for work trips for one year","A receipt only, with no right to drive until the hearing"],"ci":0,"r":"An officer may take the license and issue a temporary 30-day permit."},{"id":"q-6-029","f":"s9-008","topic":"DUI penalties and consequences","stem":"You are arrested for DUI and released. The officer takes your plastic license and hands you a paper. What can you do with it?","o":["Nothing; you may not drive at all until the hearing","Drive on it for a year, matching the refusal suspension","Drive on it for up to 30 days while the DMV process runs","Drive on it until you pay the court fine"],"ci":2,"r":"The officer may issue a temporary permit that lasts 30 days."},{"id":"q-6-030","f":"s9-008","topic":"DUI penalties and consequences","stem":"A DUI arrest starts two clocks. Which pairing is right?","o":["The temporary permit lasts 10 days; the hearing must be requested within 30 days","The temporary permit lasts 30 days; the hearing must be requested within 10 days","The temporary permit lasts 30 days; the hearing must be requested within 24 hours","The temporary permit lasts 24 hours; the hearing must be requested within 10 days"],"ci":1,"r":"The permit is good for 30 days, and the hearing request deadline is 10 days."},{"id":"q-6-031","f":"s9-009","topic":"DUI penalties and consequences","stem":"To contest a DUI suspension at a DMV hearing, how soon must you ask?","o":["Within 30 days of receiving the notice","Within 10 days of receiving the notice","Within 24 hours of the arrest","Within 60 days of the arrest"],"ci":1,"r":"A hearing request must be made within 10 days of receiving the suspension notice."},{"id":"q-6-032","f":"s9-009","topic":"DUI penalties and consequences","stem":"You received a DUI suspension notice on October 3. You want a hearing. By when must you ask?","o":["By October 23, twenty days after the notice arrived","By October 4, one day after the notice arrived","By November 3, one month after the notice arrived","By October 13, ten days after the notice arrived"],"ci":3,"r":"The request is due within 10 days of receiving the notice."},{"id":"q-6-033","f":"s9-009","topic":"DUI penalties and consequences","stem":"Which pair of deadlines is correct?","o":["DUI hearing request: 10 days; injury report to police: 24 hours","DUI hearing request: 24 hours; injury report to police: 10 days","DUI hearing request: 30 days; injury report to police: 10 days","DUI hearing request: 10 days; injury report to police: 30 days"],"ci":0,"r":"A hearing must be requested within 10 days, and an injury collision must be reported to law enforcement within 24 hours."},{"id":"q-6-034","f":"s9-010","topic":"DUI penalties and consequences","stem":"How long does a DUI conviction stay on your driving record?","o":["Three years","Five years","Ten years","One year"],"ci":2,"r":"A DUI conviction remains on the driver record for 10 years."},{"id":"q-6-035","f":"s9-010","topic":"DUI penalties and consequences","stem":"Priya was convicted of DUI at 25. At 32 she applies for a driving job. How does her driving record stand?","o":["The conviction is still on it, with 8 years left of its 10","The conviction is still on it, with 3 years left of its 10","The conviction dropped off after five years, and it is clear now","The conviction dropped off when she finished the DUI program"],"ci":1,"r":"At seven years the conviction is still inside the 10-year period, with three years left."},{"id":"q-6-036","f":"s9-010","topic":"DUI penalties and consequences","stem":"A friend says a DUI conviction 'drops off' as soon as the suspension ends. What is right?","o":["Yes; the record clears itself on the day the license is fully reinstated by the DMV","No; the record keeps the conviction for 10 years even after the suspension ends","Yes; it clears once the DUI program is complete","No; it stays three years, regardless of the suspension"],"ci":1,"r":"The suspension and the record are separate; the conviction stays 10 years."},{"id":"q-6-037","f":"s9-011","topic":"Minors and alcohol in vehicles","stem":"A driver under 21 who is found with alcohol in the vehicle may lose the car for how long?","o":["Up to 10 days","Up to 90 days","Up to one year","Up to 30 days"],"ci":3,"r":"A minor's vehicle may be impounded for up to 30 days when alcohol is found in it."},{"id":"q-6-038","f":"s9-011","topic":"Minors and alcohol in vehicles","stem":"A 17-year-old is stopped with a six-pack in the back seat. No adult is in the car. What may happen to the car?","o":["It may be impounded for up to 30 days, whether or not she drank any","It is held for up to 3 days until a parent collects it","It is towed if she also tests above 0.01%","Nothing happens to the car, since she has not drunk any of it"],"ci":0,"r":"A vehicle used in this violation by a driver under 21 may be impounded for up to 30 days."},{"id":"q-6-039","f":"s9-011","topic":"Minors and alcohol in vehicles","stem":"Which of these penalties is capped at 30 days?","o":["A suspension for refusing a chemical test","A jail term after a first DUI conviction","A minor's car held after alcohol is found in it","The suspension after an uninsured collision"],"ci":2,"r":"The impound of a minor's car with alcohol in it lasts up to 30 days."},{"id":"q-6-040","f":"s9-012","topic":"DUI penalties and consequences","stem":"Which set of consequences can follow a DUI conviction?","o":["Jail time and civil liability for harm caused, but the car comes back with no fees","Jail time, impound fees and loss of the car's registration for a year","Jail time, impound fees and civil liability for any harm caused","Jail time, impound fees and a mandatory 10-year license revocation"],"ci":2,"r":"A DUI conviction may bring jail, impound fees and civil liability for injuries or deaths."},{"id":"q-6-041","f":"s9-012","topic":"DUI penalties and consequences","stem":"Rob causes a crash at 0.10% BAC and a passenger in the other car is hurt. Besides losing his license, what could he face?","o":["Jail and being sued for the injuries, and also a lifetime driving ban","Jail and car storage costs, and also being sued for the injuries","Jail and car storage costs, and no lawsuit because the other person survived","Car storage costs and being sued for the injuries, but no jail for a first offense"],"ci":1,"r":"A DUI conviction can mean jail, impound with fees and civil liability for injuries."},{"id":"q-6-042","f":"s9-012","topic":"DUI penalties and consequences","stem":"A friend says a DUI conviction only brings penalties from the state. What is missing?","o":["The injured person can sue after a felony conviction","The injured person can also sue the driver for the harm caused","The state can also bill the driver for the other person's medical costs","Nothing is missing; the court's fine covers the cost of harming someone"],"ci":1,"r":"Civil liability for injuries or deaths is a separate claim by the injured person."},{"id":"q-6-043","f":"s9-013","topic":"DUI penalties and consequences","stem":"After a drunk-driving suspension, what must be finished before the license can be reinstated?","o":["An approved education or treatment program for alcohol offenders","A defensive-driving course at a traffic school","A written exam and a behind-the-wheel test only","A set number of community service hours ordered by the DMV"],"ci":0,"r":"Reinstatement is conditioned on finishing an approved DUI program."},{"id":"q-6-044","f":"s9-013","topic":"DUI penalties and consequences","stem":"Dana's DUI suspension has ended and she paid the fees. What else must happen before the DMV gives her license back?","o":["Nothing else; the end of the suspension restores it automatically","She must wait another 30 days and pass a vision test","She must retake the written knowledge test","She must show proof she finished a licensed DUI program"],"ci":3,"r":"A DUI program and proof of financial responsibility come before reinstatement."},{"id":"q-6-045","f":"s9-013","topic":"DUI penalties and consequences","stem":"After a drunk-driving conviction, a driver finished a traffic school course. What must he still show to get the license back?","o":["Proof that he did 40 hours of community service for the court","Proof that he finished a program licensed for alcohol offenders","Proof that the court fine was paid in full to the county","Proof of a clean driving record for the whole past year"],"ci":1,"r":"Only an approved DUI program meets the reinstatement condition; traffic school does not."},{"id":"q-6-046","f":"s9_p11_run2-001","topic":"Fatigue, medicines and drugs","stem":"What does California law say about driving while impaired by drugs?","o":["It is illegal for prescribed drugs, while over-the-counter ones are always allowed","It is illegal for street drugs, while legal medicine is always allowed","It is illegal for any drug, including prescribed and over-the-counter ones","It is illegal for any drug, with a penalty that starts at a set blood level"],"ci":2,"r":"Driving under the influence of any drug is unlawful, including medicines."},{"id":"q-6-047","f":"s9_p11_run2-001","topic":"Fatigue, medicines and drugs","stem":"Your doctor prescribes a pill whose label warns it may cause drowsiness. Before driving after taking it, what should you do?","o":["Drive after a cup of coffee to cancel the drowsiness","Skip driving if you also drank alcohol, and otherwise drive normally","Drive on short trips, which a prescribed pill allows","Check how it affects you, and skip driving if you feel drowsy"],"ci":3,"r":"Driving while impaired by any drug, including a prescribed one, is illegal."},{"id":"q-6-048","f":"s9_p11_run2-001","topic":"Fatigue, medicines and drugs","stem":"Alcohol has a BAC number. What is the rule for drug impairment?","o":["The limit is 0.08% of the drug in the blood, the same as alcohol","There is no safe number; being under the influence of any drug is enough","The drug must be on a DMV list of banned substances","It is illegal only when the drug is mixed with alcohol"],"ci":1,"r":"The law bars driving while under the influence of any drug."},{"id":"q-6-049","f":"s9_p11_run2-006","topic":"DUI penalties and consequences","stem":"What does an ignition interlock device do?","o":["It records the driver's BAC for the court's file, but still lets the car start","It stops the engine starting when it detects alcohol on the driver's breath","It limits the car to a slow speed after the driver has been drinking","It sends the officer an alert whenever the driver starts the car"],"ci":1,"r":"An interlock blocks the car from starting when it senses alcohol on the breath."},{"id":"q-6-050","f":"s9_p11_run2-006","topic":"DUI penalties and consequences","stem":"A court ordered a device on Leo's car after his DUI. It must clear before the engine will start. What is it checking?","o":["Whether his blood alcohol was over 0.08% at the time of his arrest","Whether there is alcohol on his breath right now","Whether his SR-22 insurance filing is still in effect","Whether he has finished his DUI program"],"ci":1,"r":"An interlock blocks the engine when it detects alcohol on the driver's breath."},{"id":"q-6-051","f":"s9_p11_run2-006","topic":"DUI penalties and consequences","stem":"Which item physically blocks a car from starting after the driver has been drinking?","o":["A breathalyzer app on the driver's phone","A court-ordered GPS ankle monitor","A Bluetooth alcohol sensor that texts a family member","An ignition interlock device"],"ci":3,"r":"Only the interlock device physically blocks the start."},{"id":"q-6-052","f":"s9_p11_run2-007","topic":"DUI penalties and consequences","stem":"After a DUI conviction, what device might a court require on your car?","o":["An ignition interlock device","A speed governor","A dash camera linked to the court","A GPS tracker with a home curfew"],"ci":0,"r":"An ignition interlock device may be required after a DUI conviction."},{"id":"q-6-053","f":"s9_p11_run2-007","topic":"DUI penalties and consequences","stem":"Maria has just been convicted of DUI and asks the clerk about her car. What may she be required to do?","o":["Install a tamper seal on the license plate that the DMV checks each year","Install an ignition interlock device that tests her breath before the car starts","Install a speed limiter that keeps the car below 45 miles per hour","Install a GPS tracker that reports her trips to the court each week"],"ci":1,"r":"A court may require an ignition interlock device after a DUI conviction."},{"id":"q-6-054","f":"s9_p11_run2-007","topic":"DUI penalties and consequences","stem":"A driver says: 'An interlock is only for drivers who refused the test.' What is wrong with that?","o":["An interlock may be required after a refusal, but a conviction alone does not bring one","An interlock is required after every DUI conviction, whether or not the driver refused","An interlock may also be required after a DUI conviction, with or without a refusal","Nothing is wrong; the penalty for a refusal is the interlock, not a suspension"],"ci":2,"r":"An interlock may be required after a DUI conviction, not only after a refusal."},{"id":"q-6-058","f":"s9_p11_run2-009","topic":"DUI penalties and consequences","stem":"A DUI conviction requires the driver to file what with the DMV?","o":["An SR-22 (or SR-1P) proof of financial responsibility","An SR-1 form, the same one used to report a collision","A letter from the court confirming the fine was paid","A medical report that the driver is fit to drive"],"ci":0,"r":"A DUI conviction requires filing proof of financial responsibility, such as an SR-22."},{"id":"q-6-059","f":"s9_p11_run2-009","topic":"DUI penalties and consequences","stem":"After a DUI conviction, Jo bought a policy and keeps the card in her glovebox. Is that enough for the DMV?","o":["Yes; carrying the card satisfies the DMV, so nothing is filed","No; only the court needs the proof, not the DMV","Yes; a copy of the policy mailed to the court satisfies the DMV","No; an SR-22 or SR-1P proof must be filed with the DMV itself"],"ci":3,"r":"A DUI conviction requires proof of financial responsibility to be filed with the DMV."},{"id":"q-6-060","f":"s9_p11_run2-009","topic":"DUI penalties and consequences","stem":"A friend says a DUI conviction needs no special filing with the DMV once the fine is paid. What is wrong with that?","o":["The DMV requires a copy of the court order, filed as an SR-22 or SR-1P","The DMV requires proof of financial responsibility, filed as an SR-22 or SR-1P","The DMV requires proof of financial responsibility, filed as an SR-1 within 10 days","The DMV requires proof of a finished treatment program, filed as an SR-22 or SR-1P"],"ci":1,"r":"A DUI conviction requires filing proof of financial responsibility, an SR-22 or SR-1P, with the DMV."},{"id":"q-6-061","f":"s9_p11_run2-010","topic":"DUI penalties and consequences","stem":"For a first DUI conviction, what is the longest jail term a court may impose?","o":["Up to 30 days","Up to one year","Up to three years","Up to six months"],"ci":3,"r":"A first DUI conviction may bring up to six months in jail."},{"id":"q-6-062","f":"s9_p11_run2-010","topic":"DUI penalties and consequences","stem":"A first-time DUI defendant asks her lawyer what the longest jail term could be. What does he say?","o":["A cap of ten days, matching the hearing deadline","A cap of six months in county jail, even for a first offense","No jail at all is possible on a first offense","A cap of four years, the length of a long license suspension"],"ci":1,"r":"A first DUI conviction can carry up to six months in county jail."},{"id":"q-6-063","f":"s9_p11_run2-010","topic":"DUI penalties and consequences","stem":"A first DUI conviction can bring a jail sentence. Which pair gives the lowest and highest term?","o":["At least 30 days and at most six months","At least 96 hours and at most six months","At least 96 hours and at most one year","No minimum and at most 30 days"],"ci":1,"r":"A first violation carries not less than 96 hours and not more than six months in county jail."},{"id":"q-6-064","f":"s9_p11_run2-011","topic":"DUI penalties and consequences","stem":"What costs does an impound after a DUI arrest carry until the car is released?","o":["Daily storage and administrative fees","A storage fee that the state pays","A one-time towing fee","A single fine paid to the DMV"],"ci":0,"r":"An impounded car collects daily storage and administrative fees until it is released."},{"id":"q-6-065","f":"s9_p11_run2-011","topic":"DUI penalties and consequences","stem":"Tom's car is towed after his DUI arrest. He picks it up a week later. What should he expect on the bill?","o":["Towing and storage fees, billed after a court finds him guilty","Daily storage and administrative fees, charged until the car is released","Storage fees for the first day, with an evidence hold after that","A single towing fee, with storage free for the first week"],"ci":1,"r":"Daily storage and administrative fees build up until the car is released."},{"id":"q-6-066","f":"s9_p11_run2-011","topic":"DUI penalties and consequences","stem":"After a DUI arrest, which charge builds up day by day until the matter is settled?","o":["The court adds a daily penalty to the DUI fine","Storage and administrative fees on the impounded car","The DMV charges a daily fee to keep the suspended license on file","A hearing request costs more for each day it stays open"],"ci":1,"r":"Only the impound storage and administrative fees run by the day."},{"id":"q-6-067","f":"s9_p11_run2-012","topic":"Minors and alcohol in vehicles","stem":"A teenager is sober but drives with alcohol in the car. Which penalty can still apply?","o":["The car can be impounded, even though she is not impaired","She can be jailed for up to six months, even though she is not impaired","She can be given a warning and keep the car, since she is not impaired","She can be charged with DUI, even though she is not impaired"],"ci":0,"r":"Minors who transport alcohol can face impound even when not impaired."},{"id":"q-6-068","f":"s9_p11_run2-012","topic":"Minors and alcohol in vehicles","stem":"A 17-year-old drives friends to a party with a case of beer in the trunk. He has had nothing to drink. An officer finds the beer. What can happen?","o":["Nothing, as long as the cans stay sealed in the trunk","He is arrested for DUI, since carrying alcohol equals drunk driving","The car may be impounded even though he is not impaired","The beer is taken, but the car cannot be touched"],"ci":2,"r":"A minor who transports alcohol can have the vehicle impounded without any impairment."},{"id":"q-6-069","f":"s9_p11_run2-012","topic":"Minors and alcohol in vehicles","stem":"Which statement separates the impound rule for minors from a DUI arrest?","o":["A minor's car can be impounded for carrying alcohol even with a reading of zero","A minor's car can be impounded once the driver tests above 0.01%","A minor's car can be impounded after a second alcohol offense","A minor's car can be impounded if the minor refuses to hand over the alcohol"],"ci":0,"r":"Carrying alcohol alone can bring impound for a minor, with no BAC needed."},{"id":"q-6-070","f":"s9_p11_run2-016","topic":"Designated driver","stem":"What makes someone a true designated driver?","o":["They drink the least of the group","They stop drinking an hour before leaving","They stay completely sober for the whole outing","They stay completely sober until the last hour, then may have one drink"],"ci":2,"r":"A designated driver stays fully sober so they can drive others safely."},{"id":"q-6-071","f":"s9_p11_run2-016","topic":"Designated driver","stem":"You are driving four friends home after dinner. They offer you a glass of wine, saying one glass keeps you under 0.08%. What do you do?","o":["Decline the wine but have one light beer with the meal","Accept one glass but hand the keys to a friend who has had fewer drinks","Decline all alcohol for the whole evening","Accept it only if you eat a full meal with it"],"ci":2,"r":"The designated driver stays completely sober, so no alcohol at all."},{"id":"q-6-072","f":"s9_p11_run2-016","topic":"Designated driver","stem":"Which friend is the best choice to drive the group home?","o":["Sam, who has had only soda and water all night","Lee, who had one beer at 6 pm and has eaten since","Kim, who had a drink, then switched to coffee","Raj, who feels fine and says he had two light drinks"],"ci":0,"r":"The best driver is the one who has had no alcohol at all."},{"id":"q-6-073","f":"s10-001","topic":"Insurance minimums and proof","stem":"What must every California driver be able to show when asked?","o":["Proof of financial responsibility, like liability insurance","Proof you own the car, such as the vehicle title papers","Proof of health insurance for yourself and your passengers","Proof of collision coverage that pays to repair your own car"],"ci":0,"r":"Every driver must provide evidence of financial responsibility, such as liability insurance, on demand."},{"id":"q-6-074","f":"s10-001","topic":"Insurance minimums and proof","stem":"At a traffic stop, an officer asks you to show you can pay for harm you might cause. Which of these answers the request?","o":["The car's registration card, which shows the owner's insurer","A health insurance card for you and your passengers","A policy that lapsed last month, which you plan to renew","Proof of liability coverage that is in effect right now"],"ci":3,"r":"The proof must show coverage in effect at the time it is demanded."},{"id":"q-6-075","f":"s10-001","topic":"Insurance minimums and proof","stem":"Which kind of coverage does the law require a driver to prove?","o":["Collision coverage, which pays to fix your own car","Comprehensive coverage, which pays for theft and storm damage","Liability coverage, which pays for harm you cause to others","Medical payments coverage for your own injuries"],"ci":2,"r":"The law requires proof of financial responsibility for the harm you may cause others."},{"id":"q-6-076","f":"s10-002","topic":"Insurance minimums and proof","stem":"What is the minimum liability coverage for injury or death of one person in an accident?","o":["$15,000","$60,000","$100,000","$30,000"],"ci":3,"r":"The minimum is $30,000 for the injury or death of one person."},{"id":"q-6-078","f":"s10-002","topic":"Insurance minimums and proof","stem":"Which pairing matches the minimum for one injured person and the minimum for property damage?","o":["One person hurt: $30,000; property: $15,000","One person hurt: $15,000; property: $30,000","One person hurt: $60,000; property: $15,000","One person hurt: $30,000; property: $60,000"],"ci":0,"r":"The minimums are $30,000 for one injured person and $15,000 for property damage."},{"id":"q-6-079","f":"s10-003","topic":"Insurance minimums and proof","stem":"What is the minimum liability coverage when more than one person is hurt in the same accident?","o":["$30,000","$60,000","$15,000","$90,000"],"ci":1,"r":"The minimum for injury or death of more than one person is $60,000."},{"id":"q-6-080","f":"s10-003","topic":"Insurance minimums and proof","stem":"Your crash injures three people. With only the minimum coverage, what is the most the policy pays for all the injuries together?","o":["$30,000 for each of the three, $90,000 in total","$60,000 for the accident as a whole","$30,000 in total, the one-person limit","$15,000 per person, $45,000 in total"],"ci":1,"r":"The accident-wide minimum for several injured people is $60,000."},{"id":"q-6-081","f":"s10-003","topic":"Insurance minimums and proof","stem":"Which statement about the two injury limits is right?","o":["$60,000 is the cap per person; $30,000 is the cap for everyone hurt in one accident","Both are caps per person, so two injured people could each receive $60,000","$30,000 is the cap per person; $60,000 is the cap for everyone hurt in one accident","$30,000 covers injuries and $60,000 covers deaths"],"ci":2,"r":"One injured person is covered up to $30,000 and everyone hurt in one accident up to $60,000."},{"id":"q-6-082","f":"s10-004","topic":"Insurance minimums and proof","stem":"What is the minimum liability coverage for damage to other people's property in one accident?","o":["$5,000","$30,000","$1,000","$15,000"],"ci":3,"r":"The minimum for property damage is $15,000 per accident."},{"id":"q-6-083","f":"s10-004","topic":"Insurance minimums and proof","stem":"You back into a parked luxury car and the repair bill is $22,000. Your policy has only the minimum property coverage. What does the policy pay?","o":["All $22,000, since coverage matches the actual damage","Up to $15,000 of it, and you owe the rest","Up to $30,000 for property damage","Up to $1,000, the reporting line"],"ci":1,"r":"Minimum property coverage pays up to $15,000, so you owe the other $7,000."},{"id":"q-6-084","f":"s10-004","topic":"Insurance minimums and proof","stem":"Which set lists the three current minimum limits?","o":["$15,000 per person; $30,000 per accident for several people; $5,000 for property","$30,000 per person; $60,000 per accident for several people; $30,000 for property","$30,000 per person; $60,000 per accident for several people; $15,000 for property","$60,000 per person; $30,000 per accident for several people; $15,000 for property"],"ci":2,"r":"The minimums are $30,000, $60,000 and $15,000 for the three kinds of loss."},{"id":"q-6-085","f":"s10-005","topic":"Insurance minimums and proof","stem":"Who takes on financial responsibility for a driver under 18?","o":["The driving school","The car's insurer","The teen driver","A parent or guardian"],"ci":3,"r":"Parents or guardians assume financial responsibility for drivers younger than 18."},{"id":"q-6-086","f":"s10-005","topic":"Insurance minimums and proof","stem":"A 17-year-old with a license causes a crash in her friend's car, and the damage is more than insurance covers. Who is also liable?","o":["Her friend's parents, who own the car she was driving","No one; a minor under 18 cannot be made to owe damages for a crash","Her parent or guardian, who took on responsibility for her driving","The school she attends, which signed her up for driver education"],"ci":2,"r":"A parent or guardian shares liability for a minor's driving."},{"id":"q-6-087","f":"s10-005","topic":"Insurance minimums and proof","stem":"Which driver's financial responsibility sits with a parent or guardian?","o":["A 19-year-old college student on her parents' policy","A 21-year-old who lives at home","A 16-year-old with a provisional license","A 25-year-old who borrowed his father's car"],"ci":2,"r":"The parental responsibility covers drivers younger than 18."},{"id":"q-6-088","f":"s10-006","topic":"Collision reports to DMV (SR-1)","stem":"If you are in a reportable collision and cannot show proof of insurance, what happens to your license?","o":["It is suspended for at least a year and until you file proof","It is suspended for six months and returns once you show a new policy","It is suspended until the other driver's damages are paid in full","It is suspended for 30 days and returns once you pay a reinstatement fee"],"ci":0,"r":"A reportable collision with no proof of insurance brings a suspension of at least one year."},{"id":"q-6-089","f":"s10-006","topic":"Collision reports to DMV (SR-1)","stem":"You rear-end a car, causing $2,500 in damage, and you have no insurance. What should you expect?","o":["A fine only, since no one was hurt","No action, since the damage is under $5,000","A suspension that ends after 30 days as soon as you buy a new insurance policy","A license suspension of at least a year, ending only after you file proof"],"ci":3,"r":"Damage over $1,000 makes the collision reportable, and no proof means a suspension of at least a year."},{"id":"q-6-090","f":"s10-006","topic":"Collision reports to DMV (SR-1)","stem":"What ends the suspension after an uninsured collision?","o":["Paying the other driver and waiting 30 days","A year passing and the driver paying a reinstatement fee","Filing proof of insurance alone, with no waiting period","A year passing and the driver filing proof of financial responsibility"],"ci":3,"r":"The suspension ends only after one year and the filing of proof."},{"id":"q-6-091","f":"s10-007","topic":"Insurance minimums and proof","stem":"After a year of an uninsured-collision suspension, how can you get the license back?","o":["Pay a one-time reinstatement fee, with nothing else to file","Retake the driving test","Wait out three more years","File proof of financial responsibility with the DMV"],"ci":3,"r":"After one year, filing proof of financial responsibility can end the suspension."},{"id":"q-6-092","f":"s10-007","topic":"Insurance minimums and proof","stem":"Your license came back after you filed proof of insurance, but you let the policy lapse after two years. What happens?","o":["Nothing happens, because the year of suspension is already served","You pay a small fine and keep the license, because a lapse is minor","The suspension returns, because the proof had to be kept for three years","You get a 30-day warning to renew the policy, because the license was returned"],"ci":2,"r":"The suspension is reinstated if the proof lapses within three years."},{"id":"q-6-093","f":"s10-007","topic":"Insurance minimums and proof","stem":"A friend says the suspension ends for good after one year. What is he missing?","o":["He must also keep a clean driving record for three years, or the suspension returns","Nothing; after one year the suspension ends for good","He must also keep proof of financial responsibility for three years, or it returns","He must retake the written test within three years"],"ci":2,"r":"The suspension returns if the proof lapses within three years."},{"id":"q-6-094","f":"s10-008","topic":"Collision reports to DMV (SR-1)","stem":"How soon after a collision with more than $1,000 in damage must you report it to the DMV?","o":["Within 10 days","Within 24 hours","Within 30 days","Within 72 hours"],"ci":0,"r":"A reportable collision must be reported to the DMV on the SR 1 form within 10 days."},{"id":"q-6-095","f":"s10-008","topic":"Collision reports to DMV (SR-1)","stem":"Last Monday you hit a fence and caused $3,000 in damage. Nobody was hurt and the police were not called. What must you do?","o":["Nothing, because no one was hurt and there is no police report","File an SR 1 report with the DMV within 10 days of the crash","Tell your insurer, who files with the DMV for you","Report only to the police, within 24 hours"],"ci":1,"r":"Damage over $1,000 must be reported to the DMV within 10 days, whatever the injuries."},{"id":"q-6-096","f":"s10-008","topic":"Collision reports to DMV (SR-1)","stem":"Which of these collisions needs a DMV report?","o":["$900 of damage to a bumper, and no one hurt","$600 of damage to a fence, and no one hurt","$1,500 of damage to a parked car, and no one hurt","No visible damage, and the other driver says forget it"],"ci":2,"r":"Damage over $1,000 makes a collision reportable."},{"id":"q-6-097","f":"s10-009","topic":"Duties at the crash scene","stem":"How soon must you report a collision with an injury or death to law enforcement?","o":["Within 10 days","Within 72 hours","Within a week","Within 24 hours"],"ci":3,"r":"An injury or death collision must be reported to law enforcement within 24 hours."},{"id":"q-6-098","f":"s10-009","topic":"Duties at the crash scene","stem":"You bump a cyclist who falls and says her wrist hurts. You stop, swap details and leave. What deadline remains?","o":["A report to the DMV within one day of the crash","No report, since the cyclist agreed to go on her way","A report to the police or sheriff within one day of the crash","A report to the police within 10 days of the crash"],"ci":2,"r":"A crash with an injury must be reported to law enforcement within 24 hours."},{"id":"q-6-099","f":"s10-009","topic":"Duties at the crash scene","stem":"Collision A: $2,000 damage, no injuries. Collision B: a minor injury and little damage. Which needs the 24-hour report to law enforcement?","o":["B, because someone was injured","A, because the damage passes $1,000","Both, because any crash needs a report within 24 hours","Neither; both go only to the DMV"],"ci":0,"r":"The 24-hour report to law enforcement applies when anyone is injured or killed."},{"id":"q-6-100","f":"s10-010","topic":"Duties at the crash scene","stem":"What must you do first at the scene of a collision you are in?","o":["Drive to the next safe spot, then call and wait","Call your insurer before doing anything else","Take photos of the damage from a safe spot, then leave","Stop immediately and stay at the scene"],"ci":3,"r":"A driver in a collision must stop immediately at the scene."},{"id":"q-6-101","f":"s10-010","topic":"Duties at the crash scene","stem":"You are in a crash and the other driver is hurt. You have stopped. What is next?","o":["Call your insurer and wait for them to tell you whom to call","Call 911, then exchange license, registration, insurance and contact details","Ask the other driver to call 911 so you can start swapping details","Exchange names and phone numbers, then call 911 if the other driver asks"],"ci":1,"r":"Call 911 when anyone is injured, and exchange license, registration, insurance and contact details."},{"id":"q-6-102","f":"s10-010","topic":"Duties at the crash scene","stem":"Which of these is NOT among the items the law has you exchange with the other party after a collision?","o":["Your vehicle registration card","Your Social Security number","Your insurance information","Your driver's license"],"ci":1,"r":"The law lists license, registration, insurance and contact details; a Social Security number is not among them."},{"id":"q-6-103","f":"s10-011","topic":"Duties at the crash scene","stem":"You hit an unattended parked car. What must you do?","o":["Drive on, because no one was harmed","Wait nearby for 30 minutes, then drive on if no owner shows up","Leave a note with your contact information, so the owner can reach you","Leave a note, but only when the damage is clearly over $1,000"],"ci":2,"r":"A driver who hits an unattended parked vehicle must leave a note with contact information."},{"id":"q-6-104","f":"s10-011","topic":"Duties at the crash scene","stem":"In a parking lot you scrape a parked pickup while backing out. Nobody is around. What do you do?","o":["Leave a note on the truck with your name, address and what happened","Check the damage, decide it is small and drive on","Take a photo of the damage and keep it for your insurer","Write down the plate number and report the scrape to the DMV later that week"],"ci":0,"r":"Leave a note with your contact information in a spot where the owner will see it."},{"id":"q-6-105","f":"s10-011","topic":"Duties at the crash scene","stem":"You hit a moving car with a driver in it, and later an unattended parked car. Which pairing is right?","o":["Moving car: leave a note; parked car: exchange details with the driver","Moving car: swap details with the driver; parked car: leave a note","Both: leave a note and drive on","Both: call 911 and wait to be told what to do"],"ci":1,"r":"With a driver present you exchange details; with an unattended car you leave a note."},{"id":"q-6-106","f":"s10-012","topic":"Collision reports to DMV (SR-1)","stem":"At what level of property damage must a collision be reported to the DMV?","o":["More than $500","More than $1,000","More than $2,500","More than $5,000"],"ci":1,"r":"A collision with property damage over $1,000 must be reported to the DMV."},{"id":"q-6-107","f":"s10-012","topic":"Collision reports to DMV (SR-1)","stem":"Another car's bumper is dented and the repair estimate is $750. No one is hurt. Must you report it to the DMV?","o":["No, because reports are only needed for damage over $5,000","Yes, because any damage must be reported within 10 days","No, because the damage is under $1,000 and nobody was hurt","Yes, because a dented bumper must be reported to police in 24 hours"],"ci":2,"r":"A report is needed only for damage over $1,000 or an injury or death."},{"id":"q-6-108","f":"s10-012","topic":"Collision reports to DMV (SR-1)","stem":"Which pairing is correct for property damage?","o":["Required coverage: $15,000; report to the DMV above: $1,000","Required coverage: $1,000; report to the DMV above: $15,000","Required coverage: $15,000; report to the DMV above: $15,000","Required coverage: $30,000; report to the DMV above: $1,000"],"ci":0,"r":"The required property coverage is $15,000 and the DMV report line is $1,000."},{"id":"q-6-109","f":"s8b-006","topic":"Child passengers","stem":"Under what condition may a child aged 6 or younger stay in a parked car?","o":["Only if the windows are cracked open and the weather outside is cool and mild","Whenever the parent stays within sight of the car","As long as the child is asleep and the doors are locked","Only while a supervisor aged 12 or older stays with the child"],"ci":3,"r":"A child 6 or younger may be left in a car only under the supervision of someone 12 or older."},{"id":"q-6-110","f":"s8b-006","topic":"Child passengers","stem":"You need to run into a shop for ten minutes. Your 5-year-old and her 9-year-old cousin are in the car. May you go?","o":["Yes, because the cousin is older and ten minutes is short","Not unless a supervisor aged 12 or older stays with them","Only if you lock the doors and crack the windows","Only if you can see the car from the shop window"],"ci":1,"r":"A child of 6 or younger needs supervision from someone at least 12 years old."},{"id":"q-6-111","f":"s8b-006","topic":"Child passengers","stem":"Which pairing of ages is correct?","o":["Child 12 or younger; supervisor at least 6","Child 6 or younger; supervisor at

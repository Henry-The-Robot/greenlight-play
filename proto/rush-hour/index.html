'use strict';
/* RUSH HOUR - Green Light prototype A (throwaway). One file, no dependencies.
 Built from:
 (1) the 3-lane swipe runner model of Subway Surfers / Temple Run (swipe = one lane, tap = jump to that lane);
 (2) the pseudo-3D road projection of Jake Gordon's "javascript-racer", flattened so far scenes stay legible
     (scale s = SF + (1-SF)*g, screen y linear in g);
 (3) the fixed-step loop of Glenn Fiedler, "Fix Your Timestep" (accumulator, 1/60 s, render once per frame);
 (4) the answer-gate quiz-runner pattern (answers sit in the lanes);
 (5) teach-then-test with spaced re-asks (Roediger and Karpicke 2006, testing effect); every rule is asked twice, the re-ask in new words. The route is fixed per day, so it does not adapt to misses.
 (6) share-card squares after Wordle; seeded daily route so times compare (BRIEF.md "Kyle's spec, part 2").
 Rules (RH2): 17 teaching units (game/src/content/units.json ids, also RULES[].id) in the RUSH_UNITS block below, with 60 bank questions; nothing is hand-written in this file.
 Adult-trap families (hard) are Kyle's list (curb, cyclist, 4-way), not measured.
 Daily route = same 6 rules, order, questions and answer wording for everyone on a local calendar date (like Wordle); the answer LANES are shuffled on every attempt.
 Test hooks exist ONLY with ?dev=1: ts=4 (clock x4), seed=N (route seed, default = date as YYYYMMDD), window.__rush (state for the Playwright bot). Players never see them.
 V2 (card RH1, Kyle 2026-10-10: "too fast to read the info", "give it music and sound effects", "a better learning experience"), prototypes/DESIGN.md:
 (7) pace: teach card waits for a tap (6 s max) while the road crawls; question line 1.5 s before the signs; signs of 2-5 words with the full answer in a bottom bar;
     windows 7 s / 5 s / 4 s (first / second / third ask), fast window = first 40 percent; Calm doubles every window.
 (8) learning: teach card = rule + picture + one "why" line; a miss stops the road and keeps rule + why until a tap (delayed feedback after a retrieval attempt,
     Butler, Karpicke and Roediger 2007); right re-ask = "Locked in"; end card lists rules learned and rules to practise (prototypes/TEACHING.md sections 2-4);
     v2 wrote a cautious-but-wrong option into every answer set by hand; RH2 takes the 2 wrong options per question from the bank (chosen in tools/rush-labels.json) and measures the cheap-bot tells.
 (9) audio, no files, ported from the slice (game/src/audio/engine.ts + schedule.ts): audio-clock look-ahead scheduler (Chris Wilson, "A Tale of Two Clocks"),
     per-stem low-pass, anchored note envelopes, dark noise reverb, iOS audioSession, resume on first tap. New here: kick/hat and lead layers by streak, a riser at turbo,
     a low-pass on the music while a card is open, and the sound effects. */
/* V4a (card RH2c, Kyle played v3 on 2026-10-10 evening; prototypes/DESIGN.md "v4"): (1) controls: TAP a lane to go there, HOLD to brake (a press under 0.18 s is a tap), swipe unused (reserved for turns, card RH2d);
 (2) the hydrant is a parking moment with a ruler (5, 10, 15, 20 ft ticks, car front measured, feet shown); (3) saved progress in localStorage (rule known after 2 right plays, best checkpoint, Reset progress);
 (4) faster start (first moment about 1 s after the tap, speed ramps over 12 s, creeps up between checkpoints); (5) coin targets are checkpoints (banner, 15 s ad, the road goes on); a lost heart returns to the last checkpoint.
 Exemplars named by the Lead: Temple Run / Subway Surfers (checkpoint and respawn feel, tap lanes), Crossy Road (one-finger); the numbers are ours and tuned by bots. */
/* V3 (card RH2b, Kyle played v2 on 2026-10-10: "basically the whole game is just questions and cards with minimal playing", "not enough time to read", "text too small", "SFX are good"),
 prototypes/DESIGN.md "v3: play first". About 3 of 4 moments are PLAYED (swipe = lane, hold = brake, release = go; no question text, no signs; the world judges the car), 1 of 4 is a question (the road crawls, the
 clock starts after a reading delay of 0.3 s a word, no turbo). Coins win: each level has a coin target; wrong = lose coins, a dangerous wrong = a crash = a life (3 lives). Levels add rule families, speed (+2 m/s) and shorter
 timers (x0.9). A placeholder 15 s ad sits between levels and on game over (extra life once). Sources and what is ours:
 (10) controls: swipe = one lane is the Subway Surfers / Temple Run model (item 1 above); hold = brake is our own addition, no exemplar copied (the judge numbers, 15 m/s2 braking and the 3 m late margin, are tuned by test, not measured);
 (11) lives, a coin target per level, a rewarded-ad continue once per run, a coming-soon mini game: Kyle's spec (DESIGN.md "v3: play first"), shape of a casual mobile runner;
 (12) the fixed-step loop, the audio synth, the world drawing and the RH2 data block are unchanged from v2 (rh2.html is the v2/RH2 file, kept).
 Judges (stepStop, stepAmb, stepBike, stepNoStop, stepPark in the logic block) are written out in the comment above K_STOP. Test: check.js (bots drive the real pointer handlers). */
const W=390,CX=195,HOR=240,Z1=40,SF=.28,PX=34,LN=3.2,DT=1/60,GAP=30,TEACH_MAX=6,TEACH_MIN=.7,PRE=1.5,FW=.4,CRAWL=2.5,VQ=15;
let H=844,GY=700,ZN=-9.5;   /* ZN: the nearest ground distance that still reaches the bottom edge of the canvas */   /* logical height: 664 to 844, set by resize() from the window shape, so a phone browser with a toolbar still draws at full width and size */
const Q=new URLSearchParams(location.search);
const DEV=Q.get('dev')==='1';
const TS=DEV?Math.max(.25,Math.min(8,+Q.get('ts')||1)):1;
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rnd=mul((Date.now()%999983)+1);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return 1-(1-t)**3};
const back=t=>{t=clamp(t,0,1);return 1+2.8*(t-1)**3+1.8*(t-1)**2};
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const BC=['#2f80ed','#ff8a00','#e84393'];
const cv=document.getElementById('c'),cx=cv.getContext('2d');
/* The logical canvas is always 390 wide and 664 to 844 tall. A phone browser with a toolbar is about 390x664: the canvas then fills it at scale 1,
   instead of shrinking a fixed 390x844 picture to 79 percent (the text would be 21 percent smaller). Bottom things hang from H, so nothing is cut. */
function resize(){const vw=innerWidth,vh=innerHeight;H=clamp(Math.round(W*vh/vw),664,844);GY=H-144;ZN=Z1*(GY-HOR)/(H-HOR)-Z1;
 const s=Math.min(vw/W,vh/H),d=Math.min(devicePixelRatio||1,2.5);
 cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);cx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
 if(typeof relayout==='function')relayout()}
addEventListener('resize',resize);

/* ---------- projection and drawing helpers ---------- */
const gg=z=>Z1/(Z1+z),sc=z=>SF+(1-SF)*gg(z),yy=z=>HOR+(GY-HOR)*gg(z);
function gq(x1,x2,za,zb,col){za=Math.max(za,ZN);if(zb<=za)return;const sa=sc(za),sb=sc(zb),ya=yy(za),yb=yy(zb);
 cx.fillStyle=col;cx.beginPath();cx.moveTo(CX+x1*PX*sa,ya);cx.lineTo(CX+x2*PX*sa,ya);cx.lineTo(CX+x2*PX*sb,yb);cx.lineTo(CX+x1*PX*sb,yb);cx.fill()}
function sideQuad(xm,za,zb,h0,h1,col){const sa=sc(za),sb=sc(zb),ya=yy(za),yb=yy(zb),xa=CX+xm*PX*sa,xb=CX+xm*PX*sb;
 cx.fillStyle=col;cx.beginPath();cx.moveTo(xa,ya-h0*PX*sa);cx.lineTo(xb,yb-h0*PX*sb);cx.lineTo(xb,yb-h1*PX*sb);cx.lineTo(xa,ya-h1*PX*sa);cx.fill()}
function at(x,z,fn,a,rot){if(z<ZN+.5)return;const k=PX*sc(z);cx.save();cx.translate(CX+x*k,yy(z));cx.scale(k,k);
 if(a!==undefined&&a<1)cx.globalAlpha=Math.max(0,a);if(rot)cx.rotate(rot);fn();cx.restore()}
const at0=at;
/* meter-space shapes: origin ground centre, y up */
const rc=(x,y,w,h,c)=>{cx.fillStyle=c;cx.fillRect(x,-y-h,w,h)};
const ci=(x,y,r,c)=>{cx.fillStyle=c;cx.beginPath();cx.arc(x,-y,r,0,6.2832);cx.fill()};
const pg=(p,c)=>{cx.fillStyle=c;cx.beginPath();p.forEach((q,i)=>i?cx.lineTo(q[0],-q[1]):cx.moveTo(q[0],-q[1]));cx.closePath();cx.fill()};
const oc=(x,y,r,c)=>pg(Array.from({length:8},(_,i)=>{const a=(i+.5)*Math.PI/4;return[x+Math.cos(a)*r,y+Math.sin(a)*r]}),c);
function T(s,x,y,size,col,al,stroke){cx.font=`bold ${size}px ${FONT}`;cx.textAlign=al||'center';cx.textBaseline='middle';
 if(stroke){cx.lineWidth=stroke;cx.strokeStyle='rgba(0,0,0,.6)';cx.lineJoin='round';cx.strokeText(s,x,y)}cx.fillStyle=col;cx.fillText(s,x,y)}
function RR(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function wrapT(s,mw,sz){cx.font=`bold ${sz}px ${FONT}`;const L=[];let l='';
 for(const w of s.split(' ')){const n=l?l+' '+w:w;if(cx.measureText(n).width>mw&&l){L.push(l);l=w}else l=n}if(l)L.push(l);return L}
const mu=n=>1+.5*(Math.min(Math.max(n,1),7)-1);
const qr=(t,q)=>clamp((t-q.rd)/q.W,0,1);  /* answer-speed ratio 0..1: the clock starts after the reading delay q.rd (v3) */

/* ---------- content: teaching units (card RH2) ---------- */
/* Every moment reads its teach line, why line, question and answers from RUSH_UNITS. The block between the markers is written by
   tools/build_rush_units.py from game/src/content/units.json + the bank questions + tools/rush-labels.json. Do not edit it by hand.
   unit = {id (units.json), k (scene kind), cv (curb colour), sv (scene variant), hard, title, name, fail, teach, why, short, roast, qs[]};
   question = {id (bank), tier t1|t2|t3, stem (the scene question, bank wording), ci (bank correct index), sv?, o: [right, wrong, wrong]};
   option = {i (bank option index), s (sign label, 2-5 words), t (the full bank option, shown in the bottom bar)}.
   Sign = label, bottom bar = full option. The first ask of a rule uses a t1 question, the re-ask a t2 or t3 question (different wording). */
/*RUSH-UNITS-BEGIN*/
const RUSH_UNITS=[{"id":"s7_p11_roadway-002","k":"bus","cv":null,"sv":0,"hard":false,"title":"SCHOOL BUS","name":"School bus","fail":"ticket","teach":"Stop for school bus red flashing lights until they go off, unless the bus is across a divided road.","why":"Kids may cross in front of the bus.","action":{"correct":"stop_full","wrong_crash":"keep_going","cite":"Stop for school bus red flashing lights until they go off, unless the bus is across a divided road."},"short":"School bus red lights: stay stopped.","roast":"You'd lose your license at the school bus.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont/","qs":[{"id":"q-3-043","tier":"t1","stem":"A school bus on an undivided road has its red lights flashing. Who must stop?","ci":1,"o":[{"i":1,"s":"Cars from both directions","t":"Cars from both directions, behind and ahead"},{"i":0,"s":"Cars behind, not oncoming","t":"Cars behind the bus, but not oncoming cars"},{"i":2,"s":"Cars facing it, not behind","t":"Cars facing the bus, but not those behind it"}]},{"id":"q-3-045","tier":"t2","stem":"A bus ahead on a two-lane road shows red flashing lights. An oncoming car drives past it. Which statement is right?","ci":0,"o":[{"i":0,"s":"Oncoming driver broke the rule","t":"The oncoming driver broke the rule, since both directions must stop"},{"i":1,"s":"Fine; only followers must stop","t":"The oncoming driver is fine, since only following traffic must stop"},{"i":3,"s":"Fine if no child visible","t":"The oncoming driver is fine if no child is in sight"}]}]},{"id":"s6_p11_run2-001","k":"bus","cv":null,"sv":0,"hard":false,"title":"BUS STOP ARM","name":"School bus stop arm","fail":"ticket","teach":"When a school bus stop arm extends, stop and stay stopped until the children are clear.","why":"The stop arm means children are crossing.","action":{"correct":"stop_full","wrong_crash":"keep_going","cite":"When a school bus stop arm extends, stop and stay stopped until the children are clear."},"short":"Stop arm out: stay stopped.","roast":"You'd drive past a school bus stop arm.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont/","qs":[{"id":"q-3-022","tier":"t1","stem":"What does a school bus stop arm do?","ci":0,"o":[{"i":0,"s":"Makes traffic stop","t":"It makes traffic stop while children board or leave"},{"i":1,"s":"Bus pulling away soon","t":"It shows the bus will pull away from the stop soon"},{"i":2,"s":"Bus turning right soon","t":"It signals that the bus is turning right shortly"}]},{"id":"q-3-023","tier":"t2","stem":"You are stopped behind a school bus whose stop arm is out. A child steps off the curb to cross. When may you drive on?","ci":3,"o":[{"i":3,"s":"Arm folds, children clear","t":"When the arm folds in and the children are clear"},{"i":0,"s":"Arm out, road looks empty","t":"When the arm is out but the road looks empty"},{"i":1,"s":"Once first child is across","t":"As soon as the first child is across"}]}]},{"id":"s7_p11_run3-009","k":"bus","cv":null,"sv":0,"hard":false,"title":"KIDS AT THE BUS","name":"Children at a bus","fail":"ticket","teach":"Expect children to cross in front of a stopped school bus, and stay stopped until they are clear.","why":"The driver can see kids in front of the bus.","action":{"correct":"stop_full","wrong_crash":"keep_going","cite":"Expect children to cross in front of a stopped school bus, and stay stopped until they are clear."},"short":"Kids cross in front of the bus: stay stopped.","roast":"You'd watch the wrong side of the school bus.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont/","qs":[{"id":"q-3-097","tier":"t1","stem":"Why are children taught to cross in front of a stopped school bus?","ci":0,"o":[{"i":0,"s":"Driver can see them","t":"So the bus driver can see them"},{"i":1,"s":"Stay clear of exhaust","t":"So they stay clear of the exhaust"},{"i":2,"s":"They cross faster","t":"So they cross faster"}]},{"id":"q-3-058","tier":"t1","stem":"After leaving a stopped school bus, where do children who must cross the road walk?","ci":2,"o":[{"i":2,"s":"In front, driver's view","t":"In front of the bus, in the driver's view"},{"i":0,"s":"Behind it, out of traffic","t":"Behind the bus, out of the traffic lane"},{"i":1,"s":"Beside it, next to traffic","t":"At the side of the bus, next to the traffic"}]},{"id":"q-3-098","tier":"t2","stem":"You are stopped behind a bus with red lights. You cannot see the front of the bus. What should you assume?","ci":2,"o":[{"i":2,"s":"Kids may cross in front","t":"Children may cross in front of the bus, out of view"},{"i":0,"s":"Kids walking behind the bus","t":"Children are walking behind the bus toward you"},{"i":1,"s":"No one will cross","t":"No one will cross, since the bus is loading"}]},{"id":"q-3-099","tier":"t2","stem":"Which statement about children crossing at a stopped bus is right?","ci":1,"o":[{"i":1,"s":"In front, driver sees them","t":"They cross in front, where the driver can see them"},{"i":0,"s":"Behind it, cars see them","t":"They cross behind it, where cars can see them"},{"i":2,"s":"Beside it, in traffic","t":"They cross beside it, between the bus and traffic"}]}]},{"id":"s6_p11_roadway-032","k":"cross","cv":null,"sv":0,"hard":false,"title":"CROSSWALK","name":"Crosswalk","fail":"ticket","teach":"Give way to people in any marked crosswalk, and in an unmarked crosswalk at an intersection.","why":"A person on foot has no metal around them.","action":{"correct":"stop_full","wrong_crash":"keep_going","cite":"Give way to people in any marked crosswalk, and in an unmarked crosswalk at an intersection."},"short":"Crosswalk, marked or not: yield to people.","roast":"You'd lose your license at the crosswalk.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road/","qs":[{"id":"q-2a-103","tier":"t1","stem":"Which crosswalks give pedestrians the right of way?","ci":1,"o":[{"i":1,"s":"Marked and unmarked alike","t":"Marked and unmarked crosswalks alike"},{"i":2,"s":"Signal and school crosswalks","t":"Signal-controlled crosswalks and school crosswalks"},{"i":3,"s":"25 mph streets or lower","t":"Crosswalks on streets with a 25 mph limit or lower"}],"sv":0},{"id":"q-1b-016","tier":"t1","stem":"At an intersection with no painted crosswalk, a person steps off the curb. Who has the right of way?","ci":0,"o":[{"i":0,"s":"The pedestrian","t":"The pedestrian, as at a painted crosswalk"},{"i":1,"s":"First one to the corner","t":"Whoever is first to the corner"},{"i":3,"s":"The larger vehicle","t":"The larger vehicle"}],"sv":1},{"id":"q-2a-105","tier":"t2","stem":"A friend says only painted crosswalks protect pedestrians. How do you reply?","ci":1,"o":[{"i":1,"s":"Unmarked ones protect too","t":"Unmarked crosswalks protect pedestrians too"},{"i":0,"s":"Agree; paint creates priority","t":"Agree; paint is what creates the right of way"},{"i":3,"s":"Pedestrians have priority everywhere","t":"Pedestrians have the right of way everywhere on the road"}],"sv":0}]},{"id":"s6_p11_roadway-009","k":"yellow","cv":null,"sv":0,"hard":false,"title":"YELLOW LIGHT","name":"Yellow light","fail":"crash","teach":"Steady yellow means red is next. Stop if you can do so safely.","why":"Cross traffic is about to get its green.","action":{"correct":"stop_line","wrong_crash":"keep_going","cite":"Steady yellow means red is next. Stop if you can do so safely."},"short":"Yellow: red is next. Stop if you safely can.","roast":"You'd go through a yellow you could stop for.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road/","qs":[{"id":"q-2a-052","tier":"t1","stem":"You are far back from an intersection when the light turns yellow. What do you do?","ci":0,"o":[{"i":0,"s":"Brake smoothly, stop at line","t":"Brake smoothly and stop before the line, since you have room"},{"i":1,"s":"Accelerate; yellow means hurry","t":"Accelerate to make it, since yellow means hurry"},{"i":2,"s":"Brake hard, even over line","t":"Brake hard, even if you stop over the line, as red is next"}]},{"id":"q-2a-053","tier":"t2","stem":"You drive at 35 mph and reach the limit line just as the light turns yellow. A car follows close behind. What fits the yellow-light rule?","ci":0,"o":[{"i":0,"s":"Cross with care if clear","t":"Cross with care, if you judge you can clear the crossing before red"},{"i":1,"s":"Slam on brakes, always stop","t":"Slam on the brakes, since yellow always means stop"},{"i":2,"s":"Accelerate to beat red","t":"Accelerate hard so you are sure to be through before red"}],"keep":true}]},{"id":"s6_p11_run2-008","k":"amb","cv":null,"sv":0,"hard":false,"title":"SIREN BEHIND","name":"Siren behind you","fail":"ticket","teach":"Emergency vehicle with siren and lights approaching: pull to the right, clear of intersections, and stop until it passes.","why":"A clear right edge lets the crew drive past fast.","action":{"correct":"pull_right_stop","wrong_crash":"keep_going","cite":"Emergency vehicle with siren and lights approaching: pull to the right, clear of intersections, and stop until it passes."},"short":"Siren behind you: pull right and stop.","roast":"You'd block the ambulance.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road/","qs":[{"id":"q-6-166","tier":"t1","stem":"What must you do when an emergency vehicle with a siren and lights approaches?","ci":2,"o":[{"i":2,"s":"Pull right and stop","t":"Pull to the right edge and stop until it passes"},{"i":0,"s":"Slow, keep rolling in lane","t":"Slow down but keep rolling in your lane until it passes"},{"i":1,"s":"Pull left and stop","t":"Pull to the left edge and stop until it passes"}]},{"id":"q-6-168","tier":"t2","stem":"Which driver is doing the right thing as a siren approaches?","ci":0,"o":[{"i":0,"s":"Ben pulls right, stays stopped","t":"Ben, who pulls right and stays stopped until the truck has  car to stop goes first; in a tie the right car yields to the left"}]}]},{"id":"s6_p11_roadway-002","k":"4way","cv":null,"sv":0,"hard":true,"title":"4-WAY STOP TIE","name":"4-way stop tie","fail":"crash","teach":"Two drivers arrive together at a four-way stop: the driver on the left yields to the right.","why":"Everyone knows who goes next, so nobody guesses.","action":{"correct":"wait_turn","wrong_crash":"keep_going","cite":"Two drivers arrive together at a four-way stop: the driver on the left yields to the right."},"short":"4-way stop tie: the car on the right goes.","roast":"You'd cause a pile-up at the 4-way stop.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road/","qs":[{"id":"q-2a-031","tier":"t1","stem":"Two cars on adjacent roads stop at a four-way stop at the very same moment. Which one must wait?","ci":2,"o":[{"i":2,"s":"The one on the left","t":"The one on the left"},{"i":0,"s":"The one on the right","t":"The one on the right"},{"i":1,"s":"The larger vehicle","t":"The one driving the larger vehicle"}],"sv":0},{"id":"q-2a-032","tier":"t2","stem":"You head north and reach a four-way stop at the same moment as a car coming from the east, on your right. Who goes first?","ci":3,"o":[{"i":3,"s":"The car on your right","t":"The car from the east, on your right"},{"i":0,"s":"You, heading north","t":"You, since you are heading north"},{"i":1,"s":"You, going straight, not turning","t":"You, since you are going straight and not turning"}],"sv":0},{"id":"q-2a-033","tier":"t2","stem":"You head south and reach a four-way stop at the same moment as a car from the east, on your left. Who goes first?","ci":0,"o":[{"i":0,"s":"You, they're on your left","t":"You do, since the other car is on your left"},{"i":1,"s":"The other car, cross street","t":"The other car, since it is on a cross street"},{"i":3,"s":"Both go together","t":"Both cars together, since both stopped at once"}],"sv":1}]},{"id":"s8c-010","k":"bike","cv":null," oad ahead is clear far enough to return to your lane safely.","r":"Without a long clear view you cannot be sure to return safely, so you wait.","stem":"You follow a slow van on a winding hill road. You can see only a short way past the next curve. What do you do?","ci":1,"o":[{"i":1,"s":null,"t":"Stay behind until a long, clear stretch appears"},{"i":0,"s":null,"t":"Pass now, since the lane looks empty at this moment"},{"i":2,"s":null,"t":"Pass and speed up, to get back before the curve"}],"g":null,"tier":"t2","nl":1},{"id":"q-2a-099","u":"s6_p11_roadway-030","ut":"Pass only when the road ahead is clear far enough to return to your lane safely.","r":"The road must stay clear until you are back in your lane, not only at the start.","stem":"A driver checks that the opposite lane is empty as she pulls out to pass. What did she forget?","ci":0,"o":[{"i":0,"s":null,"t":"To check that it stays clear long enough to finish the pass"},{"i":1,"s":null,"t":"To check that the road is straight for a quarter mile"},{"i":3,"s":null,"t":"To check her speed against the limit before pulling out"}],"g":null,"tier":"t2","nl":1},{"id":"q-2a-100","u":"s6_p11_roadway-031","ut":"After passing another vehicle, signal before returning to the original lane.","r":"Signal before you return to the original lane.","stem":"You have passed a vehicle. What do you do before you move back to your lane?","ci":1,"o":[{"i":1,"s":null,"t":"Signal, then return once you are clear"},{"i":0,"s":null,"t":"Signal only once your wheels are across the line"},{"i":3,"s":null,"t":"Nothing, since the other driver can see you"}],"g":null,"tier":"t2","nl":1},{"id":"q-2a-101","u":"s6_p11_roadway-031","ut":"After passing another vehicle, signal before returning to the original lane.","r":"Signal first, then move back once you are clear.","stem":"You have just passed a truck. You can see its front bumper in your mirror. What is the next step?","ci":1,"o":[{"i":1,"s":null,"t":"Signal to move back, then return smoothly"},{"i":0,"s":null,"t":"Cut back at once, since you are ahead"},{"i":3,"s":null,"t":"Stay in the passing lane for several miles"}],"g":null,"tier":"t2","nl":1},{"id":"q-2a-102","u":"s6_p11_roadway-031","ut":"After passing another vehicle, signal before returning to the original lane.","r":"A pass has two signals: one to leave the lane and one to return.","stem":"Which describes the signals in a pass?","ci":2,"o":[{"i":2,"s":null,"t":"Signal to pull out, and again to return"},{"i":0,"s":null,"t":"One signal at the start covers the whole pass"},{"i":1,"s":null,"t":"A signal when you return, since leaving the lane needs none"}],"g":null,"tier":"t3","nl":1},{"id":"q-2a-103","u":"s6_p11_roadway-032","ut":"Give way to people in any marked crosswalk, and in an unmarked crosswalk at an intersection.","r":"Pedestrians have the right of way at marked and unmarked crosswalks.","stem":"Which crosswalks give pedestrians the right of way?","ci":1,"o":[{"i":1,"s":null,"t":"Marked and unmarked crosswalks alike"},{"i":2,"s":null,"t":"Signal-controlled crosswalks and school crosswalks"},{"i":3,"s":null,"t":"Crosswalks on streets with a 25 mph limit or lower"}],"g":null,"tier":"t1","nl":1},{"id":"q-2a-105","u":"s6_p11_roadway-032","ut":"Give way to people in any marked crosswalk, and in an unmarked crosswalk at an intersection.","r":"Marked and unmarked crosswalks both give pedestrians the right of way.","stem":"A friend says only painted crosswalks protect pedestrians. How do you reply?","ci":1,"o":[{"i":1,"s":null,"t":"Unmarked crosswalks protect pedestrians too"},{"i":2,"s":null,"t":"Only crosswalks with lights protect pedestrians"},{"i":3,"s":null,"t":"Pedestrians have the right of way everywhere on the road"}],"g":null,"tier":"t2","nl":1},{"id":"q-2a-106","u":"s6_p11_run3-016","ut":"Never pass a vehicle stopped at a crosswalk; stop behind it, because someone may be crossing.","r":"A stopped car may hide a pedestrian who is crossing in front of it.","stem":"A vehicle is stopped at a crosswalk. Why must you not pass it?","ci":0,"o":[{"i":0,"s":null,"t":"It may be stopping for a pedestrian you cannot see"},{"i":2,"s":null,"t":"It may be about to turn across your path"},{"i":3,"s":null,"t":"It may be waiting for the light ahead to change"}],"g":null,"tier":"t1","nl":1},{"id":"q-2a-109","u":"s6_p11_run2-017","ut":"Roundabout drivers should enter at a reduced speed, yield to traffic already in the circle, and exit with a signal.","r":"Slow down, yield to traffic in the circle, and signal when you exit.","stem":"What should you do as you enter a roundabout?","ci":1,"o":[{"i":1,"s":null,"t":"Slow down and yield to traffic in the circle"},{"i":0,"s":null,"t":"Come to a full stop at the entrance every time"},{"i":3,"s":null,"t":"Enter first if you are going straight on"}],"g":null,"tier":"t2","nl":1},{"id":"q-2a-110","u":"s6_p11_run2-017","ut":"Roundabout drivers should enter at a reduced speed, yield to traffic already in the circle, and exit with a signal.","r":"Traffic already in the circle goes first.","stem":"You come up to a roundabout. A car is already circling and about to pass your entry. What do you do?","ci":2,"o":[{"i":2,"s":null,"t":"Wait at the entry until it has passed"},{"i":0,"s":null,"t":"Enter and trust the circling car to slow down"},{"i":3,"s":null,"t":"Roll in slowly, so the circling car steers around you"}],"g":null,"tier":"t2","nl":1},{"id":"q-2a-112","u":"s6_p11_run2-018","ut":"When exiting a roundabout, signal your departure in advance to alert other drivers.","r":"Signal your exit in advance so other drivers know.","stem":"When you leave a roundabout, what should you do with your signal?","ci":0,"o":[{"i":0,"s":null,"t":"Signal in advance of your exit"},{"i":1,"s":null,"t":"Signal after you have left the circle"},{"i":2,"s":null,"t":"Use no signal, since all traffic goes the same way"}],"g":null,"tier":"t2","nl":1},{"id":"q-2a-113","u":"s6_p11_run2-018","ut":"When exiting a roundabout, signal your departure in advance to alert w down to a walking pace and go on"},{"i":2,"s":null,"t":"Go on at speed, since the road is empty"}],"g":null,"tier":"t2","nl":1},{"id":"q-2a-129","u":"s6_p11_run3-007","ut":"Flashing red light: stop at the limit line or before the crosswalk, as at a stop sign.","r":"Flashing red means stop. Flashing yellow means take care.","stem":"How do a flashing red and a flashing yellow light differ?","ci":0,"o":[{"i":0,"s":null,"t":"Red: full stop. Yellow: slow and take care"},{"i":1,"s":null,"t":"Flashing red: slow down; flashing yellow: full stop"},{"i":3,"s":null,"t":"Both mean the signal is out of order"}],"g":null,"tier":"t2","nl":1},{"id":"q-2a-131","u":"s7-15","ut":"A flashing yellow arrow signal means a left turn is permitted but not protected; yield to oncoming traffic before turning.","r":"You yield to oncoming traffic before the turn.","stem":"You wait at a light with a flashing yellow left arrow. A car is coming straight toward you. What do you do?","ci":1,"o":[{"i":1,"s":null,"t":"Wait for the oncoming car to pass, then turn"},{"i":0,"s":null,"t":"Turn left at once, since you have the arrow"},{"i":3,"s":null,"t":"Turn left slowly, so the oncoming car can brake for you"}],"g":null,"tier":"t2","nl":1},{"id":"q-2a-132","u":"s7-15","ut":"A flashing yellow arrow signal means a left turn is permitted but not protected; yield to oncoming traffic before turning.","r":"Green arrow means a protected turn. Flashing yellow arrow means yield first.","stem":"How does a flashing yellow left arrow differ from a steady green left arrow?","ci":1,"o":[{"i":1,"s":null,"t":"Flashing: yield first. Green arrow: protected"},{"i":0,"s":null,"t":"Flashing yellow: protected turn; green arrow: yield first"},{"i":3,"s":null,"t":"Flashing yellow: stop first; green arrow: yield first"}],"g":null,"tier":"t2","nl":1},{"id":"q-2b-001","u":"s7-23","ut":"Stop behind the line, never in the crosswalk, so people can cross and you do not block them.","r":"Stop before the crosswalk so people on foot can cross in front of your car.","stem":"At a red light, where should your car stop in relation to a marked crosswalk?","ci":3,"o":[{"i":3,"s":null,"t":"Behind the crosswalk, with the stripes clear in front of you"},{"i":1,"s":null,"t":"Just past the crosswalk, at the edge of the intersection"},{"i":2,"s":null,"t":"Wherever the bumper ends up, if nobody is crossing yet"}],"g":null,"tier":"t1","nl":1},{"id":"q-2b-008","u":"s7_p11_run3-002","ut":"Flashing yellow light: slow down and go through only with caution.","r":"A flashing yellow means proceed only with caution, so slow and look first.","stem":"You approach a signal that is flashing yellow, and you can see no other cars. What is your best action?","ci":0,"o":[{"i":0,"s":null,"t":"Ease off, look both ways, then continue through"},{"i":1,"s":null,"t":"Hold your speed, since nothing is coming"},{"i":3,"s":null,"t":"Speed up to be through before the light changes"}],"g":null,"tier":"t2","nl":1},{"id":"q-2b-010","u":"s7c-10","ut":"When railroad crossing lights are flashing red, you must stop your vehicle immediately.","r":"Flashing red crossing lights warn of a train, and you must stop right away.","stem":"Red lights are flashing at a railroad crossing ahead. What must you do?","ci":0,"o":[{"i":0,"s":null,"t":"Stop and stay stopped until it is safe to go"},{"i":1,"s":null,"t":"Slow down and cross if you see no train"},{"i":2,"s":null,"t":"Stop only if you can actually see the train"}],"g":null,"tier":"t1","nl":1},{"id":"q-2b-011","u":"s7c-10","ut":"When railroad crossing lights are flashing red, you must stop your vehicle immediately.","r":"Flashing red lights mean stop, even when no gate is down and no train is visible.","stem":"You reach a crossing with no gate arm. Red lights flash, and you cannot see a train. What do you do?","ci":3,"o":[{"i":3,"s":null,"t":"Stop and wait, as the lights mean a train is near"},{"i":0,"s":null,"t":"Cross quickly, as you cannot see a train anywhere"},{"i":2,"s":null,"t":"Edge forward to see farther down the track past the bend"}],"g":null,"tier":"t2","nl":1},{"id":"q-2b-014","u":"signs-001","ut":"Stop (octagon, white on red): Come to a full stop at the limit line, then go when it is safe.","r":"A stop sign needs a full stop at any hour, even when no one else is there.","stem":"It is 2 a.m. on an empty street. You reach a stop sign and see no cars in any direction. What do you do?","ci":1,"o":[{"i":1,"s":null,"t":"Stop fully, look both ways, then go"},{"i":0,"s":null,"t":"Roll through slowly, since the road is empty"},{"i":3,"s":null,"t":"Stop only if you see headlights from the side"}],"g":"stop","tier":"t2","nl":1},{"id":"q-2b-016","u":"signs-002","ut":"At a Yield sign, slow down and give way to everyone with the right-of-way, including people on foot.","r":"A yield sign means you slow down and give way to those with the right of way.","stem":"A red and white triangle pointing downward stands at a junction. What does it tell you?","ci":3,"o":[{"i":3,"s":null,"t":"Slow down and give way to others who have the right of way"},{"i":1,"s":null,"t":"Speed up to merge ahead of the other traffic"},{"i":2,"s":null,"t":"You have the right of way and the others must give way"}],"g":"yield","tier":"t1","nl":1},{"id":"q-2b-018","u":"signs-002","ut":"At a Yield sign, slow down and give way to everyone with the right-of-way, including people on foot.","r":"The yield rule covers people on foot as well as vehicles.","stem":"A walker is crossing the road you want to enter. A yield sign faces you. Who goes first?","ci":3,"o":[{"i":3,"s":null,"t":"The walker, because you give way to people on foot too"},{"i":1,"s":null,"t":"The walker, but only if a signal tells the walker to cross"},{"i":2,"s":null,"t":"Whoever is nearer to the junction when you both arrive"}],"g":"yield","tier":"t2","nl":1},{"id":"q-2b-019","u":"signs-003","ut":"Do Not Enter (square, white bar on red): Do not drive into this road. Traffic comes the other way.","r":"The sign keeps you out of a road where traffic flows toward you.","stem":"A white bar across a red square faces you at a road entrance. What does it mean?","ci":0,"o":[{"i":0,"s":null,"t":"Do not drive into this road, since traffic comes toward you"},{"i":1,"s":null,"t":"Stop here first, then drive in once the road looks clear"},{"i":2,"s":null,"t":"Do not park on this road, though you may drive in"}],"g":"do-not-enter","tier":"t1","nl":1},{"id":"q-2b-020","u":"signs-003","ut":"Do Not Enter (square, white bar on red): Do not drive into this road. Traffic comes the other way.","r":"A Do Not Enter sign bars you from that road, so choose another route.","stem":"You are about to turn into the end of a freeway off-ramp and a Do Not Enter sign faces you. What do you do?","ci":2,"o":[{"i":2,"s":null,"t":"Do not go in; find another route"},{"i":1,"s":null,"t":"Stop, check for traffic, then enter"},{"i":3,"s":null,"t":"Do not wait for a gap; enter when the ramp is empty"}],"g":"do-not-enter","tier":"t2","nl":1},{"id":"q-2b-022","u":"signs-004","ut":"Wrong Way (rectangle, white on red): You are driving against traffic. Stop and turn around safely.","r":"The sign means you have gone into a road against the traffic flow.","stem":"A red rectangle with the words WRONG WAY faces you. What does it tell you?","ci":1,"o":[{"i":1,"s":null,"t":"You are driving against traffic and must turn around"},{"i":2,"s":null,"t":"This lane is kept for buses, taxis and shuttles"},{"i":3,"s":null,"t":"Drivers going the wrong way may take the next exit"}],"g":"wrong-way","tier":"t1","nl":1},{"id":"q-2b-023","u":"signs-004","ut":"Wrong Way (rectangle, white on red): You are driving against traffic. Stop and turn around safely.","r":"Stop and turn around safely, because each meter further is against the traffic.","stem":"You see a Wrong Way sign and headlights coming straight at you in your lane. What is your first move?","ci":0,"o":[{"i":0,"s":null,"t":"Slow and stop safely, then turn around when it is safe"},{"i":2,"s":null,"t":"Flash your lights and carry on toward the next exit"},{"i":3,"s":null,"t":"Stop right there in your lane and wait for the cars to pass"}],"g":"wrong-way","tier":"t2","nl":1},{"id":"q-2b-025","u":"signs-005","ut":"No U-Turn (square, black on white, red ring and slash): Do not make a U-turn here.","r":"A U-shaped arrow with a red slash bans U-turns at that spot.","stem":"A white square sign shows a U-shaped arrow with a red ring and slash. What does it mean?","ci":3,"o":[{"i":3,"s":null,"t":"Do not make a U-turn here"},{"i":0,"s":null,"t":"Do not turn left or right here"},{"i":1,"s":null,"t":"U-turns are allowed if no cars are near"}],"g":"no-u-turn","tier":"t1","nl":1},{"id":"q-2b-026","u":"signs-005","ut":"No U-Turn (square, black on white, red ring and slash): Do not make a U-turn here.","r":"Obey the ban and find another place to turn around.","stem":"You miss your street and reach a break in the median with a No U-Turn sign. Nothing is coming. What do you do?","ci":1,"o":[{"i":1,"s":null,"t":"Drive on and turn around at a legal place"},{"i":0,"s":null,"t":"Turn around right now, since the road is clear"},{"i":3,"s":null,"t":"Turn around only if no police car is in sight"}],"g":"no-u-turn","tier":"t2","nl":1},{"id":"q-2b-027","u":"signs-005","ut":"No U-Turn (square, black on white, red ring and slash): Do not make a U-turn here.","r":"No U-Turn bans only the turn that reverses your direction.","stem":"At a junction a sign shows a U-shaped arrow crossed out in red. Which move does it ban?","ci":0,"o":[{"i":0,"s":null,"t":"Turning around to go back the way you came"},{"i":1,"s":null,"t":"Turning left onto the cross street ahead"},{"i":2,"s":null,"t":"Turning right onto the cross street ahead"}],"g":"no-u-turn","tier":"t2","nl":1},{"id":"q-2b-030","u":"signs-006","ut":"No Left Turn (square, black on white, red ring and slash): Do not turn left here.","r":"Each turn ban covers only the turn it shows.","stem":"A No Left Turn sign stands at a four-way junction, and you "i":3,"s":null,"t":"It is a minimum, and driving below it is a violation"}],"g":"speed-limit","tier":"t2","nl":1},{"id":"q-2b-037","u":"signs-009","ut":"One Way (rectangle, white on black): Traffic moves only in the arrow direction.","r":"On a one-way road all vehicles go in the arrow's direction.","stem":"A black rectangle shows a white arrow and the words ONE WAY. What does it mean?","ci":0,"o":[{"i":0,"s":null,"t":"Traffic moves only in the direction of the arrow"},{"i":1,"s":null,"t":"Cars follow the arrow, but cyclists may ride the other way"},{"i":2,"s":null,"t":"You may drive against the arrow if you go slowly"}],"g":"one-way","tier":"t1","nl":1},{"id":"q-2b-038","u":"signs-009","ut":"One Way (rectangle, white on black): Traffic moves only in the arrow direction.","r":"Use only the arrow direction, even when it means a longer route.","stem":"You parked on a one-way street and now want to go back the way you came. What do you do?","ci":2,"o":[{"i":2,"s":null,"t":"Go with the arrow and loop back by another street"},{"i":0,"s":null,"t":"Pull out against the arrow if no cars are in sight"},{"i":1,"s":null,"t":"Make a U-turn across the street to face the other way"}],"g":"one-way","tier":"t2","nl":1},{"id":"q-2b-040","u":"signs-010","ut":"Keep Right (rectangle, black on white): Pass the island or obstruction on its right side.","r":"A Keep Right sign sends you around the island on its right.","stem":"A Keep Right sign stands on an island in the road. What does it tell you?","ci":1,"o":[{"i":1,"s":null,"t":"Pass the island on its right side"},{"i":0,"s":null,"t":"Pass on the left, because the arrow shows a lane shift"},{"i":2,"s":null,"t":"Stay in your lane, since the island is only a warning"}],"g":"keep-right","tier":"t1","nl":1},{"id":"q-2b-045","u":"signs-011","ut":"No Parking (rectangle, red P with slash on white): Do not park here.","r":"A No Parking sign limits parking and leaves the road open for driving.","stem":"A driver thinks the No Parking sign also bans driving down that street. Which statement is right?","ci":0,"o":[{"i":0,"s":null,"t":"It bans parking only, so you may still drive along it"},{"i":1,"s":null,"t":"It closes the whole street, so nobody may drive along it"},{"i":2,"s":null,"t":"It bans parking by trucks and buses only"}],"g":"no-parking","tier":"t2","nl":1},{"id":"q-2b-046","u":"signs-012","ut":"Railroad Crossing (crossbuck) (crossbuck, black on white): Stop for a train. Yield to the train when it is near.","r":"The crossbuck marks a rail crossing, so be ready to stop and yield to a train.","stem":"A white X-shaped sign reads RAILROAD CROSSING beside the road. What does it ask of you?","ci":1,"o":[{"i":1,"s":null,"t":"Be ready to stop, and yield to a train that is near"},{"i":0,"s":null,"t":"Always stop completely, whether or not a train is near"},{"i":2,"s":null,"t":"Honk your horn, then cross without stopping"}],"g":"railroad-crossbuck","tier":"t1","nl":1},{"id":"q-2b-049","u":"signs-013","ut":"No Turn On Red (rectangle, black on white): Wait for the green light before you turn.","r":"The sign cancels the usual right turn after a stop, so you wait for green.","stem":"A sign next to a traffic light reads NO TURN ON RED. What does it tell you?","ci":3,"o":[{"i":3,"s":null,"t":"Wait for the green light before you turn"},{"i":1,"s":null,"t":"Turn on red only if no walkers are crossing"},{"i":2,"s":null,"t":"The light is broken, so treat the corner as a stop sign"}],"g":"no-turn-on-red","tier":"t1","nl":1},{"id":"q-2b-051","u":"signs-013","ut":"No Turn On Red (rectangle, black on white): Wait for the green light before you turn.","r":"Turning on red is the normal rule after a stop, and a sign can remove it.","stem":"Which statement about turning right on a red light is correct?","ci":1,"o":[{"i":1,"s":null,"t":"It is allowed after a full stop, unless a sign bans it"},{"i":0,"s":null,"t":"It is never allowed anywhere in California"},{"i":3,"s":null,"t":"It is allowed only for the car at the front of the line"}],"g":"no-turn-on-red","tier":"t2","nl":1},{"id":"q-2b-054","u":"signs-014","ut":"Stop Here On Red (rectangle, black on white): Stop at this line when the signal is red.","r":"At a red signal you stay stopped until the signal gives you permission to go.","stem":"You stopped at the line for a red signal and want to drive straight on. When may you go?","ci":0,"o":[{"i":0,"s":null,"t":"When the light turns green"},{"i":2,"s":null,"t":"When the light has stayed red for a long time"},{"i":3,"s":null,"t":"When the car ahead of you drives off"}],"g":"stop-here-on-red","tier":"t2","nl":1},{"id":"q-2b-055","u":"signs-033","ut":"Do Not Pass (rectangle, black on white): Do not pass other vehicles here.","r":"A Do Not Pass sign bans overtaking in that section.","stem":"A white rectangular sign reads DO NOT PASS. What does it tell you?","ci":2,"o":[{"i":2,"s":null,"t":"Passing is banned in this stretch of road"},{"i":1,"s":null,"t":"Slow down and let other vehicles pass you"},{"i":3,"s":null,"t":"Passing is allowed only for vehicles driving very slowly"}],"g":"do-not-pass","tier":"t1","nl":1},{"id":"q-2b-058","u":"signs-034","ut":"A No Bicycles sign means bicycles are not allowed here; still watch for riders.","r":"A slashed bicycle bans bicycles from the road it stands on.","stem":"A square white sign shows a bicycle with a red ring and slash. What does it mean?","ci":2,"o":[{"i":2,"s":null,"t":"Bicycles are not allowed here"},{"i":1,"s":null,"t":"Watch for bicycles crossing ahead"},{"i":3,"s":null,"t":"Bicycles must ride on the sidewalk here"}],"g":"no-bicycles","tier":"t1","nl":1},{"id":"q-2b-061","u":"signs-035","ut":"A No Pedestrians sign means people on foot are not allowed here; still watch for them.","r":"A slashed walking figure bans people on foot from that road.","stem":"A square white sign shows a walking figure with a red ring and slash. What does it mean?","ci":3,"o":[{"i":3,"s":null,"t":"People on foot are not allowed here"},{"i":0,"s":null,"t":"Crossing is allowed at this exact spot"},{"i":2,"s":null,"t":"A green light is needed before anyone may cross"}],"g":"no-pedestrians","tier":"t1","nl":1},{"id":"q-2b-062","u":"signs-035","ut":"A No Pedestrians sign means people on foot are not allowed here; still watch for them.","r":"A walking ban does not remove your duty to take care.","stem":"You drive on a road with a No Pedestrians sign and see a person walking at the edge. What do you do?","ci":2,"o":[{"i":2,"s":null,"t":"Slow down and pass with care; people may be there"},{"i":0,"s":null,"t":"Drive on as usual, since nobody should be there"},{"i":3,"s":null,"t":"Stop in your lane and wait for the walker to leave"}],"g":"no-pedestrians","tier":"t2","nl":1},{"id":"q-2b-079","u":"signs-049","ut":"White edge line (road drawing, white or yellow paint): The road edges. Stay between them.","r":"A white edge line shows where the road ends, so you stay between the edge lines.","stem":"A solid white line is painted next to the shoulder. What does it show?","ci":3,"o":[{"i":3,"s":null,"t":"Where the roadway ends, so you stay between the edge lines"},{"i":0,"s":null,"t":"The center of a two-way road, which you should keep right of"},{"i":1,"s":null,"t":"A lane kept for bicycles and walkers only"}],"g":"white-edge-line","tier":"t1","nl":1},{"id":"q-2b-082","u":"signs-050","ut":"Stop before the crosswalk line and wait until everyone has crossed.","r":"A crosswalk shows where people cross, and you stop before it for them.","stem":"Wide white bars are painted across the road ahead. What do they mark?","ci":3,"o":[{"i":3,"s":null,"t":"A crosswalk that needs you to stop for people"},{"i":0,"s":null,"t":"A stop line for vehicles that has no link to walkers"},{"i":1,"s":null,"t":"A place where you may park briefly while you shop"}],"g":"crosswalk","tier":"t1","nl":1},{"id":"q-2b-084","u":"signs-050","ut":"Stop before the crosswalk line and wait until everyone has crossed.","r":"A marked crosswalk gives every person on foot the right to cross safely.","stem":"At a marked crosswalk with no traffic light, who must you stop for?","ci":2,"o":[{"i":2,"s":null,"t":"Every person on foot who is crossing there"},{"i":0,"s":null,"t":"Every child and older walker who is crossing there"},{"i":1,"s":null,"t":"Every walker who is already past the middle of the road"}],"g":"crosswalk","tier":"t2","nl":1},{"id":"q-2b-085","u":"signs-051","ut":"Stop line (road drawing, white or yellow paint): Stop with your front wheels behind this line.","r":"The stop line is where the front of your car must wait.","stem":"A wide white line crosses your lane before an intersection. Where do your front wheels stop?","ci":2,"o":[{"i":2,"s":null,"t":"Behind the line, never over it"},{"i":1,"s":null,"t":"Just past the line, where you can see better"},{"i":3,"s":null,"t":"Halfway across it, to show you have stopped"}],"g":"stop-line","tier":"t1","nl":1},{"id":"q-2b-087","u":"signs-051","ut":"Stop line (road drawing, white or yellow paint): Stop with your front wheels behind this line.","r":"The line comes first, so you stop there and keep the crosswalk clear.","stem":"At a stop sign you see a white stop line, then a crosswalk beyond it. Where do you stop?","ci":0,"o":[{"i":0,"s":null,"t":"At the stop line, which is before the crosswalk"},{"i":1,"s":null,"t":"On the crosswalk, since the line is only for trucks"},{"i":3,"s":null,"t":"Between the line and the crosswalk, at the middle"}],"g":"stop-line","tier":"t2","nl":1},{"id":"q-2b-093","u":"signs-053","ut":"Red curb (curb, red): No stopping, standing or parking.","r":"Red means no stopping, while yellow allows stopping for loading.","stem":"A driver says that red and yellow curbs both let you stop to drop off. Which is right?","ci":1,"o":[{"i":1,"s":null,"t":"Yellow allows brief loading; red allows no stop at all"},{"i":0,"s":null,"t":"Both allow a short stop, but yellow is for trucks only"},{"i":2,"s":null,"t":"Red allows a short stop; yellow allows no stop"}],"g":"curb-red","tier":"t2","nl":1},{"id":"q-2b-094","u":"signs-054","ut":"Yellow curb (curb, yellow): Load or unload for a short time only. Check the posted time.","r":"A yellow curb is for loading and unloading, with a time limit.","stem":"What does a yellow curb allow?","ci":0,"o":[{"i":0,"s":null,"t":"Loading or unloading for a short time only"},{"i":2,"s":null,"t":"Overnight parking for people who live nearby"},{"i":3,"s":null,"t":"Parking only for drivers with a disabled placard"}],"g":"curb-yellow","tier":"t1","nl":1},{"id":"q-2b-096","u":"signs-054","ut":"Yellow curb (curb, yellow): Load or unload for a short time only. Check the posted time.","r":"Yellow is the curb for loading and unloading.","stem":"You want to unload boxes of freight at the curb. Which color suits that job?","ci":3,"o":[{"i":3,"s":null,"t":"Yellow, which allows loading or unloading"},{"i":0,"s":null,"t":"White, which allows freight as well as people"},{"i":1,"s":null,"t":"Green, which allows loading time for deliveries"}],"g":"curb-yellow","tier":"t3","nl":1},{"id":"q-2b-097","u":"signs-055","ut":"White curb (curb, white): Stop only to drop off or pick up passengers, for a short time (about 5 minutes).","r":"A white curb is for short stops to let passengers on or off.","stem":"A white curb is in front of a building. What may you do there?","ci":3,"o":[{"i":3,"s":null,"t":"Stop briefly to drop off or pick up passengers"},{"i":0,"s":null,"t":"Park for as long as you like during the day"},{"i":2,"s":null,"t":"Wait parked for a friend for an hour or more"}],"g":"curb-white","tier":"t1","nl":1},{"id":"q-2b-100","u":"signs-056","ut":"Green curb (curb, green): Park for a short time. Check the posted time limit.","r":"A green curb allows short parking, and the posted limit sets the time.","stem":"You park at the green curb pictured. What decides how long you may stay?","ci":0,"o":[{"i":0,"s":null,"t":"The time posted on the sign or curb"},{"i":1,"s":null,"t":"A fixed 15 minutes that applies at every green curb"},{"i":2,"s":null,"t":"A fixed 30 minutes that applies at every green curb"}],"g":"curb-green","tier":"t1","nl":1},{"id":"q-2b-101","u":"signs-056","ut":"Green curb (curb, green): Park for a short time. Check the posted time limit.","r":"A green curb means short parking, so you move before the limit.","stem":"You park at a green curb for an errand. A sign shows a time limit, and your errand will run longer. What do you do?","ci":1,"o":[{"i":1,"s":null,"t":"Move the car before the limit ends, or park elsewhere"},{"i":0,"s":null,"t":"Stay, since green means free parking all day"},{"i":3,"s":null,"t":"Leave it, since the limit applies only to other drivers"}],"g":"curb-green","tier":"t2","nl":1},{"id":"q-2b-103","u":"signs-057","ut":"Blue curb (curb, blue): Parking for a disabled person with a placard or plate only.","r":"A blue curb is kept for people with a disabled placard or plate.","stem":"What does a blue curb mean?","ci":3,"o":[{"i":3,"s":null,"t":"Parking only for a disabled person with a placard or plate"},{"i":0,"s":null,"t":"Parking for electric vehicles that are plugged in to charge"},{"i":1,"s":null,"t":"Parking for a short time, with a limit posted on a sign"}],"g":"curb-blue","tier":"t1","nl":1},{"id":"q-2b-106","u":"signs-058","ut":"Roundabout (rectangle, white on black): Traffic circles one way around an island. Yield to traffic already inside, then enter.","r":"You yield to traffic already inside and enter when there is a gap.","stem":"You approach a roundabout. Who goes first?","ci":3,"o":[{"i":3,"s":null,"t":"Traffic that is already inside the circle"},{"i":0,"s":null,"t":"The car that reaches the yield line first"},{"i":2,"s":null,"t":"Larger vehicles, such as trucks and buses"}],"g":"roundabout","tier":"t2","nl":1},{"id":"q-2b-109","u":"signs-059","ut":"Enter a bike lane only to turn or park where allowed, and expect cyclists in it.","r":"Cars may use a bike lane only to turn or park where it is allowed.","stem":"A sign shows a bicycle and the words BIKE LANE. What may drivers do in that lane?","ci":2,"o":[{"i":2,"s":null,"t":"Enter it only to turn or to park where allowed"},{"i":0,"s":null,"t":"Drive in it to pass slow traffic in the next lane"},{"i":1,"s":null,"t":"Use it as an extra lane when traffic is heavy"}],"g":"bike-lane","tier":"t1","nl":1},{"id":"q-2b-111","u":"signs-059","ut":"Enter a bike lane only to turn or park where allowed, and expect cyclists in it.","r":"A bike lane is not a way around stopped traffic.","stem":"A bus is stopped ahead in your lane. What may you do about the bike lane beside it?","ci":0,"o":[{"i":0,"s":null,"t":"Stay out of it and wait behind the bus"},{"i":2,"s":null,"t":"Stay out of it unless the driver behind you honks"},{"i":3,"s":null,"t":"Wait a minute, then use it if the bus has not moved"}],"g":"bike-lane","tier":"t2","nl":1},{"id":"q-2b-118","u":"signs-062","ut":"Added Lane (diamond, black on yellow): A new lane begins on the right. You may use it.","r":"An added lane sign shows that a new lane will open for your use.","stem":"A yellow diamond shows a lane line splitting into two. What does it tell you?","ci":2,"o":[{"i":2,"s":null,"t":"A new lane begins on the right, and you may use it"},{"i":0,"s":null,"t":"A lane ends ahead, so you must merge now"},{"i":1,"s":null,"t":"Two roads join ahead, and cars merge from the right"}],"g":"added-lane","tier":"t1","nl":1},{"id":"q-2b-120","u":"signs-062","ut":"Added Lane (diamond, black on yellow): A new lane begins on the right. You may use it.","r":"Added Lane gives you more road, and Lane Ends takes it away.","stem":"How does an Added Lane sign differ from a Lane Ends sign?","ci":3,"o":[{"i":3,"s":null,"t":"Added Lane: a lane opens for you. Lane Ends: you must merge"},{"i":0,"s":null,"t":"Added Lane: you must merge. Lane Ends: a lane opens for you"},{"i":1,"s":null,"t":"Both tell you to merge soon, and only the picture differs"}],"g":"added-lane","tier":"t3","nl":1},{"id":"q-2b-124","u":"signs-064","ut":"Expect cyclists in the middle of a sharrow lane; slow down and pass only with room.","r":"A sharrow tells drivers to expect cyclists in the middle of the lane.","stem":"A bicycle symbol with two chevrons above it is painted in the middle of a traffic lane. What does it mean?","ci":3,"o":[{"i":3,"s":null,"t":"Bikes and cars share it; expect riders in the middle"},{"i":0,"s":null,"t":"The lane is for bicycles only, and cars must stay out"},{"i":2,"s":null,"t":"Riders must stay at the far edge of the lane"}],"g":"sharrow","tier":"t1","nl":1},{"id":"q-2b-127","u":"signs-066","ut":"No Trucks (rectangle, black truck with red slash on white): Trucks may not use this road.","r":"A slashed truck sign bans trucks from that road.","stem":"A square white sign shows a truck with a red slash. What does it tell you?","ci":2,"o":[{"i":2,"s":null,"t":"Trucks may not use this road"},{"i":0,"s":null,"t":"Trucks must stay in the right lane here"},{"i":3,"s":null,"t":"Trucks may use this road only at night"}],"g":"no-trucks","tier":"t1","nl":1},{"id":"q-2b-128","u":"signs-066","ut":"No Trucks (rectangle, black truck with red slash on white): Trucks may not use this road.","r":"A posted ban on trucks beats a GPS route.","stem":"You drive a delivery truck, and your GPS sends you down a road with a No Trucks sign. What do you do?","ci":0,"o":[{"i":0,"s":null,"t":"Take another route that trucks may use"},{"i":2,"s":null,"t":"Use the road only to reach the next junction, then turn off"},{"i":3,"s":null,"t":"Carry on, if the delivery is only a short one"}],"g":"no-trucks","tier":"t2","nl":1},{"id":"q-2b-129","u":"signs-066","ut":"No Trucks (rectangle, black truck with red slash on white): Trucks may not use this road.","r":"No Trucks is aimed at one vehicle type; Do Not Enter closes the way to all.","stem":"How does a No Trucks sign differ from a Do Not Enter sign?","ci":0,"o":[{"i":0,"s":null,"t":"No Trucks bans trucks only; Do Not Enter bans all vehicles"},{"i":2,"s":null,"t":"Both ban only trucks, one by day and one by night"},{"i":3,"s":null,"t":"No Trucks is for freeways, and Do Not Enter is for streets"}],"g":"no-trucks","tier":"t2","nl":1},{"id":"q-3-001","u":"p15_changes-003","ut":"Only a few named cities in a state pilot, such as Los Angeles and San Francisco, may run speed-camera programs.","r":"Long Beach is one of the six named jurisdictions allowed to run speed cameras in the pilot.","stem":"Only a short list of named cities may run California's speed-camera pilot. Which city is on that list?","ci":1,"o":[{"i":1,"s":"Long Beach","t":"Long Beach"},{"i":2,"s":"Bakersfield","t":"Bakersfield"},{"i":3,"s":"Riverside","t":"Riverside"}],"g":null,"tier":"t1","nl":0},{"id":"q-3-002","u":"p15_changes-003","ut":"Only a few named cities in a state pilot, such as Los Angeles and San Francisco, may run speed-camera programs.","r":"The law names its jurisdictions, so a town outside the list cannot start a speed-camera program.","stem":"The council of a mid-sized town wants speed cameras on its main street. What does the pilot law allow?","ci":0,"o":[{"i":0,"s":null,"t":"Only cities named in the law may run one"},{"i":2,"s":null,"t":"School zones qualify a town to run one"},{"i":3,"s":null,"t":"A town may run one once it posts warning signs"}],"g":null,"tier":"t2","nl":1},{"id":"q-3-003","u":"p15_changes-003","ut":"Only a few named cities in a state pilot, such as Los Angeles and San Francisco, may run speed-camera programs.","r":"The pilot covers a few cities named in the law, not the whole state.","stem":"A friend says any California city can run speed cameras because Los Angeles does. Which reply is accurate?","ci":3,"o":[{"i":3,"s":null,"t":"Only a short list of named cities is covered"},{"i":1,"s":null,"t":"Every city is covered once its council votes"},{"i":2,"s":null,"t":"Cities with school zones are all covered"}],"g":null,"tier":"t3","nl":1},{"id":"q-3-004","u":"s5-09","ut":"Turn signals must be activated at least 100 feet before turning.","r":"The signal must be given continuously during the last 100 feet before the turn.","stem":"How far before a turn must your turn signal be on?","ci":2,"o":[{"i":2,"s":"100 feet","t":"100 feet"},{"i":0,"s":"50 feet","t":"50 feet"},{"i":3,"s":"200 feet","t":"200 feet"}],"g":null,"tier":"t1","nl":0},{"id":"q-3-005","u":"s5-09","ut":"Turn signals must be activated at least 100 feet before turning.","r":"A signal must run during the last 100 feet, so switching it on now and leaving it on is right.","stem":"You are about 150 feet from your right turn with a car close behind you. Your signal is off. What do you do?","ci":0,"o":[{"i":0,"s":null,"t":"Turn the signal on now and keep it on"},{"i":2,"s":null,"t":"Skip it, since your brake lights will show"},{"i":3,"s":null,"t":"Give a hand signal when you reach the corner"}],"g":null,"tier":"t2","nl":1},{"id":"q-3-007","u":"s5-10","ut":"Signal before every lane change, including on freeways where signal should be maintained for at least 5 seconds.","r":"On a freeway, keep the signal on for at least 5 seconds before you move over.","stem":"What is the minimum time your signal should blink before a freeway lane change?","ci":1,"o":[{"i":1,"s":"5 seconds","t":"5 seconds"},{"i":0,"s":"3 seconds","t":"3 seconds"},{"i":2,"s":"2 seconds","t":"2 seconds"}],"g":null,"tier":"t1","nl":0},{"id":"q-3-009","u":"s5-10","ut":"Signal before every lane change, including on freeways where signal should be maintained for at least 5 seconds.","r":"Every lane change needs a signal; on a freeway you hold it for at least 5 seconds.","stem":"Which statement about signaling lane changes is right?","ci":0,"o":[{"i":0,"s":null,"t":"Signal before every lane change, and longer at freeway speed"},{"i":2,"s":null,"t":"Signal for lane changes only when a vehicle is beside you"},{"i":3,"s":null,"t":"Signal for 5 seconds on every road, whatever the speed"}],"g":null,"tier":"t2","nl":1},{"id":"q-3-010","u":"s5-11","ut":"Continue signaling even when no other vehicles are visible.","r":"Keep signaling even when you see no other vehicles, since someone may be out of sight.","stem":"Which signaling habit is the safe one?","ci":3,"o":[{"i":3,"s":null,"t":"Signal every time, even if no one is in view"},{"i":0,"s":null,"t":"Signal only when another car is in view"},{"i":2,"s":null,"t":"Signal only at a corner with a stop sign"}],"g":null,"tier":"t1","nl":1},{"id":"q-3-012","u":"s5-11","ut":"Continue signaling even when no other vehicles are visible.","r":"People you cannot see may act on your signal, so Dana's habit is the safe one.","stem":"Dana signals every turn. Eli signals only when he sees another car. Who has the safer habit, and why?","ci":0,"o":[{"i":0,"s":null,"t":"Dana, because unseen road users may rely on the signal"},{"i":1,"s":null,"t":"Eli, because a signal confuses drivers who are not involved"},{"i":2,"s":null,"t":"Both, since signaling is a personal choice"}],"g":null,"tier":"t2","nl":1},{"id":"q-3-013","u":"s6-19","ut":"A yield line consists of solid white triangles marking where approaching vehicles must stop or yield the right-of-way.","r":"A yield line is made of solid white triangles across the lane.","stem":"What does a yield line look like on the road?","ci":2,"o":[{"i":2,"s":null,"t":"A row of solid white triangles across the lane"},{"i":0,"s":null,"t":"A solid white bar across the lane"},{"i":3,"s":null,"t":"A pair of yellow stripes along the curb"}],"g":null,"tier":"t1","nl":1},{"id":"q-3-015","u":"s6-19","ut":"A yield line consists of solid white triangles marking where approaching vehicles must stop or yield the right-of-way.","r":"White triangles across the lane show where to yield.","stem":"Which marking is a yield line rather than a crosswalk or a stop line?","ci":0,"o":[{"i":0,"s":null,"t":"Solid white triangles across the lane"},{"i":2,"s":null,"t":"A single solid white bar across the lane"},{"i":3,"s":null,"t":"Yellow triangles along the lane edge"}],"g":null,"tier":"t2","nl":1},{"id":"q-3-019","u":"s6_p11_roadway-011","ut":"On a divided or multilane highway, you need not stop for a school bus on the opposite side.","r":"On a divided highway you need not stop for a school bus on the other roadway.","stem":"A school bus has stopped with its red lights flashing. In which case do you not have to stop?","ci":2,"o":[{"i":2,"s":null,"t":"A divided highway, with the bus on the far roadway"},{"i":0,"s":null,"t":"A two-lane road with parked cars along it"},{"i":1,"s":null,"t":"The lane right behind the bus, going its way"}],"g":null,"tier":"t1","nl":1},{"id":"q-3-021","u":"s6_p11_roadway-011","ut":"On a divided or multilane highway, you need not stop for a school bus on the opposite side.","r":"On a road with no median and one lane each way, traffic from both directions must stop.","stem":"A school bus has red lights flashing on the other side of the road. In which case must you still stop?","ci":2,"o":[{"i":2,"s":null,"t":"The road has one lane each way and no median"},{"i":0,"s":null,"t":"The bus is on the far roadway of a divided highway"},{"i":3,"s":null,"t":"The bus is at least 200 feet away on a wide highway"}],"g":null,"tier":"t2","nl":1},{"id":"q-3-022","u":"s6_p11_run2-001","ut":"When a school bus stop arm extends, stop and stay stopped until the children are clear.","r":"The arm swings out from the side to block passing vehicles while children board or leave.","stem":"What does a school bus stop arm do?","ci":0,"o":[{"i":0,"s":null,"t":"It makes traffic stop while children board or leave"},{"i":2,"s":null,"t":"It signals that the bus is turning right shortly"},{"i":3,"s":null,"t":"It shows the bus is out of service for the day"}],"g":null,"tier":"t1","nl":1},{"id":"q-3-023","u":"s6_p11_run2-001","ut":"When a school bus stop arm extends, stop and stay stopped until the children are clear.","r":"Stay stopped until the children are clear and the arm and lights stop.","stem":"You are stopped behind a school bus whose stop arm is out. A child steps off the curb to cross. When may you drive ol zone is set at exactly 15 mph"},{"i":2,"s":null,"t":"No school zone is ever posted below 20 mph"}],"g":null,"tier":"t3","nl":1},{"id":"q-3-052","u":"s7_p11_run2-001","ut":"Obey a crossing guard's directions every time; they are trained to direct traffic safely.","r":"Crossing guards are trained to direct traffic safely, so obey them at all times.","stem":"How should a driver treat a crossing guard's directions near a school?","ci":0,"o":[{"i":0,"s":null,"t":"Follow them every time, whatever else you see"},{"i":1,"s":null,"t":"Follow them only when a police officer is near"},{"i":2,"s":null,"t":"Follow them only if no traffic light is working"}],"g":null,"tier":"t1","nl":1},{"id":"q-3-054","u":"s7_p11_run2-001","ut":"Obey a crossing guard's directions every time; they are trained to direct traffic safely.","r":"The crossing guard is trained to direct traffic, so the guard's direction is the one to obey.","stem":"At a school crossing a parent waves you through while the crossing guard holds up a stop sign. Whom do you follow?","ci":2,"o":[{"i":2,"s":null,"t":"The guard, who is trained for the job"},{"i":0,"s":null,"t":"The parent, since a wave means go"},{"i":3,"s":null,"t":"The car ahead, since it is in line"}],"g":null,"tier":"t2","nl":1},{"id":"q-3-055","u":"s7_p11_run3-006","ut":"A school bus flashing yellow lights will stop soon. Slow down and get ready to stop.","r":"Yellow flashers mean the bus is preparing to stop, so slow down and prepare to stop.","stem":"What do yellow flashing lights on a school bus warn?","ci":1,"o":[{"i":1,"s":null,"t":"The bus will stop soon to let children off"},{"i":0,"s":null,"t":"The bus has stopped and children are crossing"},{"i":3,"s":null,"t":"The driver is inviting you to pass"}],"g":null,"tier":"t1","nl":1},{"id":"q-3-056","u":"s7_p11_run3-006","ut":"A school bus flashing yellow lights will stop soon. Slow down and get ready to stop.","r":"Yellow lights mean the bus is about to stop, so slow down and prepare to halt.","stem op soon. Slow down and get ready to stop.","r":"Yellow flashers mean the bus is preparing to stop, so slow down and get ready to stop.","stem":"A bus ahead of you starts flashing yellow lights. What may happen next, and what do you do?","ci":2,"o":[{"i":2,"s":null,"t":"It will stop for children, so slow down and be ready"},{"i":0,"s":null,"t":"It will turn, so stay close behind and follow it"},{"i":3,"s":null,"t":"It is out of service, so pass it when the road is clear"}],"g":null,"tier":"t2","nl":1},{"id":"q-3-093","u":"s7_p11_run3-006","ut":"A school bus flashing yellow lights will stop soon. Slow down and get ready to stop.","r":"Yellow flashers on a bus show that it is about to stop to let children off.","stem":"A driver treats a bus's yellow flashers as a turn signal and passes. Where is the mistake?","ci":0,"o":[{"i":0,"s":null,"t":"The lights warn of a coming stop, not a turn"},{"i":2,"s":null,"t":"The lights mean the bus is out of service"},{"i":3,"s":null,"t":"The lights mean the bus is stopped and loading"}],"g":null,"tier":"t2","nl":1},{"id":"q-3-094","u":"s7_p11_run3-008","ut":"When a school bus shows red flashing lights, stop; children are boarding or leaving the bus.","r":"The driver operates the red lights whenever the bus is stopped to load or unload pupils.","stem":"When does a school bus driver use the red flashing lights?","ci":1,"o":[{"i":1,"s":null,"t":"Whenever the bus stops to load or unload pupils"},{"i":0,"s":null,"t":"Whenever the bus is moving slowly along its route"},{"i":2,"s":null,"t":"Only when the bus is parked in the school lot"}],"g":null,"tier":"t1","nl":1},{"id":"q-3-095","u":"s7_p11_run3-008","ut":"When a school bus shows red flashing lights, stop; children are boarding or leaving the bus.","r":"Red flashing lights mean children are boarding or leaving, so stop.","stem":"A bus ahead pulls to the curb and its red lights begin flashing. No children are visible yet. What do you do?","ci":3,"o":[{"i":3,"s":null,"t":"Stop, since child

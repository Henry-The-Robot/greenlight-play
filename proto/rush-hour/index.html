<script>
'use strict';
/* RUSH HOUR v5 (card RH5a, Kyle played v4a on 2026-10-11: "The game is mixing together too many mechanics now"). prototypes/DESIGN.md "v5".
 ONE mechanic: three controls (tap a lane = change lane, hold = stop, swipe = turn) and a road that holds only situations. No teach cards, no questions on the road, no lane answer signs, no coin pickups.
 Wrong but safe = a ticket (siren, pulled over, a citation, a big coin count-down). Dangerous = a crash (the impact is seen; a person is never hit: a near miss stops the car short and counts as a crash),
 then a police collision report, one heart, back to the checkpoint. Every situation must be passed once (saved list); all passed = YOU WIN, Free Play is COMING SOON.
 Checkpoints (after each stage, every 8 to 10 situations): three multiple-choice questions on the core C facts (bank text verbatim, explained only on a miss), a 15 s placeholder ad, a faster stage.
 Built from: the v4a code (rh2.html helpers, audio synth, world drawing and props are kept); Temple Run / Subway Surfers (tap lane, swipe turn that returns to the straight view);
 the pseudo-3D road of Jake Gordon's "javascript-racer"; the fixed-step loop of Glenn Fiedler, "Fix Your Timestep"; Wordle-style share squares. All numbers are ours and tuned by bots (check.js), not by a person. */

const W=390,CX=195,HOR=240,Z1=40,SF=.28,PX=34,LN=3.2,DT=1/60,GAP=30,TEACH_MAX=6,TEACH_MIN=.7,PRE=1.5,FW=.4,CRAWL=2.5,VQ=15;
let H=844,GY=700,ZN=-9.5;   /* ZN: the nearest ground distance that still reaches the bottom edge of the canvas */   /* logical height: 664 to 844, set by resize() from the window shape, so a phone browser with a toolbar still draws at full width and size */
const Q=new URLSearchParams(location.search);
const DEV=Q.get('dev')==='1';
const TS=DEV?Math.max(.25,Math.min(8,+Q.get('ts')||1)):1;
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rnd=mul((Date.now()%999983)+1);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return 1-(1-t)**3};
const back=t=>{t=clamp(t,0,1);return 1+2.8*(t-1)**3+1.8*(t-1)**2};
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const BC=['#2f80ed','#ff8a00','#e84393'];
const cv=document.getElementById('c'),cx=cv.getContext('2d');
/* The logical canvas is always 390 wide and 664 to 844 tall. A phone browser with a toolbar is about 390x664: the canvas then fills it at scale 1,
   instead of shrinking a fixed 390x844 picture to 79 percent (the text would be 21 percent smaller). Bottom things hang from H, so nothing is cut. */
function resize(){const vw=innerWidth,vh=innerHeight;H=clamp(Math.round(W*vh/vw),664,844);GY=H-144;ZN=Z1*(GY-HOR)/(H-HOR)-Z1;
 const s=Math.min(vw/W,vh/H),d=Math.min(devicePixelRatio||1,2.5);
 cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);cx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
 if(typeof relayout==='function')relayout()}
addEventListener('resize',resize);

/* ---------- projection and drawing helpers ---------- */
const gg=z=>Z1/(Z1+z),sc=z=>SF+(1-SF)*gg(z),yy=z=>HOR+(GY-HOR)*gg(z);
function gq(x1,x2,za,zb,col){za=Math.max(za,ZN);if(zb<=za)return;const sa=sc(za),sb=sc(zb),ya=yy(za),yb=yy(zb);
 cx.fillStyle=col;cx.beginPath();cx.moveTo(CX+x1*PX*sa,ya);cx.lineTo(CX+x2*PX*sa,ya);cx.lineTo(CX+x2*PX*sb,yb);cx.lineTo(CX+x1*PX*sb,yb);cx.fill()}
function sideQuad(xm,za,zb,h0,h1,col){const sa=sc(za),sb=sc(zb),ya=yy(za),yb=yy(zb),xa=CX+xm*PX*sa,xb=CX+xm*PX*sb;
 cx.fillStyle=col;cx.beginPath();cx.moveTo(xa,ya-h0*PX*sa);cx.lineTo(xb,yb-h0*PX*sb);cx.lineTo(xb,yb-h1*PX*sb);cx.lineTo(xa,ya-h1*PX*sa);cx.fill()}
function at(x,z,fn,a,rot){if(z<ZN+.5)return;const k=PX*sc(z);cx.save();cx.translate(CX+x*k,yy(z));cx.scale(k,k);
 if(a!==undefined&&a<1)cx.globalAlpha=Math.max(0,a);if(rot)cx.rotate(rot);fn();cx.restore()}
const at0=at;
/* meter-space shapes: origin ground centre, y up */
const rc=(x,y,w,h,c)=>{cx.fillStyle=c;cx.fillRect(x,-y-h,w,h)};
const ci=(x,y,r,c)=>{cx.fillStyle=c;cx.beginPath();cx.arc(x,-y,r,0,6.2832);cx.fill()};
const pg=(p,c)=>{cx.fillStyle=c;cx.beginPath();p.forEach((q,i)=>i?cx.lineTo(q[0],-q[1]):cx.moveTo(q[0],-q[1]));cx.closePath();cx.fill()};
const oc=(x,y,r,c)=>pg(Array.from({length:8},(_,i)=>{const a=(i+.5)*Math.PI/4;return[x+Math.cos(a)*r,y+Math.sin(a)*r]}),c);
function T(s,x,y,size,col,al,stroke){cx.font=`bold ${size}px ${FONT}`;cx.textAlign=al||'center';cx.textBaseline='middle';
 if(stroke){cx.lineWidth=stroke;cx.strokeStyle='rgba(0,0,0,.6)';cx.lineJoin='round';cx.strokeText(s,x,y)}cx.fillStyle=col;cx.fillText(s,x,y)}
function RR(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function wrapT(s,mw,sz){cx.font=`bold ${sz}px ${FONT}`;const L=[];let l='';
 for(const w of s.split(' ')){const n=l?l+' '+w:w;if(cx.measureText(n).width>mw&&l){L.push(l);l=w}else l=n}if(l)L.push(l);return L}
const mu=n=>1+.5*(Math.min(Math.max(n,1),7)-1);
/* ---------- audio: WebAudio synth, no files. Ported from the slice (game/src/audio/engine.ts, schedule.ts) ---------- */
const MK='greenlight.rush.muted',CK='greenlight.rush.calm';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let MUTED=store.get(MK)==='1',CALM=store.get(CK)==='1',AC=null,AE=null;
const m2hz=m=>440*Math.pow(2,(m-69)/12);
/* one note envelope: 0, ramp up, hold, ramp down; every ramp is anchored by a setValueAtTime (schedule.ts noteEnvelope) */
function noteEnv(p,t,hold,peak,att,rel){const a=Math.max(att,.008),h=Math.max(hold,a),r=Math.max(rel,.02);
 p.setValueAtTime(0,t);p.linearRampToValueAtTime(peak,t+a);p.setValueAtTime(peak,t+h);p.linearRampToValueAtTime(0,t+h+r);return t+h+r}
/* small dark reverb impulse: seeded noise through a one-pole low-pass (schedule.ts buildImpulse) */
function impulse(len,seed,decay,damp){let a=seed>>>0;const rn=()=>{a=(a+0x6d2b79f5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
 const o=new Float32Array(len);let y=0;for(let i=0;i<len;i++){y+=damp*(rn()*2-1-y);o[i]=y*Math.pow(1-i/len,decay)}return o}
/* the driving loop: 112 BPM, 8 bars, A minor (Am F C G Am F G Em). Stems: pad, bass, pulse always; drums from streak x2; lead from streak x3. */
const BPM=112,BEAT=60/BPM,BPB=4,LOOP_BEATS=32;
const CH=[{b:45,p:[57,60,64]},{b:41,p:[53,57,60]},{b:48,p:[55,60,64]},{b:43,p:[55,59,62]},{b:45,p:[57,60,64]},{b:41,p:[53,57,60]},{b:43,p:[55,59,62]},{b:40,p:[52,55,59]}];
const BASSP=[[0,.45,0,1],[.75,.2,0,.7],[1.5,.4,12,.8],[2,.45,0,.95],[2.75,.2,0,.7],[3.5,.4,7,.8]];  /* beat, length, semitones above the root, velocity */
const PULSEP=[[0,1,2,1,0,1,2,1],[2,1,0,1,2,1,0,2]],LEADP=[[0,1],[1.5,2],[2,1],[3,0]];
function buildScore(){const ev=[];CH.forEach((c,bar)=>{const b0=bar*BPB;
 c.p.forEach(m=>ev.push({s:'pad',b:b0,d:BPB,m,v:1}));
 BASSP.forEach(n=>ev.push({s:'bass',b:b0+n[0],d:n[1],m:c.b+n[2],v:n[3]}));
 const tn=c.p.map(m=>m+12);PULSEP[bar%2].forEach((pk,i)=>ev.push({s:'pulse',b:b0+i*.5,d:.4,m:tn[pk%3],v:i%2?.6:.85}));
 for(let k=0;k<4;k++){ev.push({s:'kick',b:b0+k,d:.2,m:0,v:1});ev.push({s:'hat',b:b0+k+.5,d:.05,m:0,v:k%2?.8:.55})}
 const ln=c.p.map(m=>m+24);LEADP.forEach(n=>ev.push({s:'lead',b:b0+n[0],d:.6,m:ln[n[1]%3],v:.9}))});
 ev.sort((a,b)=>a.b-b.b);return ev}
const VOICE={pad:{o:[['sawtooth',-7,1,1],['sawtooth',7,1,1]],pk:.05,at:.3,rl:.5,ov:.35,lp:1400},
 bass:{o:[['sine',0,1,1],['triangle',0,2,.22]],pk:.3,at:.015,rl:.12,ov:0,lp:900},
 pulse:{o:[['triangle',-4,1,1],['triangle',4,1,1]],pk:.085,at:.01,rl:.15,ov:0,lp:2600},
 lead:{o:[['square',0,1,1],['triangle',5,1,.5]],pk:.06,at:.01,rl:.2,ov:0,lp:2400}};
const STEMS=['pad','bass','pulse','drums','lead'],MUS=.7;   /* music level under the effects */
function makeEngine(ctx,live){
 const E={ctx,layer:0,low:false,on:false,t0:0,idx:0,iter:0,sc:buildScore(),timer:null,live};
 const now=ctx.currentTime;
 E.master=ctx.createGain();E.master.gain.setValueAtTime(live&&MUTED?0:.8,now);
 const comp=ctx.createDynamicsCompressor();comp.threshold.setValueAtTime(-14,now);comp.ratio.setValueAtTime(3,now);E.master.connect(comp);comp.connect(ctx.destination);
 E.sfx=ctx.createGain();E.sfx.gain.setValueAtTime(.9,now);E.sfx.connect(E.master);
 E.mgain=ctx.createGain();E.mgain.gain.setValueAtTime(0,now);E.mgain.connect(E.master);
 E.mlp=ctx.createBiquadFilter();E.mlp.type='lowpass';E.mlp.frequency.setValueAtTime(18000,now);E.mlp.Q.setValueAtTime(.7,now);E.mlp.connect(E.mgain);   /* the card low-pass */
 E.min=ctx.createGain();E.min.connect(E.mlp);
 const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.setValueAtTime(220,now);const cv2=ctx.createConvolver(),len=Math.max(1,Math.round(1.2*ctx.sampleRate)),ir=ctx.createBuffer(2,len,ctx.sampleRate);
 ir.getChannelData(0).set(impulse(len,7,3,.3));ir.getChannelData(1).set(impulse(len,11,3,.3));cv2.buffer=ir;
 const snd=ctx.createGain();snd.gain.setValueAtTime(.2,now);const wet=ctx.createGain();wet.gain.setValueAtTime(.3,now);E.min.connect(snd);snd.connect(hp);hp.connect(cv2);cv2.connect(wet);wet.connect(E.mlp);
 E.st={};for(const id of STEMS){const g=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime((VOICE[id]||{lp:16000}).lp,now);lp.connect(g);g.connect(E.min);
  g.gain.setValueAtTime(id==='drums'||id==='lead'?0:1,now);E.st[id]={g,lp}}
 const nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),nd=nb.getChannelData(0);let sd=12345;for(let i=0;i<nd.length;i++){sd=(Math.imul(sd,1664525)+1013904223)>>>0;nd[i]=sd/2147483648-1}E.nb=nb;
 E.voice=(ev,time)=>{const t=Math.max(time,ctx.currentTime),st=E.st[ev.s]&&E.st[ev.s].lp;
  if(ev.s==='kick'){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);const e=noteEnv(g.gain,t,.02,.55*ev.v,.004,.16);o.connect(g);g.connect(E.st.drums.g);o.start(t);o.stop(e+.03);return}
  if(ev.s==='hat'){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nb;f.type='highpass';f.frequency.setValueAtTime(7000,t);const e=noteEnv(g.gain,t,.01,.16*ev.v,.002,.05);s.connect(f);f.connect(g);g.connect(E.st.drums.g);s.start(t);s.stop(e+.03);return}
  const vo=VOICE[ev.s],env=ctx.createGain(),end=noteEnv(env.gain,t,ev.d*BEAT+vo.ov,vo.pk*ev.v,vo.at,vo.rl);env.connect(st);
  for(const o of vo.o){const os=ctx.createOscillator();os.type=o[0];os.frequency.setValueAtTime(m2hz(ev.m)*o[2],t);os.detune.setValueAtTime(o[1],t);
   if(o[3]===1)os.connect(env);else{const og=ctx.createGain();og.gain.setValueAtTime(o[3],t);os.connect(og);og.connect(env)}os.start(t);os.stop(end+.05)}};
 /* look-ahead scheduler: a timer wakes up often, every note is placed on the AUDIO clock ahead of time (Chris Wilson, "A Tale of Two Clocks") */
 E.pump=(horizon)=>{const sc=E.sc;for(let n=0;n<4000;n++){const ev=sc[E.idx],time=E.t0+(E.iter*LOOP_BEATS+ev.b)*BEAT;if(time>=horizon)break;
  if(time+ev.d*BEAT+2>=ctx.currentTime)E.voice(ev,time);E.idx++;if(E.idx===sc.length){E.idx=0;E.iter++}}};
 E.layerGain=()=>({drums:E.layer>=1?1:0,lead:E.layer>=2?1:0});
 E.start=(offT)=>{if(E.on)return;E.on=true;E.idx=0;E.iter=0;const t=ctx.currentTime;E.t0=(offT!==undefined?offT:t+.12);
  const lg=E.layerGain();for(const id of['drums','lead']){E.st[id].g.gain.cancelScheduledValues(t);E.st[id].g.gain.setValueAtTime(lg[id],t)}
  E.mgain.gain.cancelScheduledValues(t);E.mgain.gain.setValueAtTime(0,t);E.mgain.gain.linearRampToValueAtTime(MUS*(E.low?.55:1),t+(live?.6:.05));
  if(E.low)E.mlp.frequency.setValueAtTime(650,t);
  if(live){E.pump(t+.4);E.timer=setInterval(()=>E.pump(ctx.currentTime+.4),80)}};
 E.stop=(fade)=>{if(!E.on)return;E.on=false;const t=ctx.currentTime;E.mgain.gain.cancelScheduledValues(t);E.mgain.gain.setTargetAtTime(0,t,fade/3);if(E.timer){clearInterval(E.timer);E.timer=null}};
 /* streak layers join at the next bar line, so they land on the beat */
 E.setLayer=(n)=>{if(n===E.layer)return;E.layer=n;if(!E.on)return;const bar=BEAT*BPB,k=Math.ceil((ctx.currentTime+.1-E.t0)/bar),at=Math.max(ctx.currentTime,E.t0+k*bar),lg=E.layerGain();
  for(const id of['drums','lead']){const p=E.st[id].g.gain;p.cancelScheduledValues(at);p.setTargetAtTime(lg[id],at,.2)}};
 /* a teach card or a miss card is open: the music goes muffled and softer */
 E.setLow=(on)=>{if(on===E.low)return;E.low=on;const t=ctx.currentTime;E.mlp.frequency.cancelScheduledValues(t);E.mlp.frequency.setTargetAtTime(on?650:18000,t,.12);
  if(E.on){E.mgain.gain.cancelScheduledValues(t);E.mgain.gain.setTargetAtTime(MUS*(on?.55:1),t,.15)}};
 return E}
/* sound effects: short synth cues on their own bus (not muffled). tone() is the slice's cue voice. */
function tone(E,t,midi,hold,peak,type,lp,att,rel,part){const c=E.ctx,env=c.createGain(),f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(lp,t);
 const end=noteEnv(env.gain,t,hold,peak,att,rel);env.connect(f);f.connect(E.sfx);
 for(const [ratio,w] of part>0?[[1,1],[2,part]]:[[1,1]]){const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(m2hz(midi)*ratio,t);
  if(w===1)o.connect(env);else{const og=c.createGain();og.gain.setValueAtTime(w,t);o.connect(og);og.connect(env)}o.start(t);o.stop(end+.05)}}
function sweep(E,t,f0,f1,dur,type,peak,lp){const c=E.ctx,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
 f.type='lowpass';f.frequency.setValueAtTime(lp,t);const end=noteEnv(g.gain,t,dur*.3,peak,.01,dur*.7);o.connect(f);f.connect(g);g.connect(E.sfx);o.start(t);o.stop(end+.05)}
function noise(E,t,dur,peak,ft,f0,f1,q){const c=E.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=E.nb;s.loop=true;f.type=ft;f.Q.setValueAtTime(q||1,t);
 f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const end=noteEnv(g.gain,t,dur*.4,peak,.01,dur*.6);s.connect(f);f.connect(g);g.connect(E.sfx);s.start(t);s.stop(end+.05)}
const SFX={
 swipe(E,t){noise(E,t,.14,.2,'bandpass',500,1800,2)},
 right(E,t,fast){tone(E,t,74,.14,.5,'sine',3500,.015,.25,.15);tone(E,t+.11,81,.3,.55,'sine',3500,.015,.45,.15);
  if(fast){noise(E,t+.05,.5,.12,'highpass',800,6000,.7);sweep(E,t+.05,300,1100,.35,'sine',.1,4000)}},
 hit(E,t,crash){sweep(E,t,130,38,.4,'sine',crash?.7:.45,300);noise(E,t,crash?.4:.18,crash?.4:.2,'lowpass',1200,200,.7);
  tone(E,t+.12,81,.1,.1,'square',3000,.01,.04);tone(E,t+.26,76,.1,.1,'square',3000,.01,.06)},   /* siren blip: 880 Hz then 660 Hz */
 coin(E,t,i){const k=Math.min(i||0,8);tone(E,t,83+k,.05,.12,'square',3600,.004,.06);tone(E,t+.05,88+k,.09,.12,'square',3600,.004,.1)},
 card(E,t){tone(E,t,79,.08,.3,'triangle',3000,.01,.2,.2);tone(E,t+.07,84,.14,.3,'triangle',3000,.01,.3,.2)},
 strike(E,t){tone(E,t,67,.16,.5,'triangle',700,.03,.25);tone(E,t+.14,63,.3,.5,'triangle',700,.03,.45)},
 heal(E,t){[72,76,79].forEach((m,i)=>tone(E,t+i*.08,m,.1,.35,'sine',3500,.01,.3,.2))},
 pass(E,t){[72,76,79,84].forEach((m,i)=>tone(E,t+i*.11,m,.14,.4,'triangle',3500,.01,.3,.2));[72,76,79,84].forEach(m=>tone(E,t+.5,m,1.1,.18,'triangle',3000,.02,.9,.2))},
 fail(E,t){[67,63,60,55].forEach((m,i)=>tone(E,t+i*.22,m,.2,.4,'sawtooth',800,.02,.3));sweep(E,t+.88,110,40,.6,'sine',.5,300)},
 copy(E,t){tone(E,t,88,.04,.3,'sine',4000,.005,.08);tone(E,t+.07,95,.08,.3,'sine',4000,.005,.14)},
 tick(E,t){tone(E,t,84,.03,.2,'sine',3000,.005,.06)},
 riser(E,t){const c=E.ctx,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(1500,t+1);
  f.type='lowpass';f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(7000,t+1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.9);g.gain.linearRampToValueAtTime(0,t+1.05);
  o.connect(f);f.connect(g);g.connect(E.sfx);o.start(t);o.stop(t+1.1);noise(E,t,1,.1,'highpass',500,5000,.7)}};
function snd(name,a,b,dl){if(MUTED||!AE||AC.state!=='running')return;try{SFX[name](AE,AC.currentTime+.01+(dl||0),a,b)}catch(e){}}
function musicOn(){if(AE&&!MUTED)AE.start()}
const NOAUDIO=DEV&&Q.get('noaudio')==='1';   /* test only: the 60 bot pages of check.js skip audio so the test machine is not starved */
function audio(){if(NOAUDIO)return;try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}   /* iOS Safari 16.4+: play with the ringer switch on silent */
  AE=makeEngine(AC,true);document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend().catch(()=>{});else AC.resume().catch(()=>{})});
  if(G&&G.mode==='run')musicOn()}
 if(AC.state!=='running')AC.resume().catch(()=>{})}catch(e){}}   /* iOS also reports 'interrupted' after a call or a lock: resume from any state but running */
function setMuted(v){MUTED=v;store.set(MK,v?'1':'0');if(AE){const p=AE.master.gain,t=AC.currentTime;p.cancelScheduledValues(t);p.setTargetAtTime(v?0:.8,t,.03)}if(!v){audio();if(G&&G.mode==='run'&&G.phase!=='over')musicOn()}}

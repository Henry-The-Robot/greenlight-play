'use strict';
/* RUSH HOUR - Green Light prototype A (throwaway). One file, no dependencies.
 Built from:
 (1) the 3-lane swipe runner model of Subway Surfers / Temple Run (swipe = one lane, tap = jump to that lane);
 (2) the pseudo-3D road projection of Jake Gordon's "javascript-racer", flattened so far scenes stay legible
     (scale s = SF + (1-SF)*g, screen y linear in g);
 (3) the fixed-step loop of Glenn Fiedler, "Fix Your Timestep" (accumulator, 1/60 s, render once per frame);
 (4) the answer-gate quiz-runner pattern (answers sit in the lanes);
 (5) teach-then-test with spaced re-asks (Roediger and Karpicke 2006, testing effect); every rule is asked twice, the re-ask in new words. The route is fixed per day, so it does not adapt to misses.
 (6) share-card squares after Wordle; seeded daily route so times compare (BRIEF.md "Kyle's spec, part 2").
 Rules (RH2): 17 teaching units (game/src/content/units.json ids, also RULES[].id) in the RUSH_UNITS block below, with 60 bank questions; nothing is hand-written in this file.
 Adult-trap families (hard) are Kyle's list (curb, cyclist, 4-way), not measured.
 Daily route = same 6 rules, order, questions and answer wording for everyone on a local calendar date (like Wordle); the answer LANES are shuffled on every attempt.
 Test hooks exist ONLY with ?dev=1: ts=4 (clock x4), seed=N (route seed, default = date as YYYYMMDD), window.__rush (state for the Playwright bot). Players never see them.
 V2 (card RH1, Kyle 2026-10-10: "too fast to read the info", "give it music and sound effects", "a better learning experience"), prototypes/DESIGN.md:
 (7) pace: teach card waits for a tap (6 s max) while the road crawls; question line 1.5 s before the signs; signs of 2-5 words with the full answer in a bottom bar;
     windows 7 s / 5 s / 4 s (first / second / third ask), fast window = first 40 percent; Calm doubles every window.
 (8) learning: teach card = rule + picture + one "why" line; a miss stops the road and keeps rule + why until a tap (delayed feedback after a retrieval attempt,
     Butler, Karpicke and Roediger 2007); right re-ask = "Locked in"; end card lists rules learned and rules to practise (prototypes/TEACHING.md sections 2-4);
     v2 wrote a cautious-but-wrong option into every answer set by hand; RH2 takes the 2 wrong options per question from the bank (chosen in tools/rush-labels.json) and measures the cheap-bot tells.
 (9) audio, no files, ported from the slice (game/src/audio/engine.ts + schedule.ts): audio-clock look-ahead scheduler (Chris Wilson, "A Tale of Two Clocks"),
     per-stem low-pass, anchored note envelopes, dark noise reverb, iOS audioSession, resume on first tap. New here: kick/hat and lead layers by streak, a riser at turbo,
     a low-pass on the music while a card is open, and the sound effects. */
/* V3 (card RH2b, Kyle played v2 on 2026-10-10: "basically the whole game is just questions and cards with minimal playing", "not enough time to read", "text too small", "SFX are good"),
 prototypes/DESIGN.md "v3: play first". About 3 of 4 moments are PLAYED (swipe = lane, hold = brake, release = go; no question text, no signs; the world judges the car), 1 of 4 is a question (the road crawls, the
 clock starts after a reading delay of 0.3 s a word, no turbo). Coins win: each level has a coin target; wrong = lose coins, a dangerous wrong = a crash = a life (3 lives). Levels add rule families, speed (+2 m/s) and shorter
 timers (x0.9). A placeholder 15 s ad sits between levels and on game over (extra life once). Sources and what is ours:
 (10) controls: swipe = one lane is the Subway Surfers / Temple Run model (item 1 above); hold = brake is our own addition, no exemplar copied (the judge numbers, 15 m/s2 braking and the 3 m late margin, are tuned by test, not measured);
 (11) lives, a coin target per level, a rewarded-ad continue once per run, a coming-soon mini game: Kyle's spec (DESIGN.md "v3: play first"), shape of a casual mobile runner;
 (12) the fixed-step loop, the audio synth, the world drawing and the RH2 data block are unchanged from v2 (rh2.html is the v2/RH2 file, kept).
 Judges (stepStop, stepAmb, stepBike, stepNoStop, stepPark in the logic block) are written out in the comment above K_STOP. Test: check.js (bots drive the real pointer handlers). */
const W=390,CX=195,HOR=240,Z1=40,SF=.28,PX=34,LN=3.2,DT=1/60,GAP=30,TEACH_MAX=6,TEACH_MIN=.7,PRE=1.5,FW=.4,CRAWL=2.5,VQ=15;
let H=844,GY=700,ZN=-9.5;   /* ZN: the nearest ground distance that still reaches the bottom edge of the canvas */   /* logical height: 664 to 844, set by resize() from the window shape, so a phone browser with a toolbar still draws at full width and size */
const Q=new URLSearchParams(location.search);
const DEV=Q.get('dev')==='1';
const TS=DEV?Math.max(.25,Math.min(8,+Q.get('ts')||1)):1;
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rnd=mul((Date.now()%999983)+1);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return 1-(1-t)**3};
const back=t=>{t=clamp(t,0,1);return 1+2.8*(t-1)**3+1.8*(t-1)**2};
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const BC=['#2f80ed','#ff8a00','#e84393'];
const cv=document.getElementById('c'),cx=cv.getContext('2d');
/* The logical canvas is always 390 wide and 664 to 844 tall. A phone browser with a toolbar is about 390x664: the canvas then fills it at scale 1,
   instead of shrinking a fixed 390x844 picture to 79 percent (the text would be 21 percent smaller). Bottom things hang from H, so nothing is cut. */
function resize(){const vw=innerWidth,vh=innerHeight;H=clamp(Math.round(W*vh/vw),664,844);GY=H-144;ZN=Z1*(GY-HOR)/(H-HOR)-Z1;
 const s=Math.min(vw/W,vh/H),d=Math.min(devicePixelRatio||1,2.5);
 cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);cx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
 if(typeof relayout==='function')relayout()}
addEventListener('resize',resize);

/* ---------- projection and drawing helpers ---------- */
const gg=z=>Z1/(Z1+z),sc=z=>SF+(1-SF)*gg(z),yy=z=>HOR+(GY-HOR)*gg(z);
function gq(x1,x2,za,zb,col){za=Math.max(za,ZN);if(zb<=za)return;const sa=sc(za),sb=sc(zb),ya=yy(za),yb=yy(zb);
 cx.fillStyle=col;cx.beginPath();cx.moveTo(CX+x1*PX*sa,ya);cx.lineTo(CX+x2*PX*sa,ya);cx.lineTo(CX+x2*PX*sb,yb);cx.lineTo(CX+x1*PX*sb,yb);cx.fill()}
function sideQuad(xm,za,zb,h0,h1,col){const sa=sc(za),sb=sc(zb),ya=yy(za),yb=yy(zb),xa=CX+xm*PX*sa,xb=CX+xm*PX*sb;
 cx.fillStyle=col;cx.beginPath();cx.moveTo(xa,ya-h0*PX*sa);cx.lineTo(xb,yb-h0*PX*sb);cx.lineTo(xb,yb-h1*PX*sb);cx.lineTo(xa,ya-h1*PX*sa);cx.fill()}
function at(x,z,fn,a,rot){if(z<ZN+.5)return;const k=PX*sc(z);cx.save();cx.translate(CX+x*k,yy(z));cx.scale(k,k);
 if(a!==undefined&&a<1)cx.globalAlpha=Math.max(0,a);if(rot)cx.rotate(rot);fn();cx.restore()}
const at0=at;
/* meter-space shapes: origin ground centre, y up */
const rc=(x,y,w,h,c)=>{cx.fillStyle=c;cx.fillRect(x,-y-h,w,h)};
const ci=(x,y,r,c)=>{cx.fillStyle=c;cx.beginPath();cx.arc(x,-y,r,0,6.2832);cx.fill()};
const pg=(p,c)=>{cx.fillStyle=c;cx.beginPath();p.forEach((q,i)=>i?cx.lineTo(q[0],-q[1]):cx.moveTo(q[0],-q[1]));cx.closePath();cx.fill()};
const oc=(x,y,r,c)=>pg(Array.from({length:8},(_,i)=>{const a=(i+.5)*Math.PI/4;return[x+Math.cos(a)*r,y+Math.sin(a)*r]}),c);
function T(s,x,y,size,col,al,stroke){cx.font=`bold ${size}px ${FONT}`;cx.textAlign=al||'center';cx.textBaseline='middle';
 if(stroke){cx.lineWidth=stroke;cx.strokeStyle='rgba(0,0,0,.6)';cx.lineJoin='round';cx.strokeText(s,x,y)}cx.fillStyle=col;cx.fillText(s,x,y)}
function RR(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function wrapT(s,mw,sz){cx.font=`bold ${sz}px ${FONT}`;const L=[];let l='';
 for(const w of s.split(' ')){const n=l?l+' '+w:w;if(cx.measureText(n).width>mw&&l){L.push(l);l=w}else l=n}if(l)L.push(l);return L}
const mu=n=>1+.5*(Math.min(Math.max(n,1),7)-1);
const qr=(t,q)=>clamp((t-q.rd)/q.W,0,1);  /* answer-speed ratio 0..1: the clock starts after the reading delay q.rd (v3) */

/* ---------- content: teaching units (card RH2) ---------- */
/* Every moment reads its teach line, why line, question and answers from RUSH_UNITS. The block between the markers is written by
   tools/build_rush_units.py from game/src/content/units.json + the bank questions + tools/rush-labels.json. Do not edit it by hand.
   unit = {id (units.json), k (scene kind), cv (curb colour), sv (scene variant), hard, title, name, fail, teach, why, short, roast, qs[]};
   question = {id (bank), tier t1|t2|t3, stem (the scene question, bank wording), ci (bank correct index), sv?, o: [right, wrong, wrong]};
   option = {i (bank option index), s (sign label, 2-5 words), t (the full bank option, shown in the bottom bar)}.
   Sign = label, bottom bar = full option. The first ask of a rule uses a t1 question, the re-ask a t2 or t3 question (different wording). */
/*RUSH-UNITS-BEGIN*/
const RUSH_UNITS=[{"id":"s7_p11_roadway-002","k":"bus","cv":null,"sv":0,"hard":false,"title":"SCHOOL BUS","name":"School bus","fail":"ticket","teach":"Stop for school bus red flashing lights until they go off, unless the bus is across a divided road.","why":"Kids may cross in front of the bus.","action":{"correct":"stop_full","wrong_crash":"keep_going","cite":"Stop for school bus red flashing lights until they go off, unless the bus is across a divided road."},"short":"School bus red lights: stay stopped.","roast":"You'd lose your license at the school bus.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont/","qs":[{"id":"q-3-043","tier":"t1","stem":"A school bus on an undivided road has its red lights flashing. Who must stop?","ci":1,"o":[{"i":1,"s":"Cars from both directions","t":"Cars from both directions, behind and ahead"},{"i":0,"s":"Cars behind, not oncoming","t":"Cars behind the bus, but not oncoming cars"},{"i":2,"s":"Cars facing it, not behind","t":"Cars facing the bus, but not those behind it"}]},{"id":"q-3-045","tier":"t2","stem":"A bus ahead on a two-lane road shows red flashing lights. An oncoming car drives past it. Which statement is right?","ci":0,"o":[{"i":0,"s":"Oncoming driver broke the rule","t":"The oncoming driver broke the rule, since both directions must stop"},{"i":1,"s":"Fine; only followers must stop","t":"The oncoming driver is fine, since only following traffic must stop"},{"i":3,"s":"Fine if no child visible","t":"The oncoming driver is fine if no child is in sight"}]}]},{"id":"s6_p11_run2-001","k":"bus","cv":null,"sv":0,"hard":false,"title":"BUS STOP ARM","name":"School bus stop arm","fail":"ticket","teach":"When a school bus stop arm extends, stop and stay stopped until the children are clear.","why":"The stop arm means children are crossing.","action":{"correct":"stop_full","wrong_crash":"keep_going","cite":"When a school bus stop arm extends, stop and stay stopped until the children are clear."},"short":"Stop arm out: stay stopped.","roast":"You'd drive past a school bus stop arm.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont/","qs":[{"id":"q-3-022","tier":"t1","stem":"What does a school bus stop arm do?","ci":0,"o":[{"i":0,"s":"Makes traffic stop","t":"It makes traffic stop while children board or leave"},{"i":1,"s":"Bus pulling away soon","t":"It shows the bus will pull away from the stop soon"},{"i":2,"s":"Bus turning right soon","t":"It signals that the bus is turning right shortly"}]},{"id":"q-3-023","tier":"t2","stem":"You are stopped behind a school bus whose stop arm is out. A child steps off the curb to cross. When may you drive on?","ci":3,"o":[{"i":3,"s":"Arm folds, children clear","t":"When the arm folds in and the children are clear"},{"i":0,"s":"Arm out, road looks empty","t":"When the arm is out but the road looks empty"},{"i":1,"s":"Once first child is across","t":"As soon as the first child is across"}]}]},{"id":"s7_p11_run3-009","k":"bus","cv":null,"sv":0,"hard":false,"title":"KIDS AT THE BUS","name":"Children at a bus","fail":"ticket","teach":"Expect children to cross in front of a stopped school bus, and stay stopped until they are clear.","why":"The driver can see kids in front of the bus.","action":{"correct":"stop_full","wrong_crash":"keep_going","cite":"Expect children to cross in front of a stopped school bus, and stay stopped until they are clear."},"short":"Kids cross in front of the bus: stay stopped.","roast":"You'd watch the wrong side of the school bus.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont/","qs":[{"id":"q-3-097","tier":"t1","stem":"Why are children taught to cross in front of a stopped school bus?","ci":0,"o":[{"i":0,"s":"Driver can see them","t":"So the bus driver can see them"},{"i":1,"s":"Stay clear of exhaust","t":"So they stay clear of the exhaust"},{"i":2,"s":"They cross faster","t":"So they cross faster"}]},{"id":"q-3-058","tier":"t1","stem":"After leaving a stopped school bus, where do children who must cross the road walk?","ci":2,"o":[{"i":2,"s":"In front, driver's view","t":"In front of the bus, in the driver's view"},{"i":0,"s":"Behind it, out of traffic","t":"Behind the bus, out of the traffic lane"},{"i":1,"s":"Beside it, next to traffic","t":"At the side of the bus, next to the traffic"}]},{"id":"q-3-098","tier":"t2","stem":"You are stopped behind a bus with red lights. You cannot see the front of the bus. What should you assume?","ci":2,"o":[{"i":2,"s":"Kids may cross in front","t":"Children may cross in front of the bus, out of view"},{"i":0,"s":"Kids walking behind the bus","t":"Children are walking behind the bus toward you"},{"i":1,"s":"No one will cross","t":"No one will cross, since the bus is loading"}]},{"id":"q-3-099","tier":"t2","stem":"Which statement about children crossing at a stopped bus is right?","ci":1,"o":[{"i":1,"s":"In front, driver sees them","t":"They cross in front, where the driver can see them"},{"i":0,"s":"Behind it, cars see them","t":"They cross behind it, where cars can see them"},{"i":2,"s":"Beside it, in traffic","t":"They cross beside it, between the bus and traffic"}]}]},{"id":"s6_p11_roadway-032","k":"cross","cv":null,"sv":0,"hard":false,"title":"CROSSWALK","name":"Crosswalk","fail":"ticket","teach":"Give way to people in any marked crosswalk, and in an unmarked crosswalk at an intersection.","why":"A person on foot has no metal around them.","action":{"correct":"stop_full","wrong_crash":"keep_going","cite":"Give way to people in any marked crosswalk, and in an unmarked crosswalk at an intersection."},"short":"Crosswalk, marked or not: yield to people.","roast":"You'd lose your license at the crosswalk.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road/","qs":[{"id":"q-2a-103","tier":"t1","stem":"Which crosswalks give pedestrians the right of way?","ci":1,"o":[{"i":1,"s":"Marked and unmarked alike","t":"Marked and unmarked crosswalks alike"},{"i":2,"s":"Signal and school crosswalks","t":"Signal-controlled crosswalks and school crosswalks"},{"i":3,"s":"25 mph streets or lower","t":"Crosswalks on streets with a 25 mph limit or lower"}],"sv":0},{"id":"q-1b-016","tier":"t1","stem":"At an intersection with no painted crosswalk, a person steps off the curb. Who has the right of way?","ci":0,"o":[{"i":0,"s":"The pedestrian","t":"The pedestrian, as at a painted crosswalk"},{"i":1,"s":"First one to the corner","t":"Whoever is first to the corner"},{"i":3,"s":"The larger vehicle","t":"The larger vehicle"}],"sv":1},{"id":"q-2a-105","tier":"t2","stem":"A friend says only painted crosswalks protect pedestrians. How do you reply?","ci":1,"o":[{"i":1,"s":"Unmarked ones protect too","t":"Unmarked crosswalks protect pedestrians too"},{"i":0,"s":"Agree; paint creates priority","t":"Agree; paint is what creates the right of way"},{"i":3,"s":"Pedestrians have priority everywhere","t":"Pedestrians have the right of way everywhere on the road"}],"sv":0}]},{"id":"s6_p11_roadway-009","k":"yellow","cv":null,"sv":0,"hard":false,"title":"YELLOW LIGHT","name":"Yellow light","fail":"crash","teach":"Steady yellow means red is next. Stop if you can do so safely.","why":"Cross traffic is about to get its green.","action":{"correct":"stop_line","wrong_crash":"keep_going","cite":"Steady yellow means red is next. Stop if you can do so safely."},"short":"Yellow: red is next. Stop if you safely can.","roast":"You'd go through a yellow you could stop for.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road/","qs":[{"id":"q-2a-052","tier":"t1","stem":"You are far back from an intersection when the light turns yellow. What do you do?","ci":0,"o":[{"i":0,"s":"Brake smoothly, stop at line","t":"Brake smoothly and stop before the line, since you have room"},{"i":1,"s":"Accelerate; yellow means hurry","t":"Accelerate to make it, since yellow means hurry"},{"i":2,"s":"Brake hard, even over line","t":"Brake hard, even if you stop over the line, as red is next"}]},{"id":"q-2a-053","tier":"t2","stem":"You drive at 35 mph and reach the limit line just as the light turns yellow. A car follows close behind. What fits the yellow-light rule?","ci":0,"o":[{"i":0,"s":"Cross with care if clear","t":"Cross with care, if you judge you can clear the crossing before red"},{"i":1,"s":"Slam on brakes, always stop","t":"Slam on the brakes, since yellow always means stop"},{"i":2,"s":"Accelerate to beat red","t":"Accelerate hard so you are sure to be through before red"}],"keep":true}]},{"id":"s6_p11_run2-008","k":"amb","cv":null,"sv":0,"hard":false,"title":"SIREN BEHIND","name":"Siren behind you","fail":"ticket","teach":"Emergency vehicle with siren and lights approaching: pull to the right, clear of intersections, and stop until it passes.","why":"A clear right edge lets the crew drive past fast.","action":{"correct":"pull_right_stop","wrong_crash":"keep_going","cite":"Emergency vehicle with siren and lights approaching: pull to the right, clear of intersections, and stop until it passes."},"short":"Siren behind you: pull right and stop.","roast":"You'd block the ambulance.","cite":"https://dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road/","qs":[{"id":"q-6-166","tier":"t1","stem":"What must you do when an emergency vehicle with a siren and lights approaches?","ci":2,"o":[{"i":2,"s":"Pull right and stop","t":"Pull to the right edge and stop until it passes"},{"i":0,"s":"Slow, keep rolling in lane","t":"Slow down but keep rolling in your lane until it passes"},{"i":1,"s":"Pull left and stop","t":"Pull to the left edge and stop until it passes"}]},{"id":"q-6-168","tier":"t2","stem":"Which driver is doing the right thing as a siren approaches?","ci":0,"o":[{"i":0,"s":"Ben pulls right, stays stopped","t":"Ben, who pulls right and stays stopped until the truck has

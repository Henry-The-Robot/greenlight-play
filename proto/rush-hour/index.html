"t":"Stay out; the driver does not count toward the minimum"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-067","u":"s6_p11_run2-016","ut":"Some clean-air vehicle decals once allowed HOV lane use; the program ended in 2025, so check current rules.","r":"Clean-air decals once allowed HOV lane use, but the program ended in 2025.","stem":"What happened to the clean-air vehicle decals that let some cars use carpool lanes?","ci":0,"o":[{"i":0,"s":null,"t":"The decals no longer work: the program ended in 2025"},{"i":2,"s":null,"t":"The decals stay valid for the life of the car once issued"},{"i":3,"s":null,"t":"The decals now let any hybrid car use carpool lanes alone"}],"g":null,"tier":"t1","nl":1},{"id":"q-4-069","u":"s6_p11_run2-016","ut":"Some clean-air vehicle decals once allowed HOV lane use; the program ended in 2025, so check current rules.","r":"Occupancy per the posted signs is still the basis; the decal route ended in 2025.","stem":"Which way of using a carpool lane is still correct after 2025?","ci":0,"o":[{"i":0,"s":null,"t":"Having the posted number of people, per the signs"},{"i":1,"s":null,"t":"Using a clean-air decal alone"},{"i":2,"s":null,"t":"Using either a decal or enough people, for any car"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-071","u":"s6_p11_run2-019","ut":"Lane changes while merging should be made one lane at a time with clear visibility and proper signaling.","r":"Merging across lanes is done one lane at a time with a clear view and a signal.","stem":"You merge from a ramp and need to reach the left lane of a three-lane freeway. What is best?","ci":2,"o":[{"i":2,"s":null,"t":"Move over lane by lane, signaling and checking each time"},{"i":1,"s":null,"t":"Stay in the right lane and pass everyone on the right"},{"i":3,"s":null,"t":"Signal once at the ramp and cross each lane unchecked"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-072","u":"s6_p11_run2-019","ut":"Lane changes while merging should be made one lane at a time with clear visibility and proper signaling.","r":"A signal and a check come before you move over.","stem":"Which order is right for each lane change while merging?","ci":3,"o":[{"i":3,"s":null,"t":"Signal, check mirrors and blind spot, then move"},{"i":1,"s":null,"t":"Check the mirrors only, and signal while moving"},{"i":2,"s":null,"t":"Signal only for the car closest behind you"}],"g":null,"tier":"t3","nl":1},{"id":"q-4-073","u":"s6_p11_run2-020","ut":"Never abruptly merge into traffic by cutting off other vehicles; allow merge space and maintain safe distances.","r":"Never merge abruptly or cut off other vehicles; allow space and keep safe distances.","stem":"How much space should you allow when you merge into traffic?","ci":1,"o":[{"i":1,"s":null,"t":"Enough that nobody must brake hard because you merged"},{"i":2,"s":null,"t":"Any gap at all, if you signal long enough beforehand"},{"i":3,"s":null,"t":"Space ahead only, as the driver behind watches the gap"}],"g":null,"tier":"t1","nl":1},{"id":"q-4-074","u":"s6_p11_run2-020","ut":"Never abruptly merge into traffic by cutting off other vehicles; allow merge space and maintain safe distances.","r":"Do not cut off other vehicles; allow merge space and keep safe distances.","stem":"A gap opens in the lane beside you, but the car behind that gap is closing fast. What do you do?","ci":1,"o":[{"i":1,"s":null,"t":"Wait for a bigger gap that nobody has to hurry to meet"},{"i":2,"s":null,"t":"Slip in and accelerate to ease pressure on that driver"},{"i":3,"s":null,"t":"Dart in sharply to hold the gap before it closes"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-075","u":"s6_p11_run2-020","ut":"Never abruptly merge into traffic by cutting off other vehicles; allow merge space and maintain safe distances.","r":"Both room ahead and room behind are part of safe merge spacing.","stem":"Which describes safe spacing after a merge?","ci":0,"o":[{"i":0,"s":null,"t":"Open space both in front of you and behind you"},{"i":1,"s":null,"t":"Room ahead only; the driver behind watches the gap"},{"i":3,"s":null,"t":"Very little room, because the lane is yours after a signal"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-076","u":"s6_p11_roadway-025","ut":"When exiting a freeway, signal for approximately 5 seconds or 400 feet before changing lanes.","r":"Signal about 5 seconds, roughly 400 feet, before leaving.","stem":"About how many seconds before leaving a freeway should your signal be on?","ci":1,"o":[{"i":1,"s":"About 5 seconds","t":"About 5 seconds"},{"i":2,"s":"About 3 seconds","t":"About 3 seconds"},{"i":3,"s":"About 10 seconds","t":"About 10 seconds"}],"g":null,"tier":"t1","nl":0},{"id":"q-4-079","u":"s6_p11_run2-024","ut":"Large truck drivers have limited visibility to the sides and rear; maintain extra distance when passing or merging.","r":"Truck drivers cannot see well to the sides and rear, so you leave more room.","stem":"A large truck driver has a poor view to the sides and rear. What should you do?","ci":2,"o":[{"i":2,"s":null,"t":"Keep extra room when passing or merging near it"},{"i":1,"s":null,"t":"Honk once, then change lanes right beside its cab"},{"i":3,"s":null,"t":"Stay about one car length behind its rear bumper"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-080","u":"s6_p11_run2-024","ut":"Large truck drivers have limited visibility to the sides and rear; maintain extra distance when passing or merging.","r":"Truck drivers see little to the sides and rear, so you leave extra distance when merging.","stem":"You passed a truck and want back in its lane. What do you do?","ci":2,"o":[{"i":2,"s":null,"t":"Pull well ahead first, then merge with ample room"},{"i":0,"s":null,"t":"Cut back right away to leave the blind spot quickly"},{"i":1,"s":null,"t":"Slide in as soon as its front bumper is in your mirror"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-084","u":"s7-17","ut":"At roundabouts, drivers must slow down, yield to existing traffic, and enter only when a safe gap exists.","r":"Vehicles inside the roundabout have the priority, and entering drivers yield.","stem":"At a roundabout entry, who has the right-of-way?","ci":1,"o":[{"i":1,"s":null,"t":"Traffic already in the circle"},{"i":0,"s":null,"t":"Traffic about to enter from your right"},{"i":2,"s":null,"t":"Whichever vehicle reaches the entry line first"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-085","u":"s7-18","ut":"In a roundabout, travel counter-clockwise and do not stop or pass other vehicles.","r":"Roundabout traffic moves counter-clockwise, and you do not stop or pass other vehicles in it.","stem":"Which way do you travel around a roundabout?","ci":0,"o":[{"i":0,"s":null,"t":"Counter-clockwise, without stopping or passing others"},{"i":1,"s":null,"t":"Clockwise, using the inside lane whenever you can"},{"i":3,"s":null,"t":"Counter-clockwise, passing slower cars on the inside"}],"g":null,"tier":"t1","nl":1},{"id":"q-4-086","u":"s7-18","ut":"In a roundabout, travel counter-clockwise and do not stop or pass other vehicles.","r":"In a roundabout you keep moving in the same direction and do not pass other vehicles.","stem":"Inside a roundabout, a car ahead moves slowly. Your exit is the next one. What do you do?","ci":1,"o":[{"i":1,"s":null,"t":"Stay behind it and keep circling to your exit"},{"i":0,"s":null,"t":"Pass it on the inside to reach your exit sooner"},{"i":2,"s":null,"t":"Stop in the circle until that car clears the exit"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-088","u":"s7-20","ut":"When entering a multi-lane roundabout, choose your entry lane based on your destination exit.","r":"Choose the entry lane that matches your destination exit.","stem":"How do you pick an entry lane at a multi-lane roundabout?","ci":2,"o":[{"i":2,"s":null,"t":"By the exit you plan to take out of the circle"},{"i":0,"s":null,"t":"By the lane with the fewest cars waiting"},{"i":3,"s":null,"t":"Always the inner lane, to stay out of others' way"}],"g":null,"tier":"t1","nl":1},{"id":"q-4-089","u":"s7-20","ut":"When entering a multi-lane roundabout, choose your entry lane based on your destination exit.","r":"Your destination exit decides the lane you enter from.","stem":"Before entering a two-lane roundabout, you read signs showing which lane leads to which exit. What do you do?","ci":0,"o":[{"i":0,"s":null,"t":"Take the lane that matches your exit and keep to it"},{"i":1,"s":null,"t":"Take the emptier lane, then change lanes in the circle"},{"i":3,"s":null,"t":"Wait until inside the circle to decide on a lane"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-090","u":"s7-20","ut":"When entering a multi-lane roundabout, choose your entry lane based on your destination exit.","r":"The lane follows your destination exit and is picked before entry.","stem":"Two drivers explain how to choose a lane at a multi-lane roundabout. Which explanation is right?","ci":3,"o":[{"i":3,"s":null,"t":"Choose before you enter, and let your exit decide the lane"},{"i":1,"s":null,"t":"Choose by vehicle size, with the big vehicles on the outside"},{"i":2,"s":null,"t":"Choose whichever lane has the longest gap and go"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-092","u":"s6_p11_run3-004","ut":"Always yield to a person using a white cane or guide dog, and wait until they are clear.","r":"A blind pedestrian with a white cane or guide dog always has the right-of-way.","stem":"You turn right on green. A man with a white cane steps off the curb outside the crosswalk. What do you do?","ci":0,"o":[{"i":0,"s":null,"t":"Stop and wait until he has finished crossing"},{"i":1,"s":null,"t":"Slow down and tap your horn to guide him back"},{"i":3,"s":null,"t":"Pass behind him slowly while he is still crossing"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-094","u":"s7_p11_roadway-005","ut":"Do not weave in and out of traffic when driving on any roadway.","r":"Safe driving rules out weaving in and out of traffic on any roadway.","stem":"Traffic is thick and your lane moves slowly. Which choice is a driving mistake?","ci":3,"o":[{"i":3,"s":null,"t":"Weaving in and out of lanes to gain a few places"},{"i":0,"s":null,"t":"Holding your position in one lane at a steady pace"},{"i":1,"s":null,"t":"Signaling before a planned lane change"}],"g":null,"tier":"t1","nl":1},{"id":"q-4-096","u":"s7_p11_roadway-005","ut":"Do not weave in and out of traffic when driving on any roadway.","r":"Weaving is a series of lane changes made to gain ground in traffic.","stem":"Which of these counts as weaving?","ci":2,"o":[{"i":2,"s":null,"t":"Repeated quick lane changes to gain a few car lengths"},{"i":0,"s":null,"t":"One signaled lane change to prepare for an exit"},{"i":1,"s":null,"t":"Moving over one lane to pass a slow truck and staying there"}],"g":null,"tier":"t3","nl":1},{"id":"q-4-100","u":"s7_p11_run2-018","ut":"The speed limit is 15 mph near a railroad crossing when you cannot see it clearly for 400 feet.","r":"A 15 mph limit applies when the view of the crossing is blocked in the last 100 feet.","stem":"You near a railroad crossing, and for the last 100 feet you cannot see it clearly for 400 feet either way. What speed limit applies?","ci":1,"o":[{"i":1,"s":"15 mph","t":"15 mph"},{"i":2,"s":"35 mph","t":"35 mph"},{"i":3,"s":"10 mph","t":"10 mph"}],"g":null,"tier":"t1","nl":0},{"id":"q-4-103","u":"s7_p11_run2-019","ut":"At a rail crossing, stop at least 15 feet from the nearest rail when a signal or flagger warns.","r":"A driver must stop at least 15 feet from the nearest rail when warned of a train.","stem":"A crossing signal or flagger warns of a train. How far from the nearest rail must you stop?","ci":2,"o":[{"i":2,"s":null,"t":"At least 15 feet"},{"i":0,"s":null,"t":"At least 5 feet"},{"i":1,"s":null,"t":"At least 10 feet"}],"g":null,"tier":"t1","nl":1},{"id":"q-4-104","u":"s7_p11_run2-019","ut":"At a rail crossing, stop at least 15 feet from the nearest rail when a signal or flagger warns.","r":"The stop must be at least 15 feet from the nearest rail.","stem":"You approach a crossing with flashing signals. Where do you stop?","ci":2,"o":[{"i":2,"s":null,"t":"At least 15 feet short of the nearest rail"},{"i":0,"s":null,"t":"As close to the rail as you can get"},{"i":1,"s":null,"t":"About 5 feet short of the nearest rail"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-105","u":"s7_p11_run2-019","ut":"At a rail crossing, stop at least 15 feet from the nearest rail when a signal or flagger warns.","r":"The stop distance at a warned crossing is 15 feet from the nearest rail.","stem":"Which figure tells where to stop when a crossing warns of a train?","ci":0,"o":[{"i":0,"s":null,"t":"15 feet, the least distance from the nearest rail"},{"i":2,"s":null,"t":"400 feet, the sight distance on a blocked approach"},{"i":3,"s":null,"t":"3 feet, the gap used when passing a cyclist"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-106","u":"s7_p11_run2-024","ut":"Keep at least a 3-second following distance behind other vehicles; increase it in poor weather or traffic.","r":"Keep at least a 3-second gap behind the vehicle ahead, and add more in poor weather or traffic.","stem":"What is the least following distance in good conditions?","ci":3,"o":[{"i":3,"s":null,"t":"At least 3 seconds"},{"i":1,"s":null,"t":"At least 2 seconds"},{"i":2,"s":null,"t":"One car length for every 10 mph"}],"g":null,"tier":"t1","nl":1},{"id":"q-4-107","u":"s7_p11_run2-024","ut":"Keep at least a 3-second following distance behind other vehicles; increase it in poor weather or traffic.","r":"Increase the 3-second gap in poor weather.","stem":"Rain is falling hard and you follow a car at 55 mph. What following distance do you keep?","ci":1,"o":[{"i":1,"s":null,"t":"More than 3 seconds, since rain calls for extra room"},{"i":2,"s":null,"t":"2 seconds, because the wipers keep your view clear"},{"i":3,"s":null,"t":"1 second, since the car ahead is also slowing"}],"g":null,"tier":"t2","nl":1},{"id":"q-4-108","u":"s7_p11_run2-024","ut":"Keep at least a 3-second following distance behind other vehicles; increase it in poor weather or traffic.", eed?","ci":2,"o":[{"i":2,"s":"30 mph","t":"30 mph"},{"i":0,"s":"15 mph","t":"15 mph"},{"i":1,"s":"45 mph","t":"45 mph"}],"g":null,"tier":"t1","nl":0},{"id":"q-5a-114","u":"s7_p11_roadway-015","ut":"Do not exceed 30 mph when visibility is reduced to less than 100 feet due to fog, rain, or snow.","r":"The 30 mph cap applies under 100 feet of visibility; headlights are needed under 1,000 feet.","stem":"Which pairing is right: the visibility distance that caps your speed at 30 mph, and the one that calls for headlights?","ci":3,"o":[{"i":3,"s":null,"t":"Speed cap: under 100 feet; headlights: under 1,000 feet"},{"i":0,"s":null,"t":"Speed cap: under 1,000 feet; headlights: under 100 feet"},{"i":1,"s":null,"t":"Speed cap: under 100 feet; headlights: under 100 feet"}],"g":null,"tier":"t2","nl":1},{"id":"q-5a-115","u":"s7_p11_roadway-016","ut":"Use low-beam headlights in rain to reduce glare and light reflection.","r":"Use low-beam headlights in rain to reduce glare and light reflection.","stem":"Which headlight setting does the handbook give for driving in rain?","ci":1,"o":[{"i":1,"s":null,"t":"Low beams, which cut glare and reflection"},{"i":2,"s":null,"t":"Hazard flashers, so others see you through the rain"},{"i":3,"s":null,"t":"Parking lights, to avoid any reflection"}],"g":null,"tier":"t1","nl":1},{"id":"q-5a-116","u":"s7_p11_roadway-016","ut":"Use low-beam headlights in rain to reduce glare and light reflection.","r":"Low beams reduce glare and reflection in rain.","stem":"Rain is falling on a dark country road, and you switch to high beams to see farther. What should you do?","ci":2,"o":[{"i":2,"s":null,"t":"Switch to low beams to cut the glare off rain"},{"i":0,"s":null,"t":"Keep them, since rain hides the other lights"},{"i":1,"s":null,"t":"Keep them on, but slow down a little to be safe"}],"g":null,"tier":"t2","nl":1},{"id":"q-5a-117","u":"s7_p11_roadway-016","ut":"Use low-beam headlights in rain to reduce glare and light reflection.","r":"Low beams are the setting for rain, and low beams only are the setting for fog or heavy smoke.","stem":"Which statement is true of high beams in rain and in fog?","ci":0,"o":[{"i":0,"s":null,"t":"In both, high beams cause glare, so use low beams"},{"i":1,"s":null,"t":"High beams are best in rain; low beams are best in fog"},{"i":2,"s":null,"t":"Low beams are best in rain; high beams are best in fog"}],"g":null,"tier":"t2","nl":1},{"id":"q-5a-120","u":"s7_p11_roadway-017","ut":"Use low-beam headlights only in fog or heavy smoke; high-beams cause dangerous glare reflection.","r":"High beams cause dangerous glare in fog, so low beams only are the right choice.","stem":"Dan switches to high beams in thick fog to see farther. Eva uses low beams. Who is right, and why?","ci":2,"o":[{"i":2,"s":null,"t":"Eva, since high beams cause dangerous glare in fog"},{"i":0,"s":null,"t":"Dan, since high beams cut through fog"},{"i":3,"s":null,"t":"Eva, but only when other cars are close"}],"g":null,"tier":"t2","nl":1},{"id":"q-5a-121","u":"s7_p11_roadway-018","ut":"When hydroplaning occurs, slow down gradually and avoid sudden braking to regain vehicle control.","r":"When hydroplaning occurs, slow down gradually and avoid sudden braking to regain control.","stem":"What should you do when your car starts to hydroplane?","ci":0,"o":[{"i":0,"s":null,"t":"Slow down gradually and avoid sudden braking"},{"i":1,"s":null,"t":"Brake hard to stop as fast as possible"},{"i":3,"s":null,"t":"Pump the brakes quickly several times to slow down"}],"g":null,"tier":"t2","nl":1},{"id":"q-5a-122","u":"s7_p11_roadway-018","ut":"When hydroplaning occurs, slow down gradually and avoid sudden braking to regain vehicle control.","r":"Slow down gradually and avoid sudden braking when hydroplaning.","stem":"You hit a wide puddle at speed and the steering feels light as the car floats. What do you do first?","ci":3,"o":[{"i":3,"s":null,"t":"Ease off the gas and slow without slamming brakes"},{"i":1,"s":null,"t":"Turn the wheel to the onds ahead on the road to anticipate hazards.","r":"Ten seconds is how far ahead you should look; it is not a following gap or a safe time to look away.","stem":"What does the figure of '10 seconds' describe for a careful driver?","ci":0,"o":[{"i":0,"s":null,"t":"How far down the road to look for hazards"},{"i":1,"s":null,"t":"The gap to leave behind the vehicle you follow"},{"i":2,"s":null,"t":"The most time you may take your eyes off the road"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-013","u":"s7_p11_run2-021","ut":"In a work zone, obey the flagger. Disobeying a person who directs traffic is unlawful.","r":"A flagger's signal carries the same force as a traffic light.","stem":"A flagger in a work zone signals you. What must you do?","ci":1,"o":[{"i":1,"s":null,"t":"Obey it the way you obey a traffic light"},{"i":2,"s":null,"t":"Obey it only if a patrol car is also there"},{"i":3,"s":null,"t":"Follow the posted signs, since they outrank a person"}],"g":null,"tier":"t1","nl":1},{"id":"q-5b-014","u":"s7_p11_run2-021","ut":"In a work zone, obey the flagger. Disobeying a person who directs traffic is unlawful.","r":"A flagger's STOP is binding just like a red light, whether or not the lane looks clear.","stem":"Approaching a road crew, you see a flagger hold up a STOP paddle, yet the road ahead looks empty. What do you do?","ci":3,"o":[{"i":3,"s":null,"t":"Stop and wait until the flagger lets you go"},{"i":0,"s":null,"t":"Roll through slowly since the lane is clear"},{"i":2,"s":null,"t":"Slow down and go if no workers are in your lane"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-018","u":"s7_p11_run2-023","ut":"Headlight use during daytime is not required in California even though it improves visibility.","r":"Clear daytime driving does not require headlights, but darkness does.","stem":"Which statement about headlights is correct?","ci":0,"o":[{"i":0,"s":null,"t":"Optional on a clear day; needed after dark"},{"i":1,"s":null,"t":"Required on a clear day; optional afte 012","ut":"Reduce speed by 5 to 10 mph when driving on wet roads to maintain traction and braking distance.","r":"The guideline for wet roads is to slow down by about 5 to 10 mph.","stem":"By how much should you lower your speed on wet pavement?","ci":3,"o":[{"i":3,"s":null,"t":"By about 5 to 10 mph"},{"i":1,"s":null,"t":"By about 1 to 2 mph"},{"i":2,"s":null,"t":"By about half"}],"g":null,"tier":"t1","nl":1},{"id":"q-5b-044","u":"s7_p11_roadway-012","ut":"Reduce speed by 5 to 10 mph when driving on wet roads to maintain traction and braking distance.","r":"Wet pavement calls for about 5 to 10 mph less than you would drive on a dry road.","stem":"You are driving at 60 mph when a light rain wets the pavement. What speed is sensible?","ci":1,"o":[{"i":1,"s":null,"t":"50 to 55 mph, a drop of 5 to 10"},{"i":0,"s":null,"t":"60 mph, since it is under the limit"},{"i":2,"s":null,"t":"58 mph, a slight trim"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-045","u":"s7_p11_roadway-012","ut":"Reduce speed by 5 to 10 mph when driving on wet roads to maintain traction and braking distance.","r":"Wet roads call for a smaller cut of 5 to 10 mph; packed snow calls for half speed.","stem":"Which pairing of road surface and speed change is correct?","ci":0,"o":[{"i":0,"s":null,"t":"Wet pavement: 5 to 10 mph less; packed snow: half speed"},{"i":1,"s":null,"t":"Wet pavement: half speed; packed snow: 5 to 10 mph less"},{"i":2,"s":null,"t":"Wet pavement: 5 to 10 mph less; packed snow: 5 mph at most"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-046","u":"s7_p11_roadway-013","ut":"Reduce speed to half normal when driving on packed snow for adequate control.","r":"On packed snow, cut your speed to half to keep control.","stem":"What speed change is advised on packed snow?","ci":2,"o":[{"i":2,"s":null,"t":"Cut it to half your normal speed"},{"i":1,"s":null,"t":"Reduce it by a quarter"},{"i":3,"s":null,"t":"Drive no faster than 5 mph"}],"g":null,"tier":"t1","nl":1},{"id":"q-5b-047","u":"s7_p11_roadway-013","ut":"Reduce speed to half normal when driving on packed snow for adequate control.","r":"Half of 40 mph is 20 mph.","stem":"You usually drive a mountain road at 40 mph, and today it is covered in packed snow. What speed fits?","ci":1,"o":[{"i":1,"s":"About 20 mph","t":"About 20 mph"},{"i":0,"s":"About 35 mph","t":"About 35 mph"},{"i":2,"s":"About 5 mph","t":"About 5 mph"}],"g":null,"tier":"t2","nl":0},{"id":"q-5b-048","u":"s7_p11_roadway-013","ut":"Reduce speed to half normal when driving on packed snow for adequate control.","r":"Packed snow calls for half speed, while ice is far worse and calls for 5 mph at most.","stem":"Which pairing of surface and speed is correct?","ci":3,"o":[{"i":3,"s":null,"t":"Packed snow: half speed; ice: 5 mph at most"},{"i":0,"s":null,"t":"Packed snow: 5 mph at most; ice: half speed"},{"i":1,"s":null,"t":"Packed snow and ice: both half speed"}],"g":null,"tier":"t3","nl":1},{"id":"q-5b-049","u":"s7_p11_roadway-014","ut":"Reduce maximum speed to 5 mph when driving on ice due to extremely reduced traction.","r":"On ice, drive no faster than 5 mph, because traction is almost gone.","stem":"What is the highest speed advised on an iced-over road?","ci":1,"o":[{"i":1,"s":"5 mph","t":"5 mph"},{"i":0,"s":"15 mph","t":"15 mph"},{"i":2,"s":"25 mph","t":"25 mph"}],"g":null,"tier":"t1","nl":0},{"id":"q-5b-050","u":"s7_p11_roadway-014","ut":"Reduce maximum speed to 5 mph when driving on ice due to extremely reduced traction.","r":"On ice, the advised top speed is 5 mph.","stem":"Your 35 mph street is glazed with ice, and the car feels like it is sliding. What speed fits?","ci":3,"o":[{"i":3,"s":null,"t":"About 5 mph, barely above a walk"},{"i":1,"s":null,"t":"About 30 mph, with gentle braking"},{"i":2,"s":null,"t":"About 15 mph in a low gear"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-052","u":"s7_p11_roadway-015","ut":"Do not exceed 30 mph when visibility is reduced to less than 100 feet due to fog, rain, or snow.","r":"If you see less than 100 feet, driving faster than 30 mph is unsafe.","stem":"Heavy rain limits your view to under 100 feet. What is the top speed you should drive?","ci":2,"o":[{"i":2,"s":null,"t":"30 mph"},{"i":0,"s":null,"t":"40 mph"},{"i":1,"s":null,"t":"45 mph"}],"g":null,"tier":"t1","nl":1},{"id":"q-5b-053","u":"s7_p11_roadway-015","ut":"Do not exceed 30 mph when visibility is reduced to less than 100 feet due to fog, rain, or snow.","r":"With a view under 100 feet, 30 mph is the most you should drive.","stem":"A heavy snow squall cuts your view to about two car lengths on a 65 mph highway. What is your speed?","ci":2,"o":[{"i":2,"s":null,"t":"About 30 mph, no faster, until the view clears"},{"i":0,"s":null,"t":"About 65 mph with low beams on"},{"i":3,"s":null,"t":"About 55 mph, just a little slower"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-054","u":"s7_p11_roadway-015","ut":"Do not exceed 30 mph when visibility is reduced to less than 100 feet due to fog, rain, or snow.","r":"The figure depends on how far you can see; at under 100 feet, 30 mph is the most.","stem":"What sets the 30 mph figure for heavy rain or snow?","ci":0,"o":[{"i":0,"s":null,"t":"How far you can see, about 100 feet or less"},{"i":1,"s":null,"t":"The posted speed limit for that road"},{"i":2,"s":null,"t":"How wet or slick the road surface is"}],"g":null,"tier":"t3","nl":1},{"id":"q-5b-055","u":"s8-006","ut":"Use high-beam headlights when driving at night on open country roads or dark city streets with no oncoming traffic.","r":"High beams suit open country roads and dark streets with no oncoming traffic.","stem":"When are high-beam headlights the right choice at night?","ci":3,"o":[{"i":3,"s":null,"t":"On dark roads when no cars come toward you"},{"i":1,"s":null,"t":"Any time it is dark, whatever the traffic"},{"i":2,"s":null,"t":"In rain, to light the wet road"}],"g":null,"tier":"t1","nl":1},{"id":"q-5b-056","u":"s8-006","ut":"Use high-beam headlights when driving at night on open country roads or dark city streets with no oncoming traffic.","r":"With no oncoming traffic on a dark road, high beams show the most of the road.","stem":"At 2 a.m. you drive an unlit country road and see no other headlights. Which setting best lights the road?","ci":1,"o":[{"i":1,"s":null,"t":"High beams, since no one is coming toward you"},{"i":0,"s":null,"t":"Fog lamps alone, since they light the road edge"},{"i":2,"s":null,"t":"Low beams plus fog lamps, for extra light"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-058","u":"s8-007","ut":"Dim high-beam headlights when approaching oncoming vehicles to avoid blinding other drivers.","r":"Dim your high beams to low when you approach an oncoming vehicle, so you do not blind its driver.","stem":"You are on high beams and a car approaches from the other direction. What do you do?","ci":2,"o":[{"i":2,"s":null,"t":"Switch to low beams until it passes"},{"i":0,"s":null,"t":"Flash your high beams at it"},{"i":1,"s":null,"t":"Keep them on to see better"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-059","u":"s8-007","ut":"Dim high-beam headlights when approaching oncoming vehicles to avoid blinding other drivers.","r":"Dimming when another vehicle comes toward you protects its driver's night vision.","stem":"On a mountain road with your high beams on, headlights appear around the bend ahead. What do you do?","ci":1,"o":[{"i":1,"s":null,"t":"Switch to low beams before the car reaches you"},{"i":0,"s":null,"t":"Stay on high beams until you are side by side"},{"i":2,"s":null,"t":"Flash your high beams twice"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-060","u":"s8-007","ut":"Dim high-beam headlights when approaching oncoming vehicles to avoid blinding other drivers.","r":"You can use high beams while the road is empty, then dim as the car comes toward you.","stem":"Which sequence of lights is right on a dark road with an oncoming car?","ci":3,"o":[{"i":3,"s":null,"t":"High beams, then low beams as the car approaches"},{"i":1,"s":null,"t":"High beams the whole way, flashing when it is near"},{"i":2,"s":null,"t":"Low beams the whole way, high beams when passing it"}],"g":null,"tier":"t3","nl":1},{"id":"q-5b-061","u":"s7_p11_roadway-016","ut":"Use low-beam headlights in rain to reduce glare and light reflection.","r":"Low beams reduce reflection off raindrops and glare in your eyes.","stem":"Which headlights should you use while driving in rain?","ci":1,"o":[{"i":1,"s":null,"t":"Low beams, which cause less glare off the rain"},{"i":0,"s":null,"t":"High beams, so you see more of the wet road"},{"i":2,"s":null,"t":"Parking lights, so the rain does not reflect"}],"g":null,"tier":"t1","nl":1},{"id":"q-5b-062","u":"s7_p11_roadway-016","ut":"Use low-beam headlights in rain to reduce glare and light reflection.","r":"Low beams cut glare from the rain, even when no car is coming.","stem":"At night in a downpour on an empty highway, you want more light. Which setting do you choose?","ci":3,"o":[{"i":3,"s":null,"t":"Low beams, since rain scatters high beams"},{"i":1,"s":null,"t":"Fog lamps alone, since they sit low on the car"},{"i":2,"s":null,"t":"Fog lamps and high beams together"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-063","u":"s7_p11_roadway-016","ut":"Use low-beam headlights in rain to reduce glare and light reflection.","r":"The raindrops scatter the high-beam light back toward you, which creates glare.","stem":"Why are high beams a poor choice in rain?","ci":0,"o":[{"i":0,"s":null,"t":"The light reflects off the raindrops back into your eyes"},{"i":2,"s":null,"t":"They shine too wide to show where the road edge is"},{"i":3,"s":null,"t":"They are too weak to light up wet pavement well"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-065","u":"s7_p11_roadway-017","ut":"Use low-beam headlights only in fog or heavy smoke; high-beams cause dangerous glare reflection.","r":"Heavy smoke reflects high beams back at you, so use low beams.","stem":"On a freeway, smoke from a nearby fire drifts across the road. You are on high beams. What now?","ci":2,"o":[{"i":2,"s":null,"t":"Switch to low beams to cut the glare"},{"i":0,"s":null,"t":"Keep high beams to cut through the smoke"},{"i":1,"s":null,"t":"Turn on your hazard flashers and keep high beams"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-067","u":"s8-010","ut":"Never drive using only parking lights, even though vehicle instruments show lights are on.","r":"Parking lights alone are not enough for driving; use the headlights.","stem":"Your dashboard shows a lights symbol, but only the parking lights are lit. What does night driving need?","ci":3,"o":[{"i":3,"s":null,"t":"Headlights, because parking lights alone are not enough"},{"i":0,"s":null,"t":"Nothing more, since the dash symbol shows your lights work"},{"i":1,"s":null,"t":"Parking lights and fog lamps, which are bright enough"}],"g":null,"tier":"t1","nl":1},{"id":"q-5b-068","u":"s8-010","ut":"Never drive using only parking lights, even though vehicle instruments show lights are on.","r":"A dash symbol can show parking lights only; switch to the headlights.","stem":"It is dusk and the dash shows a lights symbol, but you only turned on the parking lights. What do you do?","ci":1,"o":[{"i":1,"s":null,"t":"Turn on the headlights now, before it gets darker"},{"i":2,"s":null,"t":"Turn on the hazard flashers instead"},{"i":3,"s":null,"t":"Wait until full dark to switch on the headlights"}],"g":null,"tier":"t2","nl":1},{"id":"q-5b-070","u":"s6_p11_roadway-043","ut":"Check blind spots by looking over your right and left shoulders before changing lanes, turning, or parking.","r":"Turn your head and look over each shoulder through the side windows.","stem":"How do you check your blind spots before you change lanes?","ci":2,"o":[{"i":2,"s":null,"t":"Look over your left and right shoulders"},{"i":0,"s":null,"t":"Look in the rearview mirror twice"},{"i":3,"s":null,"t":"Lean forward and check the side mirror"}],"g":null,"tier":"t1","nl":1},{"id":"q-5b-071","u":"s6_p11_roadway-043","ut":"Check blind spots b _run3-003","ut":"Expect a cyclist with an arm pointing down to stop; slow down and keep your distance.","r":"A downward arm warns that the cyclist is stopping or slowing.","stem":"Which cyclist signal works like a car's brake lights?","ci":0,"o":[{"i":0,"s":null,"t":"An arm pointing down"},{"i":2,"s":null,"t":"An arm out to the right"},{"i":3,"s":null,"t":"An arm held up"}],"g":null,"tier":"t2","nl":1},{"id":"q-6-145","u":"s7_p11_run3-004","ut":"Expect cyclists to travel in the same direction as traffic, and look for them ahead.","r":"Cyclists must ride in the direction of traffic flow.","stem":"In which direction must a cyclist ride on the road?","ci":0,"o":[{"i":0,"s":null,"t":"With traffic, in the same direction as the cars"},{"i":1,"s":null,"t":"Against traffic, so they can see the cars coming"},{"i":2,"s":null,"t":"Against traffic, when they are in a bike lane"}],"g":null,"tier":"t1","nl":1},{"id":"q-6-151","u":"s6_p11_roadway-035","ut":"Give motorcycles full lane width when being passed by them.","r":"Give a motorcycle the full lane width when it passes you.","stem":"How much of a lane should you leave for a motorcycle that is passing you?","ci":3,"o":[{"i":3,"s":null,"t":"The full lane width"},{"i":0,"s":null,"t":"Two-thirds of the lane"},{"i":1,"s":null,"t":"The space ahead of your bumper"}],"g":null,"tier":"t1","nl":1},{"id":"q-6-155","u":"s6_p11_roadway-036","ut":"Check your mirrors often when changing lanes due to motorcycles hiding in blind spots.","r":"A mirror can miss a motorcycle, so look over your shoulder too.","stem":"You signal to move left. Your mirror shows an empty lane. What else do you do?","ci":3,"o":[{"i":3,"s":null,"t":"Glance over your shoulder for a motorcycle before you move"},{"i":0,"s":null,"t":"Slow sharply and wait for a bigger gap in the mirror"},{"i":1,"s":null,"t":"Honk to warn any rider who may be there"}],"g":null,"tier":"t2","nl":1},{"id":"q-6-158","u":"s6_p11_run2-008","ut":"Emergency vehicle with siren and lights approachin ":null,"t":"Park beside it if you stay in the car"}],"g":null,"tier":"t1","nl":1},{"id":"q-7-089","u":"s6b-17","ut":"Never park within 3 feet of a wheelchair ramp; keep it clear for people who need it.","r":"Never park within 3 feet of a wheelchair ramp. Two feet is too close.","stem":"You plan to leave your car at a curb for an hour. Its nose sits about 2 feet from a wheelchair ramp. What do you do?","ci":0,"o":[{"i":0,"s":null,"t":"Move the car at least 3 feet clear of the ramp"},{"i":1,"s":null,"t":"Leave it, since you are not touching the ramp"},{"i":3,"s":null,"t":"Move it a little, but only 6 inches further from the ramp"}],"g":null,"tier":"t2","nl":1},{"id":"q-7-090","u":"s6b-17","ut":"Never park within 3 feet of a wheelchair ramp; keep it clear for people who need it.","r":"Parking within 3 feet of a wheelchair ramp is illegal.","stem":"How close to a wheelchair ramp is parking illegal?","ci":1,"o":[{"i":1,"s":null,"t":"Within 3 feet of the ramp"},{"i":0,"s":null,"t":"Within 5 feet of the ramp's center"},{"i":3,"s":null,"t":"Only when the ramp is in use"}],"g":null,"tier":"t3","nl":1},{"id":"q-7-091","u":"s7_p11_roadway-022","ut":"Cargo extending more than 6 inches beyond the right fender is illegal.","r":"Cargo that extends more than 6 inches beyond the right fender is illegal.","stem":"How far may a load stick out past the right fender of your vehicle?","ci":2,"o":[{"i":2,"s":null,"t":"Up to 6 inches"},{"i":0,"s":null,"t":"Up to 12 inches"},{"i":1,"s":null,"t":"Up to 4 feet, if flagged"}],"g":null,"tier":"t1","nl":1},{"id":"q-7-092","u":"s7_p11_roadway-022","ut":"Cargo extending more than 6 inches beyond the right fender is illegal.","r":"Cargo may not extend more than 6 inches beyond the right fender.","stem":"A long board on your pickup sticks out about 9 inches past the right fender. What should you do?","ci":0,"o":[{"i":0,"s":null,"t":"Pull it in so it sticks out no more than 6 inches"},{"i":2,"s":null,"t":"Move it to the left side, where there is more igh to drive with?","ci":2,"o":[{"i":2,"s":null,"t":"When it costs you control or view"},{"i":0,"s":null,"t":"When it weighs more than 500 pounds"},{"i":1,"s":null,"t":"When it sits higher than the roof"}],"g":null,"tier":"t1","nl":1},{"id":"q-7-098","u":"s7_p11_roadway-024","ut":"Never drive a vehicle that is overloaded to the point where you lose control or visibility.","r":"You may not drive when the load costs you visibility or control of the vehicle.","stem":"On moving day, boxes on the front passenger seat block half your view through the windshield. What do you do?","ci":3,"o":[{"i":3,"s":null,"t":"Rearrange the load so you can see and control the car"},{"i":0,"s":null,"t":"Drive slowly in the right lane with your hazard lights on"},{"i":1,"s":null,"t":"Leave it if every box is tied down well"}],"g":null,"tier":"t2","nl":1},{"id":"q-7-099","u":"s7_p11_roadway-024","ut":"Never drive a vehicle that is overloaded to the point where you lose control or visibility.","r":"Never drive a vehicle overloaded to the point where you lose control or visibility.","stem":"Which effect of an overloaded vehicle makes it illegal to drive?","ci":2,"o":[{"i":2,"s":null,"t":"You lose control or cannot see well"},{"i":1,"s":null,"t":"The trunk lid will not close"},{"i":3,"s":null,"t":"The car weighs more than when it is empty"}],"g":null,"tier":"t2","nl":1},{"id":"q-7-100","u":"s7_p11_roadway-025","ut":"Animals in a truck bed must be properly secured to prevent them from falling or jumping out.","r":"Animals in a truck bed must be properly secured to prevent them from falling or jumping out.","stem":"What must be done with a dog that rides in the open bed of a pickup?","ci":0,"o":[{"i":0,"s":null,"t":"It must be properly secured"},{"i":2,"s":null,"t":"Nothing, if the dog is well trained"},{"i":3,"s":null,"t":"It must wear a collar with a tag"}],"g":null,"tier":"t1","nl":1},{"id":"q-7-102","u":"s7_p11_roadway-025","ut":"Animals in a truck bed must be properly secured to prevent them from falling or jumping out.","r":"The animal must be secured. Tailgates, training and low speed do not secure it.","stem":"Which of these meets the rule for an animal in an open truck bed?","ci":2,"o":[{"i":2,"s":null,"t":"A tether that stops it falling out"},{"i":0,"s":null,"t":"A raised tailgate that is latched shut"},{"i":3,"s":null,"t":"Driving slowly on side streets only"}],"g":null,"tier":"t2","nl":1},{"id":"q-7-106","u":"s7_p11_run3-005","ut":"Cannot back a vehicle on a highway unless movement can be made with reasonable safety.","r":"You may not back a vehicle on a highway unless the move can be made with reasonable safety.","stem":"When may you back a vehicle on a highway?","ci":3,"o":[{"i":3,"s":null,"t":"Only when it is reasonably safe"},{"i":1,"s":null,"t":"Only for up to 100 feet in one move"},{"i":2,"s":null,"t":"Never, under any circumstances"}],"g":null,"tier":"t1","nl":1},{"id":"q-7-107","u":"s7_p11_run3-005","ut":"Cannot back a vehicle on a highway unless movement can be made with reasonable safety.","r":"Backing on a highway is allowed only when it can be done with reasonable safety. Here it cannot.","stem":"You overshoot a driveway on a busy, fast street. Cars are coming behind you. What do you do?","ci":0,"o":[{"i":0,"s":null,"t":"Go around the block and return"},{"i":1,"s":null,"t":"Turn on your hazards and back up slowly"},{"i":3,"s":null,"t":"Make a U-turn on the spot"}],"g":null,"tier":"t2","nl":1},{"id":"q-7-108","u":"s7_p11_run3-005","ut":"Cannot back a vehicle on a highway unless movement can be made with reasonable safety.","r":"The law asks only whether the backing can be made with reasonable safety.","stem":"Which condition decides whether backing up on a highway is legal?","ci":2,"o":[{"i":2,"s":null,"t":"Whether the move is reasonably safe"},{"i":0,"s":null,"t":"Whether you signaled and honked"},{"i":3,"s":null,"t":"Whether the speed limit is under 35 mph"}],"g":null,"tier":"t3","nl":1},{"id":"q-7-109","u":"s7b-25","ut":"At night, expect a cyclist's white front light, visible from 300 feet; slow down and look for it.","r":"A bicycle ridden at night must show a white front light visible from at least 300 feet.","stem":"At night, how far away must a bicycle's white front light be visible?","ci":3,"o":[{"i":3,"s":"300 feet","t":"300 feet"},{"i":0,"s":"100 feet","t":"100 feet"},{"i":2,"s":"200 feet","t":"200 feet"}],"g":null,"tier":"t1","nl":0},{"id":"q-7-111","u":"s7b-25","ut":"At night, expect a cyclist's white front light, visible from 300 feet; slow down and look for it.","r":"A bicycle's white front light must be visible from at least 300 feet.","stem":"A cyclist rides after dark. From what distance must the white lamp on the handlebars be visible?","ci":3,"o":[{"i":3,"s":null,"t":"At least 300 feet"},{"i":0,"s":null,"t":"At least 200 feet"},{"i":2,"s":null,"t":"At least 100 feet"}],"g":null,"tier":"t3","nl":1},{"id":"q-7-114","u":"s7b-26","ut":"At night, scan ahead for a cyclist's small red rear reflector, and slow down so you can stop.","r":"At night a bicycle needs a red reflector on the rear, or a red light with a built-in reflector.","stem":"A friend's bike has a white reflector on the back and a white light on the front. What is missing for night riding?","ci":2,"o":[{"i":2,"s":null,"t":"A red reflector on the rear"},{"i":0,"s":null,"t":"A horn that can be heard from 200 feet"},{"i":1,"s":null,"t":"A white front light that shows from 500 feet"}],"g":null,"tier":"t3","nl":1},{"id":"q-7-118","u":"s7c-14","ut":"When a load sticks out four feet or more past the rear, two red lights are required at night.","r":"A load sticking out four feet or more needs two red lights at night.","stem":"At night, what must mark a load that sticks out four feet or more past the rear?","ci":2,"o":[{"i":2,"s":null,"t":"Two red lights at the end of the load"},{"i":0,"s":null,"t":"A red flag held out on a pole"},{"i":3,"s":null,"t":"A single red lamp fixed to the taillamp bracket"}],"g":null,"tier":"t1","nl":1},{"id":"q-7-119","u":"s7c-14","ut":"When a load sticks out four feet or more past the rear, two red lights are required at night.","r":"At night a load of four feet or more past the rear needs two red lights.","stem":"After dark you drive home with a plank that sticks out 6 feet past your tailgate. What must you show at its end?","ci":0,"o":[{"i":0,"s":null,"t":"Two red lights at the end of it"},{"i":1,"s":null,"t":"A red flag at the end, as in daytime"},{"i":2,"s":null,"t":"One red light mounted at the center"}],"g":null,"tier":"t2","nl":1},{"id":"q-7-120","u":"s7c-14","ut":"When a load sticks out four feet or more past the rear, two red lights are required at night.","r":"A load sticking out four feet or more needs two red lights at night.","stem":"A load sticks out 5 feet past the rear of your vehicle at night. What does the law require?","ci":2,"o":[{"i":2,"s":null,"t":"Two red lights at the end of the load"},{"i":1,"s":null,"t":"One red light at the end of the load, plus a red flag"},{"i":3,"s":null,"t":"A white light at the end of the load, visible to the rear"}],"g":null,"tier":"t2","nl":1},{"id":"q-7-121","u":"s7_p11_roadway-025","ut":"Animals in a truck bed must be properly secured to prevent them from falling or jumping out.","r":"Animals in an open truck bed must be secured so they cannot jump or fall out.","stem":"Which of these meets the rule for a dog riding in an open pickup bed?","ci":2,"o":[{"i":2,"s":null,"t":"A dog tied too short to reach the side"},{"i":1,"s":null,"t":"A dog standing on the wheel wells"},{"i":3,"s":null,"t":"A dog in a harness that is not attached"}],"g":null,"tier":"t1","nl":1},{"id":"q-7-122","u":"s7_p11_roadway-025","ut":"Animals in a truck bed must be properly secured to prevent them from falling or jumping out.","r":"Animals in an open truck bed must be properly secured against falling or jumping out.","stem":"You haul two goats to a fair in an open truck bed. What must you do before you leave?","ci":0,"o":[{"i":0,"s":null,"t":"Secure them so they cannot jump out"},{"i":2,"s":null,"t":"Drive slowly, under 25 mph"},{"i":3,"s":null,"t":"Cover the bed with a loose tarp"}],"g":null,"tier":"t2","nl":1},{"id":"q-7-133","u":"s7c-19","ut":"Objects may be attached to vehicle side windows only in locations behind the driver.","r":"Objects may be attached to side windows only in locations behind the driver.","stem":"Where may objects be attached to a vehicle's side windows?","ci":3,"o":[{"i":3,"s":null,"t":"Only in locations behind the driver"},{"i":1,"s":null,"t":"Anywhere, if the object is under 5 inches"},{"i":2,"s":null,"t":"Only in the lower corners of the driver's window"}],"g":null,"tier":"t1","nl":1},{"id":"q-7-134","u":"s7c-19","ut":"Objects may be attached to vehicle side windows only in locations behind the driver.","r":"Objects may be attached to side windows only behind the driver.","stem":"You want to attach a see-through sun shade with suction cups to a window. Which window may it go on?","ci":3,"o":[{"i":3,"s":null,"t":"A rear side window behind the driver"},{"i":0,"s":null,"t":"The driver's window, if pulled halfway"},{"i":2,"s":null,"t":"Any window, since it is see-through"}],"g":null,"tier":"t2","nl":1},{"id":"q-7-139","u":"s9_p11_run2-003","ut":"An open container of alcohol is illegal in a car, unless it is sealed or in the trunk.","r":"An open container of alcohol is illegal in the car unless it is sealed or in the trunk.","stem":"Where may a driver carry a bottle of wine that has been opened?","ci":3,"o":[{"i":3,"s":"In the trunk","t":"In the trunk"},{"i":0,"s":"On the back seat","t":"On the back seat"},{"i":2,"s":"Under the front seat","t":"Under the front seat"}],"g":null,"tier":"t1","nl":0},{"id":"q-7-141","u":"s9_p11_run2-003","ut":"An open container of alcohol is illegal in a car, unless it is sealed or in the trunk.","r":"An open container of alcohol is illegal in a car unless it is sealed or in the trunk.","stem":"Where may an open bottle of wine legally be carried in a car?","ci":1,"o":[{"i":1,"s":null,"t":"In the trunk"},{"i":0,"s":null,"t":"In the glove box"},{"i":2,"s":null,"t":"Under the front seat"}],"g":null,"tier":"t3","nl":1},{"id":"q-gaps-001","u":"p13e_gaps-001","ut":"Approach a left turn from the far-left lane for your direction, and do not turn before entering the intersection.","r":"The approach to a left turn is made from the lane next to the center line.","stem":"On a two-way street with no turn markings, where should your car sit when you start a left turn?","ci":2,"o":[{"i":2,"s":null,"t":"In the lane next to the center line"},{"i":1,"s":null,"t":"In whichever lane has the fewest waiting cars"},{"i":3,"s":null,"t":"Straddling two lanes, to claim the turn early"}],"g":null,"tier":"t1","nl":1},{"id":"q-gaps-003","u":"p13e_gaps-001","ut":"Approach a left turn from the far-left lane for your direction, and do not turn before entering the intersection.","r":"A left turn starts beside the center line and a right turn starts beside the curb.","stem":"Which pairing of starting lanes is right for turns on an ordinary two-way street?","ci":3,"o":[{"i":3,"s":null,"t":"Left from the center-line lane; right from the curb lane"},{"i":0,"s":null,"t":"Left from the curb lane; right from the center-line lane"},{"i":1,"s":null,"t":"Both from the center-line lane, to see better"}],"g":null,"tier":"t2","nl":1},{"id":"q-gaps-004","u":"p13e_gaps-002","ut":"Usually approach and make a right turn as close as practicable to the right curb or edge of the road.","r":"A right turn is set up and made as close to the right curb or edge as is practical.","stem":"Where on the road do you position your car as you approach an ordinary right turn?","ci":1,"o":[{"i":1,"s":null,"t":"As close as is practical to the right curb or edge"},{"i":2,"s":null,"t":"Next to the center line, to leave room for a wide arc"},{"i":3,"s":null,"t":"In the lane with the least traffic behind you"}],"g":null,"tier":"t1","nl":1},{"id":"q-gaps-010","u":"p13e_gaps-004","ut":"A center left-turn lane is for turning only, not for passing or regular travel.","r":"A center turn lane may be used to get ready for or make a left turn.","stem":"Which use of a center left-turn lane is allowed?","ci":2,"o":[{"i":2,"s":null,"t":"Getting into position before a left turn"},{"i":1,"s":null,"t":"Driving a long stretch to skip a traffic jam"},{"i":3,"s":null,"t":"Stopping there to let passengers out"}],"g":null,"tier":"t1","nl":1},{"id":"q-gaps-013","u":"p13e_gaps-005","ut":"Enter a freeway only by a designated on-ramp, and leave it only by a designated off-ramp.","r":"A freeway with full access control is entered only by a designated on-ramp.","stem":"At a freeway with full access control, where may you enter it?","ci":0,"o":[{"i":0,"s":null,"t":"Only by a designated on-ramp built for entering"},{"i":1,"s":null,"t":"At any gap where the roadside fence has an opening"},{"i":2,"s":null,"t":"At any side street that meets the freeway"}],"g":null,"tier":"t1","nl":1},{"id":"q-gaps-014","u":"p13e_gaps-005","ut":"Enter a freeway only by a designated on-ramp, and leave it only by a designated off-ramp.","r":"A freeway of this kind is left only by a designated off-ramp, so you go on to the next one.","stem":"You miss your exit on a freeway. Ahead, an open gate in the roadside fence leads to a service road. What do you do?","ci":2,"o":[{"i":2,"s":null,"t":"Keep going and leave at the next off-ramp"},{"i":1,"s":null,"t":"Back up along the shoulder to the exit you missed"},{"i":3,"s":null,"t":"Slow to a crawl in the right lane and turn in at the gate"}],"g":null,"tier":"t2","nl":1},{"id":"q-gaps-015","u":"p13e_gaps-005","ut":"Enter a freeway only by a designated on-ramp, and leave it only by a designated off-ramp.","r":"Entering is by a designated on-ramp and leaving is by a designated off-ramp.","stem":"Which pair of actions matches the rule for a freeway with full access control?","ci":3,"o":[{"i":3,"s":null,"t":"Enter at an on-ramp, leave at an off-ramp"},{"i":0,"s":null,"t":"Enter by an off-ramp that is empty, leave by an on-ramp"},{"i":2,"s":null,"t":"Enter at an on-ramp, leave at the nearest gap"}],"g":null,"tier":"t2","nl":1},{"id":"q-gaps-016","u":"p13e_gaps-006","ut":"Merge from an on-ramp only when it is safe, and signal before you move over.","r":"Move into freeway traffic only when it can be done with reasonable safety, after signaling.","stem":"At the end of an on-ramp, when may you move into the freeway lane?","ci":0,"o":[{"i":0,"s":null,"t":"When you can do it safely, after signaling"},{"i":1,"s":null,"t":"As soon as your speed matches the lane's traffic"},{"i":3,"s":null,"t":"Whenever the car in that lane brakes to let you in"}],"g":null,"tier":"t1","nl":1},{"id":"q-gaps-020","u":"p13e_gaps-007","ut":"Do not stop or crawl on an on-ramp and block traffic, unless safety or law requires it.","r":"Matching traffic speed and merging avoids the slow or stopped car that blocks the ramp.","stem":"You are nervous at the end of an on-ramp. Fast traffic is passing, but a gap you can reach is coming up. What do you do?","ci":0,"o":[{"i":0,"s":null,"t":"Speed up to match traffic, signal, and merge into the gap"},{"i":2,"s":null,"t":"Slow to a crawl and signal until someone lets you in"},{"i":3,"s":null,"t":"Speed up and cut into the gap without signaling"}],"g":null,"tier":"t2","nl":1},{"id":"q-gaps-021","u":"p13e_gaps-007","ut":"Do not stop or crawl on an on-ramp and block traffic, unless safety or law requires it.","r":"A red ramp signal is a legal reason to stop; the other choices are not.","stem":"On an on-ramp, which of these is a good reason to stop?","ci":2,"o":[{"i":2,"s":null,"t":"The signal on the ramp shows red"},{"i":0,"s":null,"t":"The freeway traffic ahead looks fast"},{"i":1,"s":null,"t":"You feel unsure about merging"}],"g":null,"tier":"t2","nl":1},{"id":"q-gaps-024","u":"p13e_gaps-008","ut":"Never park on the boundary lines of an off-street disabled parking space, even with a placard.","r":"A placard lets you use the stall itself; the lines are off limits to every driver.","stem":"Which of these does a valid disabled placard let you do in a lot?","ci":0,"o":[{"i":0,"s":null,"t":"Park fully inside a marked disabled stall"},{"i":1,"s":null,"t":"Park with a tire on the stall's boundary line"},{"i":2,"s":null,"t":"Park in the hatched aisle beside the stall"}],"g":null,"tier":"t2","nl":1},{"id":"q-gaps-028","u":"p13e_gaps-010","ut":"Parking uphill at a curb, turn your front wheels away from the curb.","r":"Facing uphill at a curb, the front wheels turn away from the curb so the car rolls back to it.","stem":"You park facing uphill beside a curb. Which way do you turn your front wheels?","ci":0,"o":[{"i":0,"s":null,"t":"Away from the curb, toward the street"},{"i":2,"s":null,"t":"Straight ahead, with the parking brake on"},{"i":3,"s":null,"t":"Toward the curb, then roll forward to touch it"}],"g":null,"tier":"t1","nl":1},{"id":"q-gaps-031","u":"p13e_gaps-011","ut":"Where local law requires it, block the wheels of an unattended car on a grade over 3 percent.","r":"The wheel-blocking rule applies to a grade over 3 percent.","stem":"Where local law adopts the rule, an unattended car's wheels must be blocked on a grade over how many percent?","ci":1,"o":[{"i":1,"s":"3 percent","t":"3 percent"},{"i":2,"s":"6 percent","t":"6 percent"},{"i":3,"s":"10 percent","t":"10 percent"}],"g":null,"tier":"t1","nl":0},{"id":"q-gaps-035","u":"p13e_gaps-012","ut":"With limited exceptions, wearing a headset or earplugs in both ears while driving is illegal in California.","r":"Leaving one ear free keeps you within the rule.","stem":"You want to listen to a podcast on your commute. Which setup is allowed?","ci":2,"o":[{"i":2,"s":null,"t":"One earbud in, the other ear left open"},{"i":0,"s":null,"t":"Earbuds in both ears with the volume low"},{"i":1,"s":null,"t":"Noise-canceling headphones over both ears, no sound playing"}],"g":null,"tier":"t2","nl":1},{"id":"q-gaps-037","u":"p13e_gaps-013","ut":"A neighborhood electric vehicle may not use roads with a speed limit over 35 mph.","r":"A neighborhood electric vehicle may not use a road with a limit above 35 mph.","stem":"Above what posted speed limit may a neighborhood electric vehicle not use a road?","ci":1,"o":[{"i":1,"s":"35 mph","t":"35 mph"},{"i":0,"s":"25 mph","t":"25 mph"},{"i":2,"s":"45 mph","t":"45 mph"}],"g":null,"tier":"t1","nl":0},{"id":"q-gaps-039","u":"p13e_gaps-013","ut":"A neighborhood electric vehicle may not use roads with a speed limit over 35 mph.","r":"The vehicle's top speed is 25 mph and its road limit cutoff is 35 mph.","stem":"For a neighborhood electric vehicle, which pair is right: its top speed, then the highest limit of a road it may use?","ci":3,"o":[{"i":3,"s":"25 mph, then 35 mph","t":"25 mph, then 35 mph"},{"i":0,"s":"35 mph, then 25 mph","t":"35 mph, then 25 mph"},{"i":1,"s":"25 mph, then 25 mph","t":"25 mph, then 25 mph"}],"g":null,"tier":"t3","nl":0},{"id":"q-gaps-041","u":"p13e_gaps-014","ut":"In a street or lot space reserved for electric charging, park only if your vehicle is plugged in to charge.","r":"The stall requires the car to be connected, so a car that is not charging parks elsewhere.","stem":"You drive an electric car with a full battery. The only free stall near the store is a charging stall. What do you do?","ci":2,"o":[{"i":2,"s":null,"t":"Park in a regular stall unless you plug in to charge"},{"i":0,"s":null,"t":"Park there; the stall is for electric cars like yours"},{"i":1,"s":null,"t":"Park there, but only for a short shopping trip"}],"g":null,"tier":"t2","nl":1},{"id":"q-gaps-042","u":"p13e_gaps-014","ut":"In a street or lot space reserved for electric charging, park only if your vehicle is plugged in to charge.","r":"Only the car that is connected for charging is parked legally in the stall.","stem":"Two electric cars sit in charging stalls. Eve's is plugged in. Finn's is not, though its battery is full. Who is parked legally?","ci":1,"o":[{"i":1,"s":"Only Eve","t":"Only Eve"},{"i":0,"s":"Both of them","t":"Both of them"},{"i":2,"s":"Only Finn","t":"Only Finn"}],"g":null,"tier":"t2","nl":0},{"id":"q-gaps-043","u":"p13e_gaps-015","ut":"Do not park in a space reserved for parking or fueling zero-emission vehicles unless you drive a zero-emission vehicle.","r":"A zero-emission space is for a driver whose car is zero-emission.","stem":"A sign reserves a space for zero-emission vehicles. Which driver may park there?","ci":3,"o":[{"i":3,"s":null,"t":"Only a driver whose car has no tailpipe emissions at all"},{"i":0,"s":null,"t":"Only a driver whose car runs partly on electricity"},{"i":2,"s":null,"t":"Anyone at all, once the rest of the lot is full"}],"g":null,"tier":"t1","nl":1},{"id":"q-gaps-044","u":"p13e_gaps-015","ut":"Do not park in a space reserved for parking or fueling zero-emission vehicles unless you drive a zero-emission vehicle.","r":"A driver of a gasoline car uses an unreserved space.","stem":"You drive a gasoline car. The nearest free space has a sign reserving it for zero-emission cars. What do you do?","ci":0,"o":[{"i":0,"s":null,"t":"Take an unreserved space, even if it is farther away"},{"i":2,"s":null,"t":"Use the reserved space only after the rest of the lot fills"},{"i":3,"s":null,"t":"Use that space for a short stop with your hazard lights on"}],"g":null,"tier":"t2","nl":1},{"id":"q-gaps-046","u":"p13e_gaps-016","ut":"Speed up and slow down smoothly and keep a steady speed to save fuel and cut emissions.","r":"Smooth speed changes and a steady speed save fuel and cut emissions.","stem":"Which driving habit saves fuel and cuts emissions?","ci":1,"o":[{"i":1,"s":null,"t":"Smooth speed changes and a steady cruising speed"},{"i":0,"s":null,"t":"Coasting in neutral down every hill"},{"i":3,"s":null,"t":"Warming the engine for a long time before each trip"}],"g":null,"tier":"t1","nl":1},{"id":"q-gaps-049","u":"p13e_gaps-017","ut":"Keep your tires inflated and carry no extra weight to save fuel and cut emissions.","r":"Proper tire inflation and less weight both cut fuel use and emissions.","stem":"Which pair of habits cuts fuel use and emissions?","ci":2,"o":[{"i":2,"s":null,"t":"Properly inflated tires and less weight"},{"i":0,"s":null,"t":"Softer tires and a lighter trunk"},{"i":1,"s":null,"t":"Properly inflated tires and a trunk full of gear"}],"g":null,"tier":"t1","nl":1},{"id":"q-gaps-051","u":"p13e_gaps-017","ut":"Keep your tires inflated and carry no extra weight to save fuel and cut emissions.","r":"Tire pressure and carried weight both change fuel use.","stem":"Which statement about fuel use is right?","ci":3,"o":[{"i":3,"s":null,"t":"Proper tire pressure and a lighter load both cut fuel use"},{"i":0,"s":null,"t":"Tire pressure changes only how the ride feels"},{"i":2,"s":null,"t":"Only passengers add weight that costs fuel, not cargo"}],"g":null,"tier":"t2","nl":1}];

/* ---------- the wide question pool (card RH2c, item 2) ----------

 From checkpoint 1 on (segment 2 and later) a question moment is a pool question 60 percent of the time, and also when the Rush unit of the moment has no unused question left. The pool is dealt in a daily-seeded order;
 no question repeats in a run (G.usedQ) until the pool runs out. Sign questions show the sign picture (RUSH_SIGNS, inline SVG) in the free band under the timer bar. */
const POOL_W=(DEV&&+Q.get('pw'))||5;   /* seconds to answer a pool question after the reading delay (Rush unit questions: 7 s first ask, 5 s re-ask); x0.9 per segment, x2 on Calm */
const POOL_RD_MAX=8;   /* a pool question's reading delay is 0.3 s a word, at most 8 s (the bar words count when the signs only name the lane) */
const POOL_ORD=shuf(RUSH_POOL.map((p,i)=>i),mul(SEED*57+3));
SC.pool={hold:0};
const SIGNIMG={};
function signImg(id){if(!id||!RUSH_SIGNS[id])return null;if(!SIGNIMG[id]){const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(RUSH_SIGNS[id]);SIGNIMG[id]=im}const im=SIGNIMG[id];return im.complete&&im.naturalWidth?im:null}
/* the picture of the sign a question asks about: a white tile with the sign, centred in the band between the timer bar label and the answer rows */
function drawQSign(){const g=G,q=g.q;if(!q||!q.sign||(g.phase!=='quiz'&&g.phase!=='res'))return;const R=g.res;if(R&&R.ok&&R.t>.35)return;if(R&&!R.ok&&R.dt!==undefined)return;
 const lay=qLayout(),y0=lay.ty+42,y1=lay.top-8,sz=Math.min(132,y1-y0);if(sz<56)return;const im=signImg(q.sign);if(!im)return;
 const a=ease(q.t/.4),x=CX-sz/2,y=y0+(y1-y0-sz)/2;cx.save();cx.globalAlpha=a;RR(x-8,y-8,sz+16,sz+16,14);cx.fillStyle='rgba(255,255,255,.94)';cx.fill();cx.lineWidth=3;cx.strokeStyle='#ffd23f';cx.stroke();cx.drawImage(im,x,y,sz,sz);cx.restore()}

/* ---------- audio: WebAudio synth, no files. Ported from the slice (game/src/audio/engine.ts, schedule.ts) ---------- */
const MK='greenlight.rush.muted',CK='greenlight.rush.calm';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let MUTED=store.get(MK)==='1',CALM=store.get(CK)==='1',AC=null,AE=null;
const m2hz=m=>440*Math.pow(2,(m-69)/12);
/* one note envelope: 0, ramp up, hold, ramp down; every ramp is anchored by a setValueAtTime (schedule.ts noteEnvelope) */
function noteEnv(p,t,hold,peak,att,rel){const a=Math.max(att,.008),h=Math.max(hold,a),r=Math.max(rel,.02);
 p.setValueAtTime(0,t);p.linearRampToValueAtTime(peak,t+a);p.setValueAtTime(peak,t+h);p.linearRampToValueAtTime(0,t+h+r);return t+h+r}
/* small dark reverb impulse: seeded noise through a one-pole low-pass (schedule.ts buildImpulse) */
function impulse(len,seed,decay,damp){let a=seed>>>0;const rn=()=>{a=(a+0x6d2b79f5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
 const o=new Float32Array(len);let y=0;for(let i=0;i<len;i++){y+=damp*(rn()*2-1-y);o[i]=y*Math.pow(1-i/len,decay)}return o}
/* the driving loop: 112 BPM, 8 bars, A minor (Am F C G Am F G Em). Stems: pad, bass, pulse always; drums from streak x2; lead from streak x3. */
const BPM=112,BEAT=60/BPM,BPB=4,LOOP_BEATS=32;
const CH=[{b:45,p:[57,60,64]},{b:41,p:[53,57,60]},{b:48,p:[55,60,64]},{b:43,p:[55,59,62]},{b:45,p:[57,60,64]},{b:41,p:[53,57,60]},{b:43,p:[55,59,62]},{b:40,p:[52,55,59]}];
const BASSP=[[0,.45,0,1],[.75,.2,0,.7],[1.5,.4,12,.8],[2,.45,0,.95],[2.75,.2,0,.7],[3.5,.4,7,.8]];  /* beat, length, semitones above the root, velocity */
const PULSEP=[[0,1,2,1,0,1,2,1],[2,1,0,1,2,1,0,2]],LEADP=[[0,1],[1.5,2],[2,1],[3,0]];
function buildScore(){const ev=[];CH.forEach((c,bar)=>{const b0=bar*BPB;
 c.p.forEach(m=>ev.push({s:'pad',b:b0,d:BPB,m,v:1}));
 BASSP.forEach(n=>ev.push({s:'bass',b:b0+n[0],d:n[1],m:c.b+n[2],v:n[3]}));
 const tn=c.p.map(m=>m+12);PULSEP[bar%2].forEach((pk,i)=>ev.push({s:'pulse',b:b0+i*.5,d:.4,m:tn[pk%3],v:i%2?.6:.85}));
 for(let k=0;k<4;k++){ev.push({s:'kick',b:b0+k,d:.2,m:0,v:1});ev.push({s:'hat',b:b0+k+.5,d:.05,m:0,v:k%2?.8:.55})}
 const ln=c.p.map(m=>m+24);LEADP.forEach(n=>ev.push({s:'lead',b:b0+n[0],d:.6,m:ln[n[1]%3],v:.9}))});
 ev.sort((a,b)=>a.b-b.b);return ev}
const VOICE={pad:{o:[['sawtooth',-7,1,1],['sawtooth',7,1,1]],pk:.05,at:.3,rl:.5,ov:.35,lp:1400},
 bass:{o:[['sine',0,1,1],['triangle',0,2,.22]],pk:.3,at:.015,rl:.12,ov:0,lp:900},
 pulse:{o:[['triangle',-4,1,1],['triangle',4,1,1]],pk:.085,at:.01,rl:.15,ov:0,lp:2600},
 lead:{o:[['square',0,1,1],['triangle',5,1,.5]],pk:.06,at:.01,rl:.2,ov:0,lp:2400}};
const STEMS=['pad','bass','pulse','drums','lead'],MUS=.7;   /* music level under the effects */
function makeEngine(ctx,live){
